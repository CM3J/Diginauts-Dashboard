                                    className="w-full px-4 py-3 bg-slate-800 border border-slate-700 rounded-lg text-slate-100 focus:border-blue-500 focus:outline-none resize-none"
                                    rows="2"
                                    placeholder="Leave blank if not resolved yet"
                                />
                            </div>
                            <button
                                onClick={addReport}
                                disabled={isSaving || !description.trim()}
                                className="w-full px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-all font-semibold disabled:opacity-50"
                            >
                                {isSaving ? "Saving…" : "Add Report"}
                            </button>
                        </div>

                        {/* HISTORY */}
                        <h3 className="text-lg font-semibold text-slate-100 mb-3">History ({reports.length})</h3>
                        <div className="space-y-3">
                            {sorted.length === 0 && (
                                <p className="text-slate-500 text-center py-4">No errors logged yet</p>
                            )}
                            {sorted.map(r => (
                                <ErrorReportEntry
                                    key={r.id}
                                    report={r}
                                    onSave={saveReport}
                                    onDelete={deleteReport}
                                    onQuickResolve={updateResolution}
                                />
                            ))}
                        </div>

                        <button
                            onClick={onClose}
                            className="w-full mt-6 px-6 py-3 bg-slate-700 text-slate-300 rounded-lg hover:bg-slate-600 transition-all font-semibold"
                        >
                            Close
                        </button>
                    </div>
                </div>
            );
        }

        // A single error-log entry with view and edit modes
        function ErrorReportEntry({ report, onSave, onDelete, onQuickResolve }) {
            const [editing, setEditing] = useState(false);
            const [date, setDate] = useState(report.date || todayISO());
            const [severity, setSeverity] = useState(report.severity || "Medium");
            const [description, setDescription] = useState(report.description || "");
            const [handledBy, setHandledBy] = useState(report.handledBy || "");
            const [resolution, setResolution] = useState(report.resolution || "");

            const startEdit = () => {
                setDate(report.date || todayISO());
                setSeverity(report.severity || "Medium");
                setDescription(report.description || "");
                setHandledBy(report.handledBy || "");
                setResolution(report.resolution || "");
                setEditing(true);
            };

            const save = () => {
                if (!description.trim()) return;
                onSave(report.id, {
                    date,
                    severity,
                    description: description.trim(),
                    handledBy: handledBy.trim(),
                    resolution: resolution.trim()
                });
                setEditing(false);
            };

            const resolved = report.resolution && report.resolution.trim();

            if (editing) {
                return (
                    <div className="p-4 bg-slate-900 rounded-lg border border-blue-500/40 space-y-3">
                        <div className="grid grid-cols-2 gap-3">
                            <div>
                                <label className="block text-xs font-medium text-slate-400 mb-1">Date</label>
                                <input type="date" value={date} onChange={e => setDate(e.target.value)} className="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg text-slate-100 text-sm focus:border-blue-500 focus:outline-none" />
                            </div>
                            <div>
                                <label className="block text-xs font-medium text-slate-400 mb-1">Severity</label>
                                <select value={severity} onChange={e => setSeverity(e.target.value)} className="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg text-slate-100 text-sm focus:border-blue-500 focus:outline-none">
                                    {SEVERITY_LEVELS.map(s => <option key={s} value={s}>{s}</option>)}
                                </select>
                            </div>
                        </div>
                        <div>
                            <label className="block text-xs font-medium text-slate-400 mb-1">What occurred *</label>
                            <textarea value={description} onChange={e => setDescription(e.target.value)} rows="3" className="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg text-slate-100 text-sm focus:border-blue-500 focus:outline-none resize-none" />
                        </div>
                        <div>
                            <label className="block text-xs font-medium text-slate-400 mb-1">Handled by</label>
                            <input type="text" value={handledBy} onChange={e => setHandledBy(e.target.value)} className="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg text-slate-100 text-sm focus:border-blue-500 focus:outline-none" placeholder="Optional" />
                        </div>
                        <div>
                            <label className="block text-xs font-medium text-slate-400 mb-1">Resolution</label>
                            <textarea value={resolution} onChange={e => setResolution(e.target.value)} rows="2" className="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg text-slate-100 text-sm focus:border-blue-500 focus:outline-none resize-none" placeholder="Leave blank if unresolved" />
                        </div>
                        <div className="flex gap-2">
                            <button onClick={save} disabled={!description.trim()} className="flex-1 px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-all text-sm font-semibold disabled:opacity-50">Save</button>
                            <button onClick={() => setEditing(false)} className="px-4 py-2 bg-slate-700 text-slate-300 rounded-lg hover:bg-slate-600 transition-all text-sm font-semibold">Cancel</button>
                        </div>
                    </div>
                );
            }

            return (
                <div className="p-4 bg-slate-900 rounded-lg border border-slate-700">
                    <div className="flex items-center justify-between mb-2">
                        <div className="flex items-center gap-2 flex-wrap">
                            <span className="text-xs text-slate-400">{formatReportDate(report.date)}</span>
                            {report.severity && (
                                <span className={`text-xs px-2 py-0.5 rounded-full border ${SEVERITY_STYLES[report.severity] || SEVERITY_STYLES.Low}`}>{report.severity}</span>
                            )}
                            <span className={`text-xs px-2 py-0.5 rounded-full border ${resolved ? "bg-emerald-500/20 text-emerald-300 border-emerald-500/30" : "bg-red-500/20 text-red-300 border-red-500/30"}`}>{resolved ? "Resolved" : "Open"}</span>
                        </div>
                        <div className="flex items-center gap-2 shrink-0">
                            <button onClick={startEdit} className="text-slate-400 hover:text-slate-200 text-sm" title="Edit">✏️</button>
                            <button onClick={() => onDelete(report.id)} className="text-red-400 hover:text-red-300 text-sm" title="Delete">✕</button>
                        </div>
                    </div>
                    <p className="text-sm text-slate-200 whitespace-pre-wrap mb-3">{report.description}</p>
                    {report.handledBy && report.handledBy.trim() && (
                        <p className="text-xs text-slate-500 mb-3">Handled by <span className="text-slate-300">{report.handledBy}</span></p>
                    )}
                    {resolved ? (
                        <div className="border-t border-slate-700 pt-2">
                            <p className="text-xs uppercase tracking-wide text-slate-500 mb-1">Resolution</p>
                            <p className="text-sm text-slate-400 whitespace-pre-wrap">{report.resolution}</p>
                        </div>
                    ) : (
                        <div className="border-t border-slate-700 pt-2">
                            <ResolutionEditor onSave={(val) => onQuickResolve(report.id, val)} />
                        </div>
                    )}
                </div>
            );
        }

        // Inline editor to add a resolution to an open report
        function ResolutionEditor({ onSave }) {
            const [value, setValue] = useState("");
            return (
                <div>
                    <p className="text-xs uppercase tracking-wide text-slate-500 mb-1">Add resolution</p>
                    <div className="flex gap-2">
                        <input
                            type="text"
                            value={value}
                            onChange={e => setValue(e.target.value)}
                            onKeyPress={e => { if (e.key === 'Enter' && value.trim()) onSave(value.trim()); }}
                            className="flex-1 px-3 py-2 bg-slate-800 border border-slate-700 rounded-lg text-slate-100 text-sm focus:border-blue-500 focus:outline-none"
                            placeholder="How was it resolved?"
                        />
                        <button
                            onClick={() => value.trim() && onSave(value.trim())}
                            className="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-all text-sm font-semibold"
                        >
                            Resolve
                        </button>
                    </div>
                </div>
            );
        }

        // --- 8. RENDER ---
        ReactDOM.render(<ClientMapApp />, document.getElementById('root'));
    </script>

    <script type="text/html" id="social-src">
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Client Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#1F2A44;
    --heading:#1F2A44;
    --slate:#5B6472;
    --gold:#B08D57;
    --green:#2F7D5A;
    --amber:#B7791F;
    --red:#B23B3B;
    --blue:#2B6CB0;
    --teal:#2C6E6B;
    --gray-soft:#EEF0F3;
    --bg:#F3F4F7;
    --card:#FFFFFF;
    --border:#E3E6EA;
    --text:#1A1F2B;
    --text-soft:#6B7280;
    --input-bg:#FCFCFD;
    --focus-ring: rgba(176,141,87,0.38);
    --font-display:'Space Grotesk', 'Arial Narrow', sans-serif;
    --font-body:'Inter', system-ui, -apple-system, sans-serif;
    --font-mono:'IBM Plex Mono', ui-monospace, 'SF Mono', monospace;
  }
  html[data-theme="dark"]{
    --heading:#D7E0F2;
    --slate:#9AA3B7;
    --gray-soft:#232838;
    --bg:#11151D;
    --card:#1A1F2B;
    --border:#2B3242;
    --text:#E7E9EE;
    --text-soft:#8A93A6;
    --input-bg:#20263349;
  }
  html{ transition:background .2s; }
  body{ transition:background .2s, color .2s; }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text); font-family:var(--font-body);
    font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
  }
  ::selection{ background:var(--gold); color:white; }
  .wrap{ max-width:1180px; margin:0 auto; padding:32px 24px 80px; }

  /* ---------- header ---------- */
  .topbar{ display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:28px; flex-wrap:wrap; gap:14px;}
  .eyebrow{ font-family:var(--font-mono); font-size:11px; letter-spacing:0.14em; color:var(--gold); font-weight:600; margin:0 0 4px; }
  h1{ font-family:var(--font-display); font-size:32px; font-weight:700; margin:0; color:var(--heading); letter-spacing:-0.01em;}
  .subline{ font-size:13px; color:var(--text-soft); margin-top:6px; }
  .subline .sep{ color:var(--border); margin:0 2px; }
  .save-indicator{ font-family:var(--font-mono); font-size:12px; color:var(--text-soft); display:inline-flex; align-items:center; gap:6px; }
  .topbar-right{ display:flex; flex-direction:column; align-items:flex-end; gap:8px; }
  .theme-toggle{
    font-family:var(--font-body); font-size:12px; font-weight:600; padding:7px 13px; border-radius:999px;
    border:1px solid var(--border); background:var(--card); color:var(--text); cursor:pointer; transition:all .15s;
  }
  .theme-toggle:hover{ border-color:var(--gold); }
  .dot{ width:7px; height:7px; border-radius:50%; background:var(--green); }
  .dot.saving{ background:var(--amber); animation:pulse 1s infinite; }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:0.35;} }

  /* ---------- pulse ---------- */
  .pulse{
    display:grid; grid-template-columns:repeat(6,1fr); gap:1px;
    background:var(--border); border:1px solid var(--border); border-radius:10px; overflow:hidden; margin-bottom:22px;
  }
  .tile{ background:var(--card); padding:18px 16px; }
  .tile .tlabel{ font-family:var(--font-mono); font-size:10px; letter-spacing:0.08em; color:var(--text-soft); text-transform:uppercase; margin-bottom:8px; }

let state = { clients: [], filterStatus: 'at-risk', search: '', sortMode: 'alpha', order: [], theme: 'dark', archiveOpen: false, activeClientId: null, editingLink: null, sops: [] };
let saveTimer = null;

function normalizeSop(sop){
  if(sop.body === undefined){
    if(Array.isArray(sop.bullets)){
      sop.body = sop.bullets.map(b=>'• '+b).join('\n');
    } else if(Array.isArray(sop.steps)){
      const stepLines = sop.steps.map(s=>`• ${(s.letter||'').toUpperCase()}: ${s.text}`);
      const flagLines = (sop.flags||[]).map(f=>'• '+f.text);
      sop.body = [...stepLines, ...flagLines].join('\n');
    } else {
      sop.body = '';
    }
  }
  delete sop.bullets;
  delete sop.steps;
  delete sop.flags;
  delete sop.type;
  return sop;
}

function normalizeClient(c){
  if(!Array.isArray(c.platformsList)){
    c.platformsList = (c.platforms||'').split(',').map(s=>s.trim()).filter(Boolean);
  }
  if(!c.scope) c.scope = {Copywriting:'',Design:'',Scheduling:''};
  if(c.lastpass===undefined) c.lastpass = 'Not yet confirmed';
  if(c.lastpassNotes===undefined) c.lastpassNotes = '';
  if(!c.errorLog) c.errorLog = [];
  if(c.aiAgentLink===undefined) c.aiAgentLink = '';
  if(c.boostedNote===undefined) c.boostedNote = '';
  return c;
}

async function loadData(){
  try{
    const res = await window.storage.get(STORAGE_KEY, false);
    if(res && res.value){
      const parsed = JSON.parse(res.value);
      state.clients = (parsed.clients || []).map(normalizeClient);
      state.order = parsed.order || state.clients.map(c=>c.id);
      state.sortMode = parsed.sortMode || 'alpha';
      state.theme = parsed.theme || 'dark';
      state.sops = (parsed.sops || DEFAULT_SOPS).map(normalizeSop);
    } else {
      state.clients = DEFAULT_CLIENTS.map(normalizeClient);
      state.order = [...state.clients].sort((a,b)=>a.name.localeCompare(b.name)).map(c=>c.id);
      state.sops = DEFAULT_SOPS;
      await persist();
    }
  } catch(e){
    state.clients = DEFAULT_CLIENTS.map(normalizeClient);
    state.order = [...state.clients].sort((a,b)=>a.name.localeCompare(b.name)).map(c=>c.id);
    state.sops = DEFAULT_SOPS;
    try{ await persist(); }catch(e2){ console.error(e2); }
  }
  document.documentElement.setAttribute('data-theme', state.theme);
  syncOrder();
  render();
}

function syncOrder(){
  const ids = state.clients.map(c=>c.id);
  state.order = state.order.filter(id => ids.includes(id));
  ids.forEach(id => { if(!state.order.includes(id)) state.order.push(id); });
}

function scheduleSave(){
  const indicator = document.getElementById('save-dot');
  if(indicator) indicator.classList.add('saving');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    await persist();
    const ind = document.getElementById('save-dot');
    if(ind) ind.classList.remove('saving');
  }, 500);
}

async function persist(){
  try{
    await window.storage.set(STORAGE_KEY, JSON.stringify({clients: state.clients, order: state.order, sortMode: state.sortMode, theme: state.theme, sops: state.sops}), false);
  }catch(e){ console.error('Save failed', e); }
}

function uid(){ return 'c_' + Math.random().toString(36).slice(2,9); }

function statusClass(status){
  const s = (status||'').toLowerCase();
  if(s.includes('active') && !s.includes('boost')) return 'st-active';
  if(s.includes('onboard')) return 'st-onboarding';
  if(s.includes('boost')) return 'st-boosting';
  if(s.includes('archive')) return 'st-archive';
  return 'st-unset';
}

function daysUntil(dateStr){
  if(!dateStr) return null;
  const d = new Date(dateStr + 'T00:00:00');
  if(isNaN(d.getTime())) return null;
  const today = new Date(); today.setHours(0,0,0,0);
  return Math.round((d - today) / 86400000);
}

function gaugeFor(client){
  const days = daysUntil(client.nextPost);
  if(days === null) return {cls:'unknown', text:'Unscheduled'};
  if(days < 0) return {cls:'late', text: Math.abs(days)+'d overdue'};
  if(days <= 7) return {cls:'late', text: days+'d — start now'};
  if(days <= 14) return {cls:'warn', text: days+'d — coming up'};
  return {cls:'ok', text: days+'d buffer'};
}

function computePulse(){
  const clients = state.clients.filter(c => statusClass(c.status) !== 'st-archive');
  const totalWeek = clients.reduce((s,c)=>s + (parseInt(c.postsWeek)||0), 0);
  const totalMonth = clients.reduce((s,c)=>s + (parseInt(c.postsMonth)||0), 0);
  let allErrors = [];
  clients.forEach(c => (c.errorLog||[]).forEach(e => allErrors.push(e)));
  const errorCount = allErrors.length;
  let lastError = null;
  allErrors.forEach(e=>{
    if(e.date){
      const d = new Date(e.date+'T00:00:00');
      if(!isNaN(d) && (!lastError || d > lastError)) lastError = d;
    }
  });
  let daysNoError = '—';
  if(lastError){
    const today = new Date(); today.setHours(0,0,0,0);
    daysNoError = Math.max(0, Math.round((today - lastError)/86400000));
  }
  const atRisk = clients.filter(c=>{
    const g = gaugeFor(c);
    return g.cls === 'warn' || g.cls === 'late';
  }).length;
  return { totalWeek, totalMonth, clientCount: clients.length, errorCount, daysNoError, atRisk };
}

/* ============================= AUTOSIZE TEXTAREAS ============================= */

function autosizeTextarea(el, maxLines){
  maxLines = maxLines || 3;
  el.style.height = 'auto';
  const cs = getComputedStyle(el);
  let lineHeight = parseFloat(cs.lineHeight);
  if(isNaN(lineHeight)) lineHeight = 19;
  const paddingV = (parseFloat(cs.paddingTop)||0) + (parseFloat(cs.paddingBottom)||0);
  const maxH = lineHeight*maxLines + paddingV;
  const newH = Math.min(el.scrollHeight, maxH);
  el.style.height = newH + 'px';
  el.style.overflowY = el.scrollHeight > maxH ? 'auto' : 'hidden';
}

function wireAutosize(container){
  container.querySelectorAll('.pv-textarea').forEach(t=>{
    autosizeTextarea(t, 3);
    t.addEventListener('input', ()=>autosizeTextarea(t, 3));
  });
  container.querySelectorAll('.sop-textarea').forEach(t=>{
    autosizeTextarea(t, Infinity);
    t.addEventListener('input', ()=>autosizeTextarea(t, Infinity));
  });
}

function wirePanel(c){
  const panel = document.getElementById('client-panel');

  document.getElementById('panel-close').onclick = closeClientPanel;

  panel.querySelectorAll('[data-field]').forEach(input=>{
    const field = input.dataset.field;
    const eventType = (input.tagName==='SELECT'||input.type==='date') ? 'change' : 'input';
    input.addEventListener(eventType, ()=>{
      let val = input.value;
      if(field === 'postsWeek' || field === 'postsMonth') val = parseInt(val)||0;
      c[field] = val;
      scheduleSave();
      if(field === 'status' || field === 'nextPost' || field === 'name'){
        render();
        document.querySelectorAll('.client').forEach(el=>el.classList.toggle('active-row', el.dataset.id === c.id));
      } else if(field === 'postsWeek' || field === 'postsMonth'){
        updatePulseOnly();
      } else if(field === 'lastpass'){
        renderPanel();
      }
    });
  });

  panel.querySelectorAll('[data-scope]').forEach(input=>{
    input.oninput = ()=>{
      c.scope = c.scope || {};
      c.scope[input.dataset.scope] = input.value;
      scheduleSave();
    };
  });

  panel.querySelectorAll('[data-err-idx]').forEach(input=>{
    const idx = parseInt(input.dataset.errIdx);
    const field = input.dataset.errField;
    input.addEventListener(input.tagName==='SELECT'?'change':'input', ()=>{
      c.errorLog[idx][field] = input.value;
      scheduleSave();
      updatePulseOnly();
    });
  });

  panel.querySelectorAll('[data-rm-err]').forEach(btn=>{
    btn.onclick = ()=>{
      c.errorLog.splice(parseInt(btn.dataset.rmErr),1);
      scheduleSave();
      renderPanel();
      updatePulseOnly();
    };
  });

  const addErrBtn = document.getElementById('add-err-btn');
  if(addErrBtn){
    addErrBtn.onclick = ()=>{
      c.errorLog = c.errorLog || [];
      c.errorLog.push({date:'', description:'', resolved:'N'});
      scheduleSave();
      renderPanel();
    };
  }

  // link chip edit/save wiring (Content Calendar + AI Agent)
  panel.querySelectorAll('[data-editlink]').forEach(btn=>{
    btn.onclick = ()=>{
      state.editingLink = btn.dataset.editlink;
      renderPanel();
      const inp = panel.querySelector('.link-edit-input');
      if(inp){ inp.focus(); inp.select(); }
    };
  });
  const saveLinkFn = (field)=>{
    const inp = panel.querySelector(`[data-linkfield="${field}"]`);
    if(inp) c[field] = inp.value.trim();
    state.editingLink = null;
    scheduleSave();
    renderPanel();
  };
  panel.querySelectorAll('[data-savelink]').forEach(btn=>{
    btn.onclick = ()=> saveLinkFn(btn.dataset.savelink);
  });
  panel.querySelectorAll('.link-edit-input').forEach(inp=>{
    inp.addEventListener('keydown', (e)=>{
      if(e.key === 'Enter'){ e.preventDefault(); saveLinkFn(inp.dataset.linkfield); }
    });
  });

  // platform tag editor wiring
  const platformInput = document.getElementById('platform-input');
  if(platformInput){
    platformInput.addEventListener('keydown', (e)=>{
      if(e.key === 'Enter' || e.key === ','){
        e.preventDefault();
        const val = platformInput.value.replace(/,/g,'').trim();
        if(val){
          c.platformsList.push(val);
          c.platforms = c.platformsList.join(', ');
          scheduleSave();
          renderPanel();
        }
      }
    });
  }
  panel.querySelectorAll('[data-rm-platform]').forEach(btn=>{
    btn.onclick = ()=>{
      c.platformsList.splice(parseInt(btn.dataset.rmPlatform),1);
      c.platforms = c.platformsList.join(', ');
      scheduleSave();
      renderPanel();
    };
  });
}

(function(){
  var SYNC_KEYS = ["digi_creative_v9"];
  var status = document.getElementById('boot-status');
  var statusText = document.getElementById('boot-status-text');
  function setStatus(cls, msg){ status.className = cls; statusText.textContent = msg; }

  function runApp(){
    var code = document.getElementById('app-code').textContent;
    var s = document.createElement('script');
    s.textContent = code;
    document.body.appendChild(s);
  }

  try {
    firebase.initializeApp({
    apiKey: "AIzaSyAAvxcoVE8ZpvG4OC5VKuNnfzuLxidL83U",
    authDomain: "points-dashboard-78c0b.firebaseapp.com",
    projectId: "points-dashboard-78c0b",
    storageBucket: "points-dashboard-78c0b.firebasestorage.app",
    messagingSenderId: "456742475224",
    appId: "1:456742475224:web:7b73cf082db54daa488ead"
  });
  } catch(e){ /* already initialized */ }
  var db = firebase.firestore();
  var docRef = db.collection('artifacts').doc('client-map-master-v1')
                 .collection('public').doc('data')
                 .collection('creative').doc('state');

  var saveTimer = null;
  var lastSent = {};

  function attachShim(){
    var origSet = localStorage.setItem.bind(localStorage);
    localStorage.setItem = function(k, v){
      origSet(k, v);
      if (SYNC_KEYS.indexOf(k) === -1) return;
      lastSent[k] = v;
      clearTimeout(saveTimer);
      saveTimer = setTimeout(function(){
        setStatus('', 'Saving…');
        var payload = { updatedAt: Date.now() };
        for (var i=0; i<SYNC_KEYS.length; i++){
          var kk = SYNC_KEYS[i];
          var val = localStorage.getItem(kk);
          if (val !== null) payload[kk] = val;
        }
        docRef.set(payload, { merge:true })
              .then(function(){ setStatus('ok', 'Synced'); })
              .catch(function(err){
                console.error('Firestore save failed', err);
                setStatus('err', 'Save error');
              });
      }, 600);
    };
  }

  setStatus('', 'Loading from cloud…');
  docRef.get().then(function(snap){
    if (snap.exists){
      var data = snap.data() || {};
      for (var i=0; i<SYNC_KEYS.length; i++){
        var kk = SYNC_KEYS[i];
        if (typeof data[kk] === 'string') {
          // Use the raw setter (shim not yet installed) so we don't fire a write-back
          localStorage.setItem(kk, data[kk]);
        }
      }
    }
    attachShim();
    setStatus('ok', 'Synced');
    runApp();
  }).catch(function(err){
    console.error('Firestore load failed', err);
    setStatus('err', 'Offline — local only');
    attachShim(); // still mirror writes; they'll fail but won't block the app
    runApp();
  });
})();

<script>
(function(){
  var SYNC_KEYS = ["digi_tech_dash_v1","digi_tech_dash_drive_link"];
  var status = document.getElementById('boot-status');
  var statusText = document.getElementById('boot-status-text');
  function setStatus(cls, msg){ status.className = cls; statusText.textContent = msg; }

  function runApp(){
    var code = document.getElementById('app-code').textContent;
    var s = document.createElement('script');
    s.textContent = code;
    document.body.appendChild(s);
  }

  try {
    firebase.initializeApp({
    apiKey: "AIzaSyAAvxcoVE8ZpvG4OC5VKuNnfzuLxidL83U",
    authDomain: "points-dashboard-78c0b.firebaseapp.com",
    projectId: "points-dashboard-78c0b",
    storageBucket: "points-dashboard-78c0b.firebasestorage.app",
    messagingSenderId: "456742475224",
    appId: "1:456742475224:web:7b73cf082db54daa488ead"
  });
  } catch(e){ /* already initialized */ }
  var db = firebase.firestore();
  var docRef = db.collection('artifacts').doc('client-map-master-v1')
                 .collection('public').doc('data')
                 .collection('tech').doc('state');

  var saveTimer = null;
  var lastSent = {};

  function attachShim(){
    var origSet = localStorage.setItem.bind(localStorage);
    localStorage.setItem = function(k, v){
      origSet(k, v);
      if (SYNC_KEYS.indexOf(k) === -1) return;
      lastSent[k] = v;
      clearTimeout(saveTimer);
      saveTimer = setTimeout(function(){
        setStatus('', 'Saving…');
        var payload = { updatedAt: Date.now() };
        for (var i=0; i<SYNC_KEYS.length; i++){
          var kk = SYNC_KEYS[i];
          var val = localStorage.getItem(kk);
          if (val !== null) payload[kk] = val;
        }
        docRef.set(payload, { merge:true })
              .then(function(){ setStatus('ok', 'Synced'); })
              .catch(function(err){
                console.error('Firestore save failed', err);
                setStatus('err', 'Save error');
              });
      }, 600);
    };
  }

  setStatus('', 'Loading from cloud…');
  docRef.get().then(function(snap){
    if (snap.exists){
      var data = snap.data() || {};
      for (var i=0; i<SYNC_KEYS.length; i++){
        var kk = SYNC_KEYS[i];
        if (typeof data[kk] === 'string') {
          // Use the raw setter (shim not yet installed) so we don't fire a write-back
          localStorage.setItem(kk, data[kk]);
        }
      }
    }
    attachShim();
    setStatus('ok', 'Synced');
    runApp();
  }).catch(function(err){
    console.error('Firestore load failed', err);
    setStatus('err', 'Offline — local only');
    attachShim(); // still mirror writes; they'll fail but won't block the app
    runApp();
  });
})();

    <script>
      (function(){
        var tabs = document.querySelectorAll('.cmshell-tab');
        var panels = {
          clientmap: document.getElementById('tab-clientmap'),
          social:    document.getElementById('tab-social'),
          creative:  document.getElementById('tab-creative'),
          tech:      document.getElementById('tab-tech')
        };
        var frames = {
          social:   { el: document.getElementById('social-frame'),   src: 'social-src',   loaded:false },
          creative: { el: document.getElementById('creative-frame'), src: 'creative-src', loaded:false },
          tech:     { el: document.getElementById('tech-frame'),     src: 'tech-src',     loaded:false }
        };
        function sizeFrame(el){
          var bar = document.getElementById('cmshell-tabs');
          el.style.height = (window.innerHeight - bar.offsetHeight) + 'px';
        }
        function inject(key){
          var f = frames[key];
          if(!f || f.loaded) return;
          var raw = document.getElementById(f.src).textContent;
          f.el.srcdoc = raw.split('@@SCRIPT_CLOSE@@').join('</'+'script>');
          f.loaded = true;
        }
        function activate(name){
          tabs.forEach(function(t){ t.classList.toggle('active', t.dataset.tab===name); });
          Object.keys(panels).forEach(function(k){ panels[k].hidden = (k!==name); });
          if(frames[name]){ inject(name); sizeFrame(frames[name].el); }
        }
        tabs.forEach(function(t){ t.onclick = function(){ activate(t.dataset.tab); }; });
        window.addEventListener('resize', function(){
          Object.keys(frames).forEach(function(k){
            if(!panels[k].hidden) sizeFrame(frames[k].el);
          });
        });
        activate('clientmap');
      })();
    </script>
