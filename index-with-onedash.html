        const active = clientTab===tab.key;
        return <button key={tab.key} onClick={()=>{ if(tab.key==="tech" && clientTab==="tech") setTechSub("board"); setClientTab(tab.key); setSearch(""); setSearchOpen(false); }} style={{background:active?"var(--inv)":"transparent",border:`1px solid ${active?"var(--inv)":T.border}`,borderRadius:999,padding:"6px 16px",cursor:"pointer",fontSize:12.5,fontWeight:active?700:600,color:active?"var(--inv-fg)":T.text2,fontFamily:"inherit",transition:"all .15s",whiteSpace:"nowrap"}}>{tab.label}</button>;
      })}
      <div ref={searchWrapRef} style={{position:"relative",flex:1,maxWidth:520,marginLeft:10}}>
        <span style={{position:"absolute",left:12,top:"50%",transform:"translateY(-50%)",color:T.text3,display:"flex"}}><Icon n="search" size={14}/></span>
        <input ref={searchInputRef} value={search} onChange={e=>{setSearch(e.target.value);setSearchOpen(true);}} onFocus={()=>setSearchOpen(true)} placeholder={"Search "+searchServiceLabel+"…"}
          style={{width:"100%",background:T.bg,border:`1px solid ${searchOpen?T.border2:T.border}`,borderRadius:999,padding:"7px 64px 7px 34px",color:T.text,fontSize:12.5,fontFamily:"inherit",outline:"none",transition:"border-color .15s"}}/>
        <span style={{position:"absolute",right:10,top:"50%",transform:"translateY(-50%)",fontFamily:MONO,fontSize:10,color:T.text3,background:T.surface2,border:`1px solid ${T.border}`,borderRadius:6,padding:"1px 7px"}}>Ctrl K</span>
        {searchOpen && (
          <div style={{position:"absolute",top:"calc(100% + 8px)",left:0,right:0,minWidth:420,zIndex:300,background:T.surface,border:`1px solid ${T.border2}`,borderRadius:14,overflow:"hidden",boxShadow:"0 16px 48px rgba(0,0,0,.7)",animation:"fadeIn .12s ease",maxHeight:"70vh",overflowY:"auto"}}>
            {clientHits.length>0 && <>
              <div style={{padding:"8px 14px 4px",fontSize:10,fontWeight:700,color:T.text3,letterSpacing:"0.08em",textTransform:"uppercase"}}>Clients</div>
              {clientHits.map(c=>(
                <div key={c.id} onClick={()=>pickSearch(()=>{ if(c._social) setSocialActiveId(c.id); else { setActiveId(c.id); if(clientTab==="tech" && techSub!=="overview") setTechSub("board"); } })} style={{display:"flex",alignItems:"center",gap:10,padding:"8px 14px",cursor:"pointer"}} onMouseEnter={e=>e.currentTarget.style.background=T.surface2} onMouseLeave={e=>e.currentTarget.style.background="transparent"}>
                  <div style={{width:22,height:22,borderRadius:6,background:c.color||T.accent,display:"flex",alignItems:"center",justifyContent:"center",fontSize:9,fontWeight:800,color:"#fff"}}>{ini(c.name)}</div>
                  <span style={{fontSize:13,color:T.text,fontWeight:600}}>{c.name}</span>
                </div>
              ))}
            </>}
            {taskHits.length>0 && <>
              <div style={{padding:"8px 14px 4px",fontSize:10,fontWeight:700,color:T.text3,letterSpacing:"0.08em",textTransform:"uppercase",borderTop:clientHits.length?`1px solid ${T.border}`:"none"}}>Tasks</div>
              {taskHits.map(r=>{
                const cl = data.clients.find(c=>c.id===r.cId); const st = statusOf(r._kind,r.status);
                return (
                  <div key={r.id} onClick={()=>pickSearch(()=>goTo(r._kind,r))} style={{display:"flex",alignItems:"center",gap:10,padding:"8px 14px",cursor:"pointer"}} onMouseEnter={e=>e.currentTarget.style.background=T.surface2} onMouseLeave={e=>e.currentTarget.style.background="transparent"}>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontSize:13,fontWeight:600,color:T.text,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{r.title}</div>
                      <div style={{fontSize:10,color:T.text3,marginTop:1}}>{cl?.name} · {KINDS[r._kind].label}</div>
                    </div>
                    <span style={{fontSize:10,fontWeight:700,color:st.text,background:st.bg,borderRadius:10,padding:"1px 8px",flexShrink:0,whiteSpace:"nowrap"}}>{st.label}</span>
                  </div>
                );
              })}
            </>}
            {ql.length>=2 && clientHits.length===0 && taskHits.length===0 && <div style={{padding:"12px 14px",color:T.text3,fontSize:13}}>No clients or tasks match "{search}"</div>}
            {cmdHits.length>0 && <>
              <div style={{padding:"8px 14px 4px",fontSize:10,fontWeight:700,color:T.text3,letterSpacing:"0.08em",textTransform:"uppercase",borderTop:(clientHits.length||taskHits.length)?`1px solid ${T.border}`:"none"}}>Commands</div>
              {cmdHits.map(c=>(
                <div key={c.label} onClick={()=>pickSearch(c.run)} style={{display:"flex",alignItems:"center",gap:10,padding:"8px 14px",cursor:"pointer"}} onMouseEnter={e=>e.currentTarget.style.background=T.surface2} onMouseLeave={e=>e.currentTarget.style.background="transparent"}>
                  <Icon n="chevron" size={12} style={{color:T.text3}}/><span style={{fontSize:13,color:T.text}}>{c.label}</span>{c.hint && <span style={{fontSize:11,color:T.text4}}>{c.hint}</span>}
                </div>
              ))}
            </>}
          </div>
        )}
      </div>
      <SyncBadge status={syncStatus} retry={retrySync}/>
      <button onClick={toggleTheme} title={theme==="dark"?"Switch to light mode":"Switch to dark mode"} aria-label="Toggle light or dark mode" style={{background:"rgba(var(--ovc),.06)",border:`1px solid ${T.border}`,borderRadius:999,width:32,height:32,display:"inline-flex",alignItems:"center",justifyContent:"center",cursor:"pointer",color:T.text,flexShrink:0}}>
        {theme==="dark"
          ? <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          : <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>}
      </button>
      <div ref={toolsRef} style={{position:"relative"}}>
        <HBtn onClick={()=>setToolsOpen(o=>!o)} active={toolsOpen}>Menu</HBtn>
        {toolsOpen && (
          <div style={{position:"absolute",top:"calc(100% + 8px)",right:0,minWidth:210,zIndex:300,background:T.surface2,border:`1px solid ${T.border2}`,borderRadius:12,padding:4,boxShadow:"0 12px 36px rgba(0,0,0,.65)"}}>
            {[
              {label:data.meetingMode?"Meeting mode: on":"Meeting mode: off",run:()=>upd(d=>{d.meetingMode=!d.meetingMode;})},
              {label:"Agency Tools",run:()=>{setClientTab("tech");setTechSub("agencytools");setSearch("");setAtPreset({v:"All",n:Date.now()});}},
              {label:"Subscriptions",run:()=>{setClientTab("tech");setTechSub("agencytools");setSearch("");setAtPreset({v:"__paid",n:Date.now()});}},
              {label:"Client Site Register",run:()=>{setClientTab("tech");setTechSub("register");setSearch("");}}
            ].map(it=>(
              <div key={it.label} onClick={()=>{setToolsOpen(false);it.run();}} style={{padding:"8px 12px",borderRadius:8,cursor:"pointer",fontSize:12.5,color:T.text}} onMouseEnter={e=>e.currentTarget.style.background="rgba(var(--ovc),.07)"} onMouseLeave={e=>e.currentTarget.style.background="transparent"}>{it.label}</div>
            ))}
          </div>
        )}
      </div>
    </div>
  );

  // Sub-navigation row (service specific), sits directly under the service buttons
  const renderSubNav = () => {
    const subTab = (label, active, onClick) => (
      <button key={label} onClick={onClick} style={{background:active?"var(--inv)":"transparent",border:`1px solid ${active?"var(--inv)":T.border}`,borderRadius:999,padding:"5px 14px",cursor:"pointer",fontSize:12,fontWeight:active?700:600,color:active?"var(--inv-fg)":T.text2,fontFamily:"inherit",transition:"all .15s",whiteSpace:"nowrap"}}>{label}</button>
    );
    const tabs = [];
    const onBoard = inTasks && !(clientTab==="social" && socialSub==="overview");
    if (clientTab==="social") {
      tabs.push(subTab("Overview", socialSub==="overview", ()=>{setTechSub("board");setSocialSub("overview");}));
      tabs.push(subTab("Board", onBoard, ()=>{setTechSub("board");setSocialSub("board");}));
    } else {
      tabs.push(subTab("Overview", effSub==="overview", ()=>setTechSub("overview")));
      tabs.push(subTab("Board", onBoard, ()=>setTechSub("board")));
      if (clientTab==="tech") {
        tabs.push(subTab("Agency Tools", techSub==="agencytools", ()=>setTechSub("agencytools")));
        tabs.push(subTab("Client Site Register", techSub==="register", ()=>setTechSub("register")));
      }
    }
    return (
      <div style={{display:"flex",alignItems:"center",gap:8,padding:"10px 16px",borderBottom:`1px solid ${T.border}`,flexShrink:0,background:T.surface,flexWrap:"wrap"}}>
        <div style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}}>{tabs}</div>
      </div>
    );
  };

  const renderHeader = () => {
    if (clientTab==="social" && socialSub==="overview") return null;
    const hc = isSocialBoard ? boardClients.find(c=>c.id===boardActiveId) : client;
    if (!inTasks || !hc) return null;
    const client_ = hc;
    const tier = isSocialBoard ? null : TIERS.find(t=>t.key===hc.tier);
    const arrow = (dir) => (
      <button onClick={()=>cycleClient(dir)} disabled={!canCycle(dir)} title={dir<0?"Previous client":"Next client"} style={{width:22,height:18,borderRadius:6,background:"rgba(var(--ovc),.06)",border:`1px solid ${T.border}`,color:T.text2,cursor:canCycle(dir)?"pointer":"default",opacity:canCycle(dir)?1:0.3,display:"flex",alignItems:"center",justifyContent:"center",padding:0}}
        onMouseEnter={e=>{ if(canCycle(dir)) e.currentTarget.style.background="rgba(var(--ovc),.14)"; }} onMouseLeave={e=>e.currentTarget.style.background="rgba(var(--ovc),.06)"}>
        <Icon n="chevron" size={11} style={{transform:`rotate(${dir<0?-90:90}deg)`}}/>
      </button>
    );
    return (
      <div style={{padding:"14px 22px 12px",background:T.surface,borderBottom:`1px solid ${T.border}`,flexShrink:0}}>
        <div style={{display:"flex",alignItems:"center",gap:12}}>
          <div style={{display:"flex",flexDirection:"column",gap:3}}>{arrow(-1)}{arrow(1)}</div>
          <div style={{width:38,height:38,borderRadius:10,background:hc.color||T.accent,display:"flex",alignItems:"center",justifyContent:"center",fontSize:13,fontWeight:800,color:"#fff",flexShrink:0}}>{ini(hc.name)}</div>
          <div style={{flex:1,minWidth:0}}>
            <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
              <span style={{fontWeight:800,fontSize:17,color:T.text}}>{hc.name}</span>
              {tier && <span style={{fontSize:10,fontWeight:700,color:tier.dt,background:tier.db,border:`1px solid ${tier.dbr}`,borderRadius:10,padding:"1px 8px"}}>{tier.label}</span>}
              {data.meetingMode && <span style={{fontSize:10,fontWeight:700,color:"#ffd60a",background:"rgba(255,214,0,.12)",border:"1px solid rgba(255,214,0,.3)",borderRadius:10,padding:"1px 8px"}}>MEETING</span>}
              {isSocialBoard ? <><SocialBadge status={hc._social.status}/><Gauge client={hc._social}/></> : <>
              <LifecyclePill c={client} service={clientTab} onChange={updateClientLifecycle}/></>}
              {!isSocialBoard && <button onClick={()=>openClient(client)} title="Edit client" style={{background:"none",border:"none",cursor:"pointer",color:T.text3,display:"flex",padding:2}}><Icon n="edit" size={13}/></button>}
            </div>
            <div style={{fontSize:11,color:T.text3,marginTop:2}}>{hc.cat} · {hc.region}</div>
          </div>
          <div style={{display:"flex",gap:6,alignItems:"center",flexShrink:0}}>
            {clientTab!=="social" && <HBtn onClick={()=>client&&setSuperComms("overview")}>Overview</HBtn>}
            {openDriveUrl ? <HBtn href={openDriveUrl}>G.Drive</HBtn> : <HBtn onClick={()=>client&&setSuperComms("resources")}>G.Drive</HBtn>}
            <Btn variant="primary" onClick={()=>openNew(clientTab)}><Icon n="plus" size={13}/>Task</Btn>
          </div>
        </div>
      </div>
    );
  };

  // ── Board (two columns, flat rows; PPC keeps its section groups) ─────────
  const renderBoard = kind => {
    const all = visibleOf(kind).filter(i=>i.cId===boardActiveId);
    const ids = new Set(all.map(i=>i.id));
    const SORT_RANK = {urgent:0,review:1,progress:2,revision:3,client:4,awaiting:4,todo:5,blocked:6,deliver:7,done:7,completed:8};
    const top = all.filter(i=>!i.parentId || !ids.has(i.parentId)).map((t,i)=>({t,i})).sort((a,b)=>((SORT_RANK[a.t.status]??9)-(SORT_RANK[b.t.status]??9))||a.i-b.i).map(x=>x.t);
    const noteKey = kind==="creative" ? boardActiveId : boardActiveId+"_"+kind;
    const archived = (data.archive||[]).filter(a=>a.cId===boardActiveId && kindOfEntry(a)===kind);
    const deleted = (data.deleted||[]).filter(a=>a.cId===boardActiveId && kindOfEntry(a)===kind);
    const rowProps = {kind,all,clients:boardClients,onOpen:t=>setCardCtx({kind,id:t.id}),onStatus:(id,n)=>changeStatus(kind,id,n),onToggleFollowUp:toggleFollowUp,onToggleUrgent:toggleUrgent,highlightedId,hoveredId,setHoveredId,meetingMode:data.meetingMode};
    const cols = [{key:"review",title:"Review / Close Off",preset:{status:"review"}},{key:"active",title:"Active",preset:{status:"todo"}}];
    const rowFor = t => <TaskRow key={t.id} task={t} {...rowProps}/>;
    const renderItems = items => {
      if (kind==="tech") {
        const apps = items.filter(i=>i.section==="appbuild"), rest = items.filter(i=>i.section!=="appbuild");
        return <>{rest.map(rowFor)}{apps.length>0 && <div style={{marginTop:rest.length?12:0}}>
          <div style={{display:"flex",alignItems:"center",gap:8,margin:"4px 2px 8px"}}><span style={{width:3,height:14,borderRadius:2,background:"#ff6b00"}}/><span style={{fontSize:11,fontWeight:700,color:T.text2,letterSpacing:"0.06em",textTransform:"uppercase"}}>App Builds</span><span style={{fontSize:10,fontWeight:700,color:T.text4,background:"rgba(var(--ovc),.07)",borderRadius:10,padding:"1px 7px"}}>{apps.length}</span></div>
          {apps.map(rowFor)}</div>}</>;
      }
      if (kind!=="ppc") return items.map(rowFor);
      const known = new Set(PPC_SECTIONS.map(s=>s.key));
      const groups = [...PPC_SECTIONS, {key:"__other",label:"Other",color:"#8e8e93"}];
      return groups.map(sec=>{
        const its = items.filter(i=>sec.key==="__other" ? !known.has(i.type) : i.type===sec.key);
        if (!its.length) return null;
        return (
          <div key={sec.key} style={{marginBottom:12}}>
            <div style={{display:"flex",alignItems:"center",gap:8,margin:"4px 2px 8px"}}>
              <span style={{width:3,height:14,borderRadius:2,background:sec.color}}/>
              <span style={{fontSize:11,fontWeight:700,color:T.text2,letterSpacing:"0.06em",textTransform:"uppercase"}}>{sec.label}</span>
              <span style={{fontSize:10,fontWeight:700,color:T.text4,background:"rgba(var(--ovc),.07)",borderRadius:10,padding:"1px 7px"}}>{its.length}</span>
            </div>
            {its.map(rowFor)}
          </div>
        );
      });
    };
    const footBtn = (k,label,count) => <button key={k} onClick={()=>setFooterOpen(footerOpen===k?null:k)} style={{background:footerOpen===k?"rgba(var(--ovc),.08)":"transparent",border:`1px solid ${footerOpen===k?T.border2:T.border}`,borderRadius:8,padding:"4px 11px",cursor:"pointer",fontSize:11,fontWeight:600,color:footerOpen===k?T.text:T.text2,fontFamily:"inherit"}}>{label}{count!==undefined?` (${count})`:""}</button>;
    const miniRow = (a,src) => (
      <div key={a.id} style={{display:"flex",alignItems:"center",gap:8,padding:"6px 10px",borderRadius:8,background:"rgba(var(--ovc),.03)",marginBottom:4}}>
        <span style={{fontSize:12,color:src==="deleted"?"#ff6b6b":T.text3,textDecoration:src==="archive"?"line-through":"none",flex:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{a.title}</span>
        <Btn size="sm" onClick={()=>restoreEntry(src==="deleted"?"deleted":"archive",a.id)}>Restore</Btn>
        {src==="deleted" && <ConfirmBtn label="Purge" confirmLabel="Sure?" onConfirm={()=>purgeEntry(a.id)} style={{background:"rgba(255,59,48,.15)",color:"#ff3b30",border:"1px solid rgba(255,59,48,.25)",borderRadius:8,padding:"4px 10px",cursor:"pointer",fontSize:11,fontWeight:600,fontFamily:"inherit"}}/>}
      </div>
    );
    return (
      <div style={{height:"100%",display:"flex",flexDirection:"column",minHeight:0}}>
        <div style={{flex:1,minHeight:0,display:"grid",gridTemplateColumns:"1fr 1fr"}}>
          {cols.map((col,i)=>{
            const items = top.filter(t=>colOf(kind,t.status)===col.key);
            return (
              <div key={col.key} style={{minHeight:0,display:"flex",flexDirection:"column",borderLeft:i?`1px solid ${T.border}`:"none",padding:"20px 22px 0"}}>
                <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:16,flexShrink:0}}>
                  <h2 style={{fontSize:21,fontWeight:400,color:T.text,letterSpacing:"-0.01em"}}>{col.title}</h2>
                  <span style={{fontSize:11,fontWeight:700,color:T.text3,background:"rgba(var(--ovc),.07)",borderRadius:10,padding:"1px 8px"}}>{items.length}</span>
                  <Btn size="sm" variant="ghost" style={{marginLeft:"auto"}} onClick={()=>openNew(kind,col.preset)}><Icon n="plus" size={11}/>Add</Btn>
                </div>
                <div style={{flex:1,overflowY:"auto",paddingRight:4,paddingBottom:20}}>
                  {items.length===0 && <div style={{padding:"8px 4px",fontSize:12,color:T.text4,fontStyle:"italic"}}>Nothing here yet</div>}
                  {renderItems(items)}
                </div>
              </div>
            );
          })}
        </div>
        {footerOpen && (
          <div style={{flexShrink:0,borderTop:`1px solid ${T.border}`,background:T.surface,padding:"12px 22px",maxHeight:230,overflowY:"auto"}}>
            {footerOpen==="notes" && <textarea value={(data.notes||{})[noteKey]||""} onChange={e=>saveNote(noteKey,e.target.value)} placeholder={kind==="ppc"?"PPC strategy notes for this client...":"Internal notes for this client..."} style={{width:"100%",background:T.surface2,border:`1px solid ${T.border}`,borderRadius:10,padding:"8px 10px",color:T.text,fontSize:13,fontFamily:"inherit",resize:"vertical",minHeight:90,outline:"none"}}/>}
            {footerOpen==="archive" && (archived.length===0 ? <div style={{fontSize:12,color:T.text3}}>Nothing archived.</div> : archived.map(a=>miniRow(a,"archive")))}
            {footerOpen==="deleted" && (deleted.length===0 ? <div style={{fontSize:12,color:T.text3}}>Nothing deleted.</div> : deleted.map(a=>miniRow(a,"deleted")))}
          </div>
        )}
        <div style={{flexShrink:0,borderTop:`1px solid ${T.border}`,background:T.surface,padding:"8px 22px",display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}}>
          {footBtn("notes","Notes")}
          {footBtn("archive","Archive",archived.length)}
          {footBtn("deleted","Deleted",deleted.length)}
          {kind==="tech" && client && (client.tech?.cms||client.tech?.hosting) && (
            <div style={{marginLeft:"auto",display:"flex",gap:6,flexWrap:"wrap"}}>
              {[["CMS",client.tech?.cms],["Hosting",client.tech?.hosting],["Security",client.tech?.security],["Tracking",client.tech?.tracking]].map(([k,v])=>v?(
                <span key={k} style={{fontSize:11,color:T.text2,background:"rgba(var(--ovc),.05)",borderRadius:8,padding:"2px 9px"}}><span style={{color:T.text3}}>{k}: </span>{v}</span>
              ):null)}
            </div>
          )}
        </div>
      </div>
    );
  };

  // Technical Services > Agency Stack
  const toolsCategories = [...new Set((data.techStack||[]).map(s=>s.category))];
  const filteredTools = toolsFilter==="All" ? (data.techStack||[]) : (data.techStack||[]).filter(s=>s.category===toolsFilter);
  // Technical Services > Agency Stack
  const renderTechTools = () => (
    <div style={{height:"100%",overflowY:"auto",display:"flex",flexDirection:"column"}}>
      <div style={{padding:"14px 16px",borderBottom:`1px solid ${T.border}`,display:"flex",alignItems:"center",gap:10,flexShrink:0,position:"sticky",top:0,background:T.surface,zIndex:5}}>
        <span style={{fontWeight:700,fontSize:14,color:T.text}}>Agency Stack</span>
        <div style={{display:"flex",gap:4,flex:1,flexWrap:"wrap"}}>
          {["All",...toolsCategories].map(c=>(
            <button key={c} onClick={()=>setToolsFilter(c)} style={{background:toolsFilter===c?"rgba(79,127,255,.15)":"transparent",border:`1px solid ${toolsFilter===c?"rgba(79,127,255,.35)":T.border}`,borderRadius:6,padding:"3px 10px",cursor:"pointer",fontSize:11,fontWeight:600,color:toolsFilter===c?T.accent:T.text3,fontFamily:"inherit"}}>{c}</button>
          ))}
        </div>
        <Btn size="sm" variant="primary" onClick={()=>{setForm({name:"",category:"CMS",status:"approved",usedFor:"",notes:""});setModal("stack");}}>+ Add</Btn>
      </div>
      <div style={{padding:"12px 16px",display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(280px,1fr))",gap:10,overflowY:"auto"}}>
        {filteredTools.map(s=>{
          const ap = AP[s.status]||AP.approved;
          return (
            <div key={s.id} style={{background:T.surface2,border:`1px solid ${T.border}`,borderRadius:8,padding:"12px 14px"}}>
              <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",gap:8,marginBottom:6}}>
                <div>
                  <div style={{fontWeight:700,fontSize:14,color:T.text,marginBottom:2}}>{s.name}</div>
                  <div style={{fontSize:11,color:T.text3}}>{s.category}</div>
                </div>
                <span style={{fontSize:10,fontWeight:700,color:ap.bg,background:`${ap.bg}22`,border:`1px solid ${ap.bg}44`,borderRadius:10,padding:"2px 8px",flexShrink:0}}>{ap.label}</span>
              </div>
              {s.usedFor && <div style={{fontSize:12,color:T.text2,marginBottom:4}}>{s.usedFor}</div>}
              {s.notes && <div style={{fontSize:11,color:T.text3,borderTop:`1px solid ${T.border}`,paddingTop:6,marginTop:4}}>{s.notes}</div>}
              <div style={{marginTop:8,display:"flex",gap:6,flexWrap:"wrap"}}>
                <Btn size="sm" onClick={()=>{setForm({_id:s.id,...s});setModal("stack");}}>Edit</Btn>
                {APPROVAL.filter(a=>a.key!==s.status).map(a=>(
                  <Btn key={a.key} size="sm" onClick={()=>changeStackStatus(s.id,a.key)} style={{fontSize:10,color:a.bg,background:`${a.bg}18`,border:`1px solid ${a.bg}33`}}>{a.label}</Btn>
                ))}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );

  // Technical Services > Client Site Register
  // Technical Services > Client Site Register

          </div>
          <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
            {cols.map(col=>{
              const val = registerFilters[col.key]||"All";

  // ── Modals ───────────────────────────────────────────────────────────────
  const renderModals = () => (

      {cardCtx && (()=>{
        const kind = cardCtx.kind;
        const common = {kind,clients:isSocialBoard?socialBoardClients:sortedClients,people,activeId:boardActiveId,onClose:()=>setCardCtx(null),getParents:getParents(kind)};
        if (cardCtx.isNew) {
          return <NewTaskDialog key="new" kind={kind} preset={cardCtx.preset} clients={isSocialBoard?socialBoardClients:sortedClients} people={people} activeId={boardActiveId} getParents={getParents(kind)} onClose={()=>setCardCtx(null)}
            onCreate={(f,mode)=>{ const id=createTask(kind,f); if(!id) return; const k=createdKind.current||kind; if(mode==="open") setCardCtx({kind:k,id}); else if(mode==="close") setCardCtx(null); }}/>;
        }
        const task = listOf(kind).find(x=>x.id===cardCtx.id);
        if (!task) return null;
        return <TaskCard key={task.id} {...common} task={task}
          subtasks={listOf(kind).filter(x=>x.parentId===task.id)}
          onPatch={(id,patch)=>patchTask(kind,id,patch)}
          onStatus={(id,n)=>changeStatus(kind,id,n)}
          onCreate={()=>{}}
          onDelete={id=>{ deleteTask(kind,id); }}
          onArchive={id=>changeStatus(kind,id,"archive")}
          onOpenTask={s=>setCardCtx({kind,id:s.id})}
          onAddSub={title=>createTask(kind,{title,parentId:task.id,cId:task.cId,type:task.type,section:task.section,status:"todo"})}
          onAddComment={(id,text)=>addComment(kind,id,text)}
          onDeleteComment={(id,cid)=>deleteComment(kind,id,cid)}/>;

          <Field label="Name"><FIn value={form.name||""} onChange={v=>setForm(f=>({...f,name:v}))} placeholder="Client name"/></Field>

          </div>

              <FIn value={form.color||T.accent} onChange={v=>setForm(f=>({...f,color:v}))} placeholder="#4f7fff"/>

              <FSel value={form.status||"approved"} onChange={v=>setForm(f=>({...f,status:v}))}>
                {APPROVAL.map(a=><option key={a.key} value={a.key}>{a.label}</option>)}
              </FSel>
            </Field>
          </div>
          <Field label="Used For"><FIn value={form.usedFor||""} onChange={v=>setForm(f=>({...f,usedFor:v}))} placeholder="Primary CMS..."/></Field>

        </Modal>
      )}
      {cmImport && <ClientMapImport onClose={()=>setCmImport(false)} onImport={importSnapshot}/>}
      {backupModal==="backup" && (
        <Modal title="Backup Data" onClose={()=>setBackupModal(null)} footer={<><Btn onClick={()=>setBackupModal(null)}>Close</Btn><Btn variant="primary" onClick={()=>{exportData();setBackupModal(null);}}>Download JSON</Btn></>}>
          <div style={{color:T.text2,fontSize:13,lineHeight:1.6}}>
            <p>Download a full JSON backup of all clients, tasks, social media data and settings.</p>

      {backupModal==="restore" && (
        <Modal title="Restore from Backup" onClose={()=>setBackupModal(null)} footer={<Btn onClick={()=>setBackupModal(null)}>Cancel</Btn>}>
          <div style={{color:T.text2,fontSize:13,lineHeight:1.6,marginBottom:14}}>Select a previously exported JSON backup file to restore all data.</div>

      {superComms && client && <SuperCommsModal key={superComms} initialTab={superComms} client={client} data={data} onSaveResources={r=>saveResources(r)} onSaveTech={t=>{saveTechData(t,{cId:activeId,siteId:null});setTechDataOpen(null);}} onClose={()=>setSuperComms(null)} techOptsData={data.techOpts||{}} onAddOpt={addToTechOpts}/>}
      {techDataOpen && (()=>{

        return <TechDataPopup tech={techData} onSave={t=>saveTechData(t,techDataOpen)} onClose={()=>setTechDataOpen(null)} techOptsData={data.techOpts||{}} onAddOpt={addToTechOpts} isSite={!!siteId} clientName={tc.name}/>;
      })()}
    </>

  // ── Layout ───────────────────────────────────────────────────────────────
  return (
    <div style={{display:"flex",height:"100vh",background:T.bg,padding:8,gap:8,overflow:"hidden"}}>
      <aside style={{width:leftPanel?300:60,flexShrink:0,background:T.surface,border:`1px solid ${T.border}`,borderRadius:16,overflow:"hidden",transition:"width .25s cubic-bezier(.32,.72,0,1)"}}>
        {leftPanel ? renderSidebar() : renderRail()}

      <main style={{flex:1,minWidth:0,display:"flex",flexDirection:"column",background:T.surface,border:`1px solid ${T.border}`,borderRadius:16,overflow:"hidden"}}>
        {renderTopBar()}
        {renderSubNav()}
        {renderHeader()}
        <div style={{flex:1,minHeight:0,background:T.bg,overflow:"hidden"}}>
          {inTasks && isBoard && ((isSocialBoard ? boardActiveId : client) ? renderBoard(clientTab) : <div style={{padding:24,color:T.text3,fontSize:13}}>Select a client from the sidebar.</div>)}
          {inTasks && clientTab==="social" && socialSub==="overview" && <SocialDash social={social} upd={upd} activeId={socialActiveId} setActiveId={setSocialActiveId} sync={socialSync} retrySync={retrySocialSync}/>}
          {clientTab!=="social" && effSub==="overview" && <SopLibrary key={clientTab} service={clientTab} data={data} upd={upd} client={client}/>}
          {clientTab==="tech" && techSub==="agencytools" && <AgencyTools key={atPreset.n} initialView={atPreset.v} data={data} upd={upd}/>}
          {clientTab==="tech" && techSub==="tools" && <div style={{height:"100%",background:T.surface}}>{renderTechTools()}</div>}
          {clientTab==="tech" && techSub==="register" && <div style={{height:"100%",background:T.bg}}><SiteRegister data={data} upd={upd}/></div>}
        </div>
      </main>
      {clientTab==="social" && socialSub==="overview" && socialClient && <SocialPanel key={socialClient.id} client={socialClient} upd={upd} onClose={()=>setSocialActiveId(null)}/>}
      {renderModals()}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));

    <script>
      (function(){
        var tabs = document.querySelectorAll('.cmshell-tab');
        var panels = {
          clientmap: document.getElementById('tab-clientmap'),
          social:    document.getElementById('tab-social'),
          creative:  document.getElementById('tab-creative'),
          tech:      document.getElementById('tab-tech'),
          onedash:   document.getElementById('tab-onedash')
        };
        var frames = {
          social:   { el: document.getElementById('social-frame'),   src: 'social-src',   loaded:false },
          creative: { el: document.getElementById('creative-frame'), src: 'creative-src', loaded:false },
          tech:     { el: document.getElementById('tech-frame'),     src: 'tech-src',     loaded:false },
          onedash:  { el: document.getElementById('onedash-frame'),  src: 'onedash-src',  loaded:false }
        };
        function sizeFrame(el){
          var bar = document.getElementById('cmshell-tabs');
          el.style.height = (window.innerHeight - bar.offsetHeight) + 'px';
        }
        function inject(key){
          var f = frames[key];
          if(!f || f.loaded) return;
          var raw = document.getElementById(f.src).textContent;
          f.el.srcdoc = raw.split('@@SCRIPT_CLOSE@@').join('</'+'script>');
          f.loaded = true;
        }
        function activate(name){
          tabs.forEach(function(t){ t.classList.toggle('active', t.dataset.tab===name); });
          Object.keys(panels).forEach(function(k){ panels[k].hidden = (k!==name); });
          if(frames[name]){ inject(name); sizeFrame(frames[name].el); }
        }
        tabs.forEach(function(t){ t.onclick = function(){ activate(t.dataset.tab); }; });
        window.addEventListener('resize', function(){
          Object.keys(frames).forEach(function(k){
            if(!panels[k].hidden) sizeFrame(frames[k].el);
          });
        });
        activate('clientmap');
      })();
    </script>
