const FS_ROOT = "https://firestore.googleapis.com/v1/projects/points-dashboard-78c0b/databases/(default)/documents/artifacts/client-map-master-v1/public/data/";
const FS_KEY = "AIzaSyAAvxcoVE8ZpvG4OC5VKuNnfzuLxidL83U";
const clone = o => JSON.parse(JSON.stringify(o));
const J = o => JSON.stringify(o);
const byKind = (arr, k) => (arr||[]).filter(a=>kindOfEntry(a)===k);
const otherKinds = (arr, k) => (arr||[]).filter(a=>kindOfEntry(a)!==k);
const mergeClient = (loc, rem) => ({...(loc||{}), ...rem, tech:{...((loc||{}).tech||{}), ...(rem.tech||{})}, resources:{...((loc||{}).resources||{}), ...(rem.resources||{})}});

// Each sub-document: where it lives, which fields it owns, how to read it from / write it to the app state.

  social: {

    build: (base, d) => { const ids = d.social.clients.map(c=>c.id); const order=(base.order||[]).filter(id=>ids.includes(id)); ids.forEach(id=>{ if(!order.includes(id)) order.push(id); });

  },
  tech: {

    apply: (nd, p, extra) => {
      nd.tasks = p.tasks||[]; nd.techStack = p.techStack||nd.techStack||[];
      nd.archive = [...otherKinds(nd.archive,"tech"), ...(p.archive||[]).map(a=>({...a,kind:a.kind||"tech"}))];
      nd.deleted = [...otherKinds(nd.deleted,"tech"), ...(p.deleted||[]).map(a=>({...a,kind:a.kind||"tech"}))];
      nd.driveLink = p.driveLink || extra || "";
      applyClients(nd, p.clients);
    },
    build: (base, d) => ({...base, clients:d.clients, tasks:d.tasks, techStack:d.techStack, archive:byKind(d.archive,"tech"), deleted:byKind(d.deleted,"tech"), driveLink:d.driveLink||""}),
    extraOut: d => d.driveLink||""
  },
  extras: {
    coll:"creative", field:"onedash-extras-v1",
    proj: d => J({ppcItems:d.ppcItems, socialItems:d.socialItems, extras:d.extras, techOpts:d.techOpts, archive:[...byKind(d.archive,"ppc"),...byKind(d.archive,"social")], deleted:[...byKind(d.deleted,"ppc"),...byKind(d.deleted,"social")]}),
    apply: (nd, p) => {
      nd.ppcItems = p.ppcItems||[]; nd.socialItems = p.socialItems||[]; nd.extras = p.extras||[]; nd.techOpts = p.techOpts||{};
      nd.archive = [...(nd.archive||[]).filter(a=>!["ppc","social"].includes(kindOfEntry(a))), ...(p.archive||[]).map(a=>({...a,kind:a.kind||"ppc"}))];
      nd.deleted = [...(nd.deleted||[]).filter(a=>!["ppc","social"].includes(kindOfEntry(a))), ...(p.deleted||[]).map(a=>({...a,kind:a.kind||"ppc"}))];
    },
    build: (base, d) => ({...base, ppcItems:d.ppcItems, socialItems:d.socialItems, extras:d.extras, techOpts:d.techOpts, archive:[...byKind(d.archive,"ppc"),...byKind(d.archive,"social")], deleted:[...byKind(d.deleted,"ppc"),...byKind(d.deleted,"social")]})

};
function applyClients(nd, remote) {
  const list = nd.clients||[];
  (remote||[]).forEach(rc=>{
    const i = list.findIndex(c=>c.id===rc.id);
    if (i>=0) list[i] = mergeClient(list[i], rc); else list.push(mergeClient(null, rc));
  });
  nd.clients = list;
}

async function fsGet(coll) {
  const res = await fetch(FS_ROOT+coll+"/state?key="+FS_KEY);
  if (res.status===404) return {fields:{}};
  if (!res.ok) throw new Error(coll+": HTTP "+res.status);
  const doc = await res.json();
  return {fields:doc.fields||{}};
}
async function fsPatch(coll, fields) {
  const names = Object.keys(fields).concat("updatedAt");
  const mask = names.map(n=>"updateMask.fieldPaths="+encodeURIComponent("`"+n+"`")).join("&");
  const body = {updatedAt:{integerValue:String(Date.now())}};
  Object.keys(fields).forEach(k=>{ body[k] = {stringValue:fields[k]}; });
  const res = await fetch(FS_ROOT+coll+"/state?key="+FS_KEY+"&"+mask, {method:"PATCH",headers:{"Content-Type":"application/json"},body:J({fields:body})});
  if (!res.ok) throw new Error(coll+": HTTP "+res.status);
}

function useCloudSync(data, setData) {
  const names = Object.keys(SYNC_DOCS);
  const [status, setStatus] = useState(()=>Object.fromEntries(names.map(n=>[n,{state:"connecting",msg:"",at:0}])));
  const R = useRef({data, docs:Object.fromEntries(names.map(n=>[n,{loaded:false,raw:null,lastProj:null,base:{},reproj:false}])), timer:null, busy:false, known:null});
  R.current.data = data;
  const setSt = (n, state, msg) => setStatus(s=>({...s,[n]:{state,msg:msg||"",at:Date.now()}}));

  // Apply documents (fetched from the cloud, or pasted in from the Client Map) to the app state
  const ingest = (got, force) => {
    const r = R.current;
    const applies = [];
    names.forEach(n=>{
      const D = SYNC_DOCS[n], st = r.docs[n], g = got[D.coll]; if (!g) return;
      const f = g.fields[D.field]; const raw = f && f.stringValue ? f.stringValue : null;
      const extra = D.extraField && g.fields[D.extraField] ? g.fields[D.extraField].stringValue : "";
      if (raw===null) { if(!st.loaded){ st.loaded = true; st.lastProj = D.proj(r.data); st.base = {}; setSt(n,"synced"); } return; }
      let parsed; try { parsed = JSON.parse(raw); } catch { setSt(n,"offline","Cloud data for "+n+" is not valid JSON"); return; }
      const changed = !st.loaded || raw!==st.raw;
      const dirty = st.loaded && D.proj(r.data)!==st.lastProj;
      st.base = parsed;
      if (changed && (!st.loaded || !dirty || force)) { applies.push({n,D,parsed,extra}); st.raw = raw; }
      st.loaded = true;
      if (!dirty || force) setSt(n,"synced");
    });
    let dropIds = null;
    const cb = r.docs.creative.base.clients, tb = r.docs.tech.base.clients;
    if (r.docs.creative.loaded && r.docs.tech.loaded && Array.isArray(cb) && Array.isArray(tb)) {
      const remoteIds = new Set([...cb,...tb].map(c=>c.id));
      if (r.known===null) r.known = new Set((r.data.clients||[]).map(c=>c.id));
      dropIds = new Set([...r.known].filter(id=>!remoteIds.has(id)));
      remoteIds.forEach(id=>r.known.add(id));
      dropIds.forEach(id=>r.known.delete(id));
      if (dropIds.size) applies.push({n:"_clients",D:{apply:nd=>{ nd.clients = nd.clients.filter(c=>!dropIds.has(c.id)); }},parsed:null,extra:null});
    }
    if (applies.length) {
      try { if (!localStorage.getItem("digi_unified_v2_prelink")) localStorage.setItem("digi_unified_v2_prelink", localStorage.getItem(KEY)||""); } catch {}
      setData(d=>{ const nd = clone(d); applies.forEach(a=>a.D.apply(nd,a.parsed,a.extra)); return nd; });
      applies.forEach(a=>{ if(r.docs[a.n]) r.docs[a.n].reproj = true; });
      names.forEach(n=>{ r.docs[n].reproj = true; });
    }
    return applies.filter(a=>a.n!=="_clients").length;
  };

  const pull = async () => {
    const r = R.current; if (r.busy) return; r.busy = true;
    try {
      const colls = [...new Set(names.map(n=>SYNC_DOCS[n].coll))];
      const got = {};
      for (const c of colls) {
        try { got[c] = await fsGet(c); } catch(e) {
          const m = String(e&&e.message||e);
          names.filter(n=>SYNC_DOCS[n].coll===c).forEach(n=>setSt(n,"offline",/Failed to fetch|NetworkError|Load failed/i.test(m)?"Blocked by the viewer or the network ("+m+")":m));
        }
      }
      ingest(got);
    } finally { r.busy = false; }
  };

  // Snapshot pasted from the Client Map: {social:{<field>:<json string>}, creative:{...}, tech:{...}}
  const importSnapshot = (snap) => {
    const got = {};
    Object.keys(snap||{}).forEach(coll=>{
      const fields = {};
      Object.keys(snap[coll]||{}).forEach(k=>{ if (typeof snap[coll][k]==="string") fields[k] = {stringValue:snap[coll][k]}; });
      got[coll] = {fields};
    });
    return ingest(got, true);
  };

  const push = async () => {
    if (window.ONEDASH_READ_ONLY) return;
    const r = R.current, d = r.data;
    const byColl = {};
    names.forEach(n=>{
      const D = SYNC_DOCS[n], st = r.docs[n];
      if (!st.loaded) return;
      const cur = D.proj(d);
      if (cur===st.lastProj) return;
      (byColl[D.coll] = byColl[D.coll]||[]).push({n,D,st,cur});
    });
    for (const coll of Object.keys(byColl)) {
      const jobs = byColl[coll];
      jobs.forEach(j=>setSt(j.n,"saving"));
      try {
        const fields = {}, built = {};
        jobs.forEach(({n,D,st})=>{ built[n] = D.build(clone(st.base||{}), d); fields[D.field] = J(built[n]); if (D.extraOut) fields[D.extraField] = D.extraOut(d); });
        await fsPatch(coll, fields);
        jobs.forEach(({n,D,st,cur})=>{ st.raw = fields[D.field]; st.lastProj = cur; st.base = built[n]; setSt(n,"synced"); });
      } catch(e) { jobs.forEach(j=>setSt(j.n,"offline",String(e.message||e))); }
    }
  };

  useEffect(()=>{
    pull();
    const iv = setInterval(()=>{ if(!document.hidden) pull(); }, 20000);
    const onFocus = () => pull();
    window.addEventListener("focus", onFocus);
    return ()=>{ clearInterval(iv); window.removeEventListener("focus", onFocus); };
  },[]);

  useEffect(()=>{
    const r = R.current;
    names.forEach(n=>{ const st = r.docs[n]; if (st.reproj) { st.lastProj = SYNC_DOCS[n].proj(data); st.reproj = false; } });
    clearTimeout(r.timer);
    r.timer = setTimeout(push, 700);
    return ()=>clearTimeout(r.timer);
  },[data, Object.values(status).map(s=>s.state==="connecting"?1:0).join("")]);

  const retry = async () => { setStatus(s=>Object.fromEntries(names.map(n=>[n,{...s[n],state:s[n].state==="offline"?"connecting":s[n].state}]))); await pull(); await push(); };
  return {status, retry, importSnapshot};
}

function SyncBadge({status, retry}) {

  const col = off ? "#ff453a" : busy ? "#ff9f0a" : "#30d158";
  const label = off ? "Cloud sync offline" : busy ? "Syncing…" : "Synced to cloud";

      </button>
    </div>
  );
}

const CM_SNIPPET = "(async()=>{const b=firebase.firestore().collection('artifacts').doc('client-map-master-v1').collection('public').doc('data');const g=async c=>{const s=await b.collection(c).doc('state').get();return s.exists?s.data():{}};copy(JSON.stringify({social:await g('social'),creative:await g('creative'),tech:await g('tech')}));console.log('Copied. Paste it into Onedash.')})()";
function ClientMapImport({onClose, onImport}) {
  const [text, setText] = useState("");
  const [msg, setMsg] = useState("");
  const [copied, setCopied] = useState(false);
  const fileRef = useRef();
  const run = (raw) => {
    try {
      const snap = JSON.parse(raw);
      if (!snap || typeof snap!=="object" || !(snap.social||snap.creative||snap.tech)) throw new Error("This is not a Client Map snapshot");
      const n = onImport(snap);
      setMsg("Imported "+n+" data set"+(n===1?"":"s")+" from the Client Map."); setText("");
    } catch(e) { setMsg("Could not import: "+(e&&e.message||e)); }
  };
  return (
    <Modal title="Import from Client Map" onClose={onClose} wide footer={<><Btn onClick={onClose}>Close</Btn><Btn variant="primary" disabled={!text.trim()} onClick={()=>run(text)}>Import</Btn></>}>
      <div style={{fontSize:13,color:T.text2,lineHeight:1.6}}>
        <div style={{marginBottom:10}}>This pulls the live Social, Creative and Tech data out of the Client Map into Onedash. Use it when the sync badge says offline.</div>
        <div style={{color:T.text,fontWeight:600,marginBottom:4}}>1. Open the Client Map, then open the browser console and run this:</div>
        <div style={{display:"flex",gap:8,alignItems:"flex-start",marginBottom:12}}>
          <code style={{flex:1,fontFamily:MONO,fontSize:11,background:T.surface2,border:`1px solid ${T.border}`,borderRadius:8,padding:"8px 10px",color:T.text2,wordBreak:"break-all",maxHeight:84,overflowY:"auto"}}>{CM_SNIPPET}</code>
          <Btn size="sm" onClick={()=>{ try{navigator.clipboard.writeText(CM_SNIPPET); setCopied(true); setTimeout(()=>setCopied(false),1500);}catch{} }}>{copied?"Copied":"Copy"}</Btn>
        </div>
        <div style={{color:T.text,fontWeight:600,marginBottom:4}}>2. Paste the result here, or choose the file:</div>
        <textarea value={text} onChange={e=>setText(e.target.value)} placeholder="Paste the copied data" rows={5} style={{width:"100%",background:T.surface2,border:`1px solid ${T.border}`,borderRadius:10,color:T.text,fontFamily:MONO,fontSize:11,padding:"8px 10px",outline:"none",resize:"vertical"}}/>
        <div style={{marginTop:8}}>
          <input ref={fileRef} type="file" accept=".json,application/json" style={{display:"none"}} onChange={e=>{ const f=e.target.files[0]; if(!f) return; const rd=new FileReader(); rd.onload=ev=>run(String(ev.target.result)); rd.readAsText(f); e.target.value=""; }}/>
          <Btn size="sm" onClick={()=>fileRef.current&&fileRef.current.click()}>Choose JSON file</Btn>
        </div>
        {msg && <div style={{marginTop:12,color:msg.startsWith("Imported")?"#30d158":"#ff6b6b"}}>{msg}</div>}
      </div>
    </Modal>
  );
}

const SOP_ONBOARDING_MD = "Every new client is onboarded through the same eleven phases, from intake to handover, so that no site goes live untracked, unmonitored, unbacked-up or non-compliant.\n\n## 1. Purpose, scope and rules\n\nThis SOP covers the technical onboarding of any new Diginauts client, whatever mix of services they buy: website, hosting, tracking, paid media integrations, e-commerce, CRM and booking systems. It starts at signed proposal and ends at documented handover into maintenance.\n\n**Owner:** Don Rama (Senior Tech Lead). **Support:** Anna Larmuth (design and build), Conner Foxcroft (PPC and tracking), Kelly Johnson (project management). **Escalation:** Reyner Nefdt, then Craig Johnson (see section 15).\n\nRules that apply to every onboarding:\n\n- The client's region sets the legal framework. EU clients fall under GDPR, ZA clients under POPIA. Confirm this in Phase 0, before any tracking is touched.\n- Staging first. No code or configuration change goes to production without a confirmed backup, a passed code audit (CLAUDE-CODE-AUDIT.md) and documented approval.\n- Client access is requested through the client's own admin or invite flow wherever possible. Diginauts never takes ownership of a client's accounts.\n- Credentials go into the password manager only. Never email, Slack or ClickUp comments.\n- Nothing goes live until the QA sign-off in Phase 9 is complete.\n- Every phase ends with the checklist ticked and dated in the client's onboarding record.\n\n## 2. Phase overview\n\nPhases run in order. Phases 5 to 7 can overlap once Phase 4 is signed off. Target timings assume a standard WordPress build or takeover with full client access on day one.\n\n| # | Phase | Lead | Target |\n| --- | --- | --- | --- |\n| 0 | Intake and legal framework | Don, Kelly | Day 1 |\n| 1 | Access and asset collection | Don | Days 1 to 3 |\n| 2 | Baseline audit, backup and staging | Don | Days 2 to 4 |\n| 3 | Hosting, DNS, SSL and email | Don | Days 3 to 5 |\n| 4 | WordPress stack and security hardening | Don, Anna | Days 4 to 6 |\n| 5 | Tracking and analytics | Don, Conner | Days 5 to 8 |\n| 6 | Compliance (GDPR or POPIA) | Don | Days 5 to 8 |\n| 7 | Integrations (forms, SMTP, CRM, booking) | Don | Days 6 to 9 |\n| 8 | Monitoring and fleet enrolment | Don | Days 8 to 9 |\n| 9 | QA sign-off (Don Standard) | Don, second reviewer | Day 10 |\n| 10 | Handover and documentation | Don, Kelly | Day 10 |\n\nSection 11 lists extra checks for Shopify, GoHighLevel, hotel OCB, Meta CAPI and server-side tracking. Run them inside the matching phase when the client buys that service.\n\n## 3. Phase 0: Intake and legal framework\n\nGoal: know exactly what we are onboarding, under which law, and who signs off before any access is requested.\n\n- [ ] Signed proposal or SOW received and services in scope listed (website, hosting, tracking, Google Ads, Meta, e-commerce, CRM, booking, email)\n- [ ] Client legal entity, trading name and primary contact recorded\n- [ ] Technical contact and approver named (the person who can approve DNS, hosting and billing changes)\n- [ ] Client region confirmed: EU (GDPR) or ZA (POPIA). If the audience spans both, apply the stricter standard (GDPR)\n- [ ] Tier assigned. Tier 1 EU hotel clients (such as The Dylan, Buelow Palais, Hotel Wiechmann) get formal communication and immediate escalation to Rey on any incident\n- [ ] Communication register set: EU formal and structured, ZA professional and warmer\n- [ ] Existing vendors identified (previous agency, developer, host, tracking setup) and handover cooperation confirmed in writing\n- [ ] Go-live deadline, campaign start dates and blackout periods (peak season, promotions) recorded\n- [ ] Onboarding record created in the internal task tool (ClickUp where still in use) with this checklist attached and Kelly assigned as PM\n- [ ] Client added to the site register: tier, region, CMS and tech stack, hosting account (Kate's or Craig's SiteGround, or other), plan, registrar, our access to it, and whether it is hosted with us\n- [ ] Kickoff call held, with the technical scope and the access request list sent afterwards\n\n## 4. Phase 1: Access and asset collection\n\nGoal: every system we will touch is accessible under named Diginauts accounts, and the client still owns every account. Log each item as received, date and who granted it.\n\n**Hosting and domain**\n\n- [ ] Hosting control panel access (SiteGround, WP Engine, Azure or other) as a named user or invited collaborator\n- [ ] Domain registrar access, or confirmation of who controls DNS and a named contact for changes\n- [ ] DNS provider access if separate from the registrar (Cloudflare, cPanel DNS, Route 53)\n- [ ] Current SSL certificate details and expiry date\n- [ ] SFTP or SSH credentials, and database access if the host allows it\n\n**Website**\n\n- [ ] WordPress administrator account created for a named Diginauts user (no shared logins)\n- [ ] Licence keys for premium plugins and themes (Elementor Pro, ACF Pro, Fluent Forms Pro, WPML, Rank Math Pro). Transfer or reissue under Diginauts-managed licences\n- [ ] Repository, theme source or child theme files if custom code exists\n\n**Analytics and advertising**\n\n- [ ] Google Tag Manager container access at Publish level (account owner added, not replaced)\n- [ ] GA4 property access at Editor or Administrator level\n- [ ] Google Ads account access (via the manager account link request)\n- [ ] Meta Business Manager partner access, with Pixel and ad account assigned\n- [ ] Google Search Console and Bing Webmaster Tools verified\n- [ ] Google Business Profile manager access where local SEO is in scope\n- [ ] Microsoft Clarity project access, if already in use\n\n**Business systems**\n\n- [ ] CRM access (HubSpot, GoHighLevel or other) with API keys held by the client where possible\n- [ ] Booking engine or PMS access and an API contact (Mews, StaynTouch or other)\n- [ ] Email provider details (Google Workspace, Microsoft 365, host mailboxes) and the SPF, DKIM and DMARC records in use\n- [ ] Payment gateway and Shopify admin access where e-commerce is in scope\n\n**Brand and content**\n\n- [ ] Logo files, brand guide, fonts and colour values\n- [ ] Privacy policy, cookie policy and terms (or confirmation that we draft them)\n- [ ] Previous agency or developer handover notes, if any\n\nAll credentials are stored in the password manager under the client's vault. Anything received over email or chat is moved there and the message deleted.\n\n## 5. Phase 2: Baseline audit, backup and staging\n\nGoal: record the state of the site before we change anything, so every later fault can be tied to a known starting point.\n\n- [ ] Full manual backup taken (files and database) and a test restore confirmed where the host allows it\n- [ ] Backup stored off-host (BlogVault or equivalent) and the location recorded\n- [ ] Staging environment created (host staging tool, or a staging subdomain blocked from indexing and password protected)\n- [ ] Inventory recorded: WordPress core version, PHP version, MySQL or MariaDB version, active theme, page builder, every active plugin with version\n- [ ] PHP version checked against support. Anything below 8.1 is a finding. PHP 7.4 has been end of life since December 2022 and is treated as critical until upgraded\n- [ ] Plugins and themes checked against Patchstack and Wordfence for known vulnerabilities\n- [ ] Abandoned, nulled or duplicate plugins identified for removal\n- [ ] Malware scan run (Wordfence, host scanner). Any hit switches to the security incident procedure (CLAUDE-SECURITY-INCIDENT.md) before onboarding continues\n- [ ] Admin user list reviewed. Unknown, shared or ex-staff accounts removed or locked after client confirmation\n- [ ] Custom code (snippets, mu-plugins, child theme, REST endpoints, webhooks) reviewed against CLAUDE-CODE-AUDIT.md\n- [ ] Baseline PageSpeed recorded for mobile and desktop on the homepage and two key pages\n- [ ] Baseline tracking snapshot recorded: tags currently firing, GA4 and Ads conversions in the last 30 days, Meta Pixel status\n- [ ] Baseline uptime, SSL expiry and domain expiry dates recorded\n- [ ] Findings report written, with severity (P1 to P4) per finding, and shared with Rey for any P1 or P2\n\nIf the site fails the baseline badly (active compromise, unsupported PHP with business-critical plugins, no backups), pause Phases 3 to 7 and agree a remediation plan with the client first.\n\n## 6. Phase 3: Hosting, DNS, SSL and email\n\nGoal: the site sits on a supported host, DNS is documented and under control, and email authentication protects the client's domain.\n\n**Hosting**\n\n- [ ] Host decision recorded: stay, or migrate to SiteGround (primary), WP Engine or Azure. Include reason and who pays\n- [ ] PHP set to 8.2 or the highest version the stack supports, tested on staging first\n- [ ] Server resources checked (memory limit, max execution time, upload size, cron health, object cache)\n- [ ] Host-level protections enabled (SG Security Optimizer on SiteGround, host firewall, brute-force limits)\n- [ ] Automatic host backups confirmed and retention noted\n- [ ] If migrating: no DNS change until the migration checklist is complete, the site is tested on a temporary URL, and approval is documented. Lower the DNS TTL 24 hours before cutover\n\n**DNS**\n\n- [ ] Full DNS export saved before any change\n- [ ] Records documented: A, AAAA, CNAME, MX, TXT, and any third-party verification records\n- [ ] Cloudflare WAF and proxy enabled where agreed. If it is used, whitelist the MainWP hub IP (35.208.184.61) so fleet management keeps working\n- [ ] DNSSEC and registrar lock reviewed, with the client's approval before enabling\n\n**SSL**\n\n- [ ] Valid certificate on the apex and www, with automatic renewal confirmed\n- [ ] HTTPS enforced, no mixed content, www and non-www redirect to one canonical version\n- [ ] HSTS considered once HTTPS is stable on all subdomains\n\n**Email**\n\n- [ ] SPF record valid and includes only the services that send as the domain\n- [ ] DKIM enabled for the mail provider and for the website SMTP service\n- [ ] DMARC published, starting at p=none with reporting, then moved to quarantine or reject once reports are clean\n- [ ] Website sending configured through WP Mail SMTP with Google SMTP (the standard going forward; SMTP2GO only where not yet migrated)\n- [ ] Test email from every site form delivered to inbox, not spam\n\n## 7. Phase 4: WordPress stack and security hardening\n\nGoal: the site matches the approved stack and hardening baseline. All changes go to staging first, then production after backup and approval.\n\n**Standard stack**\n\n- [ ] Page builder is Elementor Pro for new builds. Divi is legacy only, with no new builds and a migration note added to the findings report\n- [ ] SEO plugin is Rank Math Pro (Yoast tolerated on legacy sites)\n- [ ] Forms run on Fluent Forms Pro, custom fields on ACF Pro\n- [ ] Performance: NitroPack or SG Speed Optimizer, never both active together\n- [ ] WPML installed only where the EU client needs multilingual content\n- [ ] Plugin count reduced to what is needed; every remaining plugin has an owner and a reason\n- [ ] Core, theme and plugins updated to current versions on staging, regressions checked, then pushed to production\n\n**Security baseline**\n\n- [ ] Wordfence installed and configured, with firewall in learning mode first, then enabled, and scan schedule set\n- [ ] WP Activity Log (Melapress) installed to keep the admin audit trail\n- [ ] Two-factor authentication on all administrator accounts\n- [ ] Login limits on, default \"admin\" username removed, author enumeration blocked\n- [ ] XML-RPC disabled unless a named integration needs it\n- [ ] File editing in the dashboard disabled (DISALLOW\\_FILE\\_EDIT)\n- [ ] File permissions correct, and wp-config.php outside public access or protected\n- [ ] Security keys and salts rotated if the site was taken over from another party\n- [ ] REST API user enumeration restricted\n- [ ] Application passwords reviewed and unused ones revoked\n- [ ] Debug mode off in production and error logs not publicly readable\n- [ ] Unused themes, plugins and staging copies removed from production\n\n**Performance baseline**\n\n- [ ] Image compression and WebP delivery in place\n- [ ] Caching and CDN settings tested, with logged-in and checkout pages excluded\n- [ ] PageSpeed targets met or a documented reason recorded: mobile above 70, desktop above 85\n\n## 8. Phase 5: Tracking and analytics\n\nGoal: every conversion that matters is measured once, accurately, and only after consent where the law requires it. Do not publish any tracking change until the consent setup in Phase 6 is ready for EU clients.\n\n**Tag Manager and GA4**\n\n- [ ] GTM container audited: unused tags, duplicate GA4 or Pixel tags, hard-coded tags in the theme removed\n- [ ] One GTM container per site, installed through one method only (no plugin and theme duplicates)\n- [ ] GA4 property configured: correct time zone and currency, data retention set (14 months), internal traffic filtered, cross-domain tracking where needed\n- [ ] Key events defined and marked: form submit, phone click, email click, booking start, booking complete, purchase\n- [ ] Google Signals and ad personalisation settings aligned with the consent setup\n- [ ] GA4 linked to Google Ads, Search Console and BigQuery where in scope\n\n**Advertising platforms**\n\n- [ ] Google Ads conversion actions imported from GA4 or created in GTM, with Enhanced Conversions enabled and tested\n- [ ] Meta Pixel installed through GTM, standard events mapped, Events Manager checked for the right domain\n- [ ] Meta Conversions API set up where Meta ads run (see section 11), with event deduplication through a shared event ID\n- [ ] Remarketing audiences and lists created only if consent logic supports them\n- [ ] Microsoft Clarity installed through GTM as the baseline heatmapping tool, with sensitive fields masked. Roll out only to clients agreed with Rey\n\n**Search and verification**\n\n- [ ] Search Console property verified (domain level) and sitemap submitted\n- [ ] Bing Webmaster Tools verified\n- [ ] Google Business Profile linked where applicable\n\n**Testing (all must pass)**\n\n- [ ] Every tag confirmed firing in GTM Preview, on the right triggers, once per action\n- [ ] Conversions visible in GA4 DebugView and in the Google Ads interface\n- [ ] Events visible in Meta Events Manager, with the test event tool\n- [ ] No duplicate tags and no duplicate conversions\n- [ ] Data layer checked for any custom events\n- [ ] For EU clients: confirmed that nothing fires before consent, and that denied consent sends no marketing tags\n\n## 9. Phase 6: Compliance\n\nGoal: the site collects and processes personal data lawfully for the client's region. This is a technical checklist, not legal advice. Policy wording is confirmed by the client or their legal adviser.\n\n| Area | EU clients (GDPR) | ZA clients (POPIA) |\n| --- | --- | --- |\n| Cookie consent | CookieYes mandatory. Prior opt-in, granular categories, reject as easy as accept | CookieYes recommended. Clear notice and lawful basis for tracking |\n| Tracking before consent | Blocked. Consent Mode v2 configured in GTM | Permitted only with a stated lawful basis and notice |\n| Breach notification | Supervisory authority within 72 hours | Information Regulator and affected people, as soon as reasonably possible |\n| Data processing agreements | Signed with processors (host, email, CRM, analytics) | Operator agreements where personal information is processed for us |\n| Data location | Check transfers outside the EEA and the safeguards used | Check cross-border transfer conditions (section 72) |\n\n**Technical checks**\n\n- [ ] Cookie banner live, translated into the site's languages, and blocking scripts until consent\n- [ ] Cookie scan run, every cookie categorised, and the cookie policy matches the scan\n- [ ] Google Consent Mode v2 set up in GTM with default denied state for EU traffic\n- [ ] Consent logs retained by CookieYes and the retention period recorded\n- [ ] Privacy policy lists what is collected, why, the lawful basis, retention, processors, and how to exercise rights\n- [ ] Forms carry consent wording and a link to the privacy policy. No pre-ticked boxes\n- [ ] Form submissions stored only where needed. Retention and auto-deletion set in Fluent Forms\n- [ ] Data subject request route documented (who receives it, how it is verified, response deadline)\n- [ ] Third-party embeds (maps, video, chat, fonts) loaded after consent or self-hosted\n- [ ] IP anonymisation and data minimisation applied in analytics\n- [ ] Processor list recorded: host, email, CRM, analytics, advertising platforms, SMTP\n- [ ] Breach contacts recorded: client's privacy lead and the regulator route for their region\n- [ ] For POPIA clients: the client's Information Officer is identified and recorded\n\n## 10. Phase 7: Integrations\n\nGoal: every lead, booking and enquiry reaches the right system, and nothing fails silently.\n\n- [ ] Integration map written: each form and flow, where it posts, who receives it, and which credentials it uses\n- [ ] All forms rebuilt or confirmed in Fluent Forms Pro, with spam protection (honeypot plus reCAPTCHA or Turnstile)\n- [ ] Form notification emails and auto-responders tested end to end, in inbox not spam\n- [ ] Form submissions logged in the site as a backup to the CRM or email\n- [ ] CRM connection tested with a real submission (HubSpot, GoHighLevel or other), fields mapped, and duplicates handled\n- [ ] Booking engine linked and tested (Mews, StaynTouch or other), with a full test booking from the website\n- [ ] Webhooks and REST API keys documented, scoped to least privilege, and stored in the password manager\n- [ ] Failed-delivery alerts set up for webhooks and SMTP (log review or Make.com alert to Slack)\n- [ ] Live chat, WhatsApp, phone and map widgets tested on mobile and desktop\n- [ ] Third-party scripts reviewed for performance and consent impact\n- [ ] Any custom integration code passed CLAUDE-CODE-AUDIT.md before production\n- [ ] Rate limits, quotas and renewal dates of each integration recorded in the client's tech record\n\n## 11. Service add-ons\n\nRun only the blocks that match what the client buys. Each sits alongside Phases 3 to 7.\n\n**Shopify e-commerce**\n\n- [ ] Staff account created with the minimum permissions needed, and the store owner stays the owner\n- [ ] Theme duplicated before edits; app list reviewed and unused apps removed\n- [ ] Checkout, payment gateways, shipping and tax settings verified (client approval before any change)\n- [ ] GA4 e-commerce events firing: view\\_item, add\\_to\\_cart, begin\\_checkout, purchase, with correct value and currency\n- [ ] Meta catalogue and Google Merchant Center feeds connected and error-free\n- [ ] Customer privacy and cookie banner settings configured for the store's markets\n- [ ] Test order placed, then refunded, with tracking confirmed end to end\n\n**GoHighLevel (CRM and landing pages)**\n\n- [ ] Sub-account access, custom domain, SSL and tracking code configured\n- [ ] Forms, pipelines, automations and webhooks tested with a live lead\n- [ ] Email and SMS sending domain authenticated (SPF, DKIM, DMARC)\n- [ ] Consent wording and unsubscribe handling checked\n\n**Hotel clients: Offline Conversion Bridge (OCB)**\n\n- [ ] PMS or booking engine API access confirmed with the vendor (Mews or StaynTouch)\n- [ ] Google Click ID (GCLID) and other click identifiers captured on the website and passed with the booking\n- [ ] Consent confirmed for storing click identifiers and sharing conversion data\n- [ ] Server-to-server pipeline tested with a real booking, with the conversion visible in Google Ads\n- [ ] Cancellations and modifications handled, and no double counting between OCB and on-site tags\n- [ ] Pipeline monitoring and failure alerts set, with the developer contacts recorded\n- [ ] Escalation noted: any OCB fault on a Tier 1 hotel client goes to Rey straight away\n\n**Meta Conversions API and server-side tracking**\n\n- [ ] Access token generated and stored securely, never in page source\n- [ ] Event deduplication confirmed with a matching event ID between browser and server\n- [ ] Event match quality checked in Events Manager and improved with hashed first-party data, where consent allows\n- [ ] Server-side GTM container or gateway hosted under a first-party domain, with cost and ownership agreed\n\n**SEO and migration add-on (if the site is replacing an old one)**\n\n- [ ] Old URL list exported and a 301 redirect map built and tested\n- [ ] Metadata, schema and canonical tags carried across\n- [ ] Search Console change-of-address or sitemap resubmission completed, with rankings watched for 30 days\n\n## 12. Phase 8: Monitoring and fleet enrolment\n\nGoal: from the day the site goes live, we see problems before the client does.\n\n- [ ] Site connected to the MainWP hub (maintenance.diginauts.co) with the child plugin installed, and the hub IP whitelisted at host or Cloudflare level\n- [ ] Patchstack vulnerability monitoring active through MainWP\n- [ ] BlogVault backups scheduled (frequency set by site activity, off-host) with a restore test logged\n- [ ] WP Activity Log reporting working, with alerts for new admin users and plugin changes\n- [ ] Uptime monitoring (Better Stack or Uptime Robot) on the homepage and one key form or booking page, alerting Don and the PM\n- [ ] WP Umbrella connected where it is used for the client's reporting\n- [ ] SSL, domain and hosting renewal dates added to the renewal calendar, with owner named\n- [ ] Wordfence alerts routed to the shared tech inbox (and Slack once the Make.com flow is live)\n- [ ] Maintenance cadence agreed: update window, backup-before-update rule, staging-first where a staging site exists\n- [ ] Site status set in the site register and the client placed in the monthly maintenance run\n\n## 13. Phase 9: QA sign-off (the Don Standard)\n\nGoal: nothing goes live or is handed over until every line below passes. A second person (Anna, Conner or Ryan) repeats the form and tracking tests, so the builder does not sign off their own work.\n\n**Site**\n\n- [ ] Mobile and desktop tested in Chrome, Safari and Firefox\n- [ ] PageSpeed mobile above 70 and desktop above 85, or the reason documented\n- [ ] SSL active, HTTPS enforced, no mixed content\n- [ ] No broken links on primary pages and the 404 page works\n- [ ] Every form tested end to end, including the notification email and the CRM entry\n- [ ] Search engines allowed to index production, and blocked on staging\n- [ ] Favicon, metadata, social share images and sitemap in place\n- [ ] Accessibility basics checked: contrast, alt text, keyboard navigation, form labels\n\n**Tracking and compliance**\n\n- [ ] GTM and GA4 firing confirmed, conversions seen in GA4 and Google Ads, Meta events confirmed\n- [ ] No duplicate tags or conversions\n- [ ] GDPR banner active for EU clients, with consent-first behaviour verified\n- [ ] Privacy and cookie policies live and linked in the footer and on forms\n\n**Operations**\n\n- [ ] Fresh backup confirmed immediately before go-live\n- [ ] Staging tested before production, and approval documented in the onboarding record\n- [ ] Monitoring live: MainWP, Patchstack, BlogVault, uptime\n- [ ] Rollback plan written (what we restore, from where, how long it takes)\n- [ ] DNS cutover, if any, scheduled in a low-traffic window with the client informed\n- [ ] Post-launch check booked for 24 hours and 7 days after go-live\n\nA failed line goes back to its phase owner. The sign-off is recorded with the reviewer's name and the date.\n\n## 14. Phase 10: Handover and documentation\n\nGoal: the client knows what was done, the team can support it, and the record survives staff changes.\n\n- [ ] Client technical record completed: hosting, DNS, registrar, stack and versions, tracking IDs (GTM, GA4, Ads, Pixel), integrations, renewal dates\n- [ ] Credentials moved to the client's vault, with access levels reviewed against the access list from Phase 1\n- [ ] Access that is no longer needed (previous agency, temporary accounts) removed with the client's confirmation\n- [ ] Backup and restore procedure, rollback plan and monitoring contacts documented\n- [ ] Compliance pack stored: cookie scan, processor list, consent configuration, breach contacts\n- [ ] Findings report from Phase 2 closed out, with remaining risks and recommendations listed\n- [ ] Client handover email sent (template below) and any training session held\n- [ ] Support route explained to the client: who to contact, what counts as urgent, expected response times\n- [ ] Onboarding record closed in the task tool and the site register status updated\n- [ ] Lessons noted: anything this SOP missed is sent to Don for the next revision\n\n**Handover email: ZA client (warmer, direct)**\n\n```markdown\nSubject: [Client] website and tracking: onboarding complete\n\nHi [Name],\n\nYour site, tracking and monitoring are now live and checked. Bookings and enquiries are being measured, and the site is backed up and watched around the clock.\n\nWhat we did: [two or three business outcomes, for example: moved to faster hosting, fixed enquiry form delivery, set up conversion tracking].\nWhat you need to know: [any open recommendation, with its business impact].\n\nNext step: [action] by [date], owned by [name]. For anything urgent, contact [name and number].\n\nKind regards,\nDon\n```\n\n**Handover email: EU client (formal, structured)**\n\n```markdown\nSubject: [Client]: technical onboarding completed\n\nDear [Name],\n\nThe technical onboarding of [website] is complete. Tracking, security monitoring and backups are active, and the consent banner has been verified against GDPR requirements.\n\nSummary of work: [outcomes in business terms].\nOpen recommendations: [item, impact, proposed date].\nData protection: processors and consent configuration are documented and available on request.\n\nNext step: [action] by [date], owner: [name]. Urgent matters can be raised with [name, contact].\n\nYours sincerely,\nDonovan Rama\nSenior Tech Lead, Diginauts\n```\n\n## 15. Escalation and revision history\n\n**Escalate to Rey straight away:**\n\n- A P1 security incident or active compromise found during the baseline audit\n- Any GDPR or POPIA breach notification obligation\n- Any issue on a Tier 1 EU client (The Dylan, Buelow Palais, Hotel Wiechmann)\n- A decision that changes billing, scope or the client contract (for example an unplanned migration or server-side tracking costs)\n- Anything where 24 hours of inaction creates significant risk\n\n**Escalate to Craig:** a client threatening to leave or complaining formally, budget above normal operating spend, regulatory notification, or legal exposure for the agency.\n\nIf an answer is not yet available, send the client a short \"we are investigating\" update with the next update time. Never go silent.\n\n| Version | Date | Change | Author |\n| --- | --- | --- | --- |\n| 1.0 | 3 October 2026 | First release | Don Rama |\n\nReview quarterly, and after any change to the approved stack, hosting or tracking standards.";

const unesc = s => s.replace(/\\([_*#\[\]\\])/g,"$1");
function MdInline({text}) {
  const parts = unesc(text).split(/(\*\*[^*]+\*\*|`[^`]+`)/g);
  return parts.map((p,i)=>{
    if (p.startsWith("**")&&p.endsWith("**")&&p.length>4) return <b key={i} style={{color:T.text,fontWeight:700}}>{p.slice(2,-2)}</b>;
    if (p.startsWith("`")&&p.endsWith("`")&&p.length>2) return <code key={i} style={{background:T.surface2,border:`1px solid ${T.border}`,borderRadius:6,padding:"0 5px",fontSize:11.5,fontFamily:"'IBM Plex Mono',monospace"}}>{p.slice(1,-1)}</code>;
    return <span key={i}>{p}</span>;
  });
}
const CHECK_RE = /^\s*-\s\[( |x|X)\]\s(.*)$/;
const countChecks = body => (body||"").split("\n").filter(l=>CHECK_RE.test(l)).length;
function MdView({body, ticks, onTick}) {
  const lines = (body||"").split("\n"); const out = []; let i = 0, k = 0;
  while (i < lines.length) {
    const l = lines[i];
    if (l.trim().startsWith("```")) {
      const buf = []; i++;
      while (i < lines.length && !lines[i].trim().startsWith("```")) { buf.push(lines[i]); i++; }
      i++;
      out.push(<pre key={k++} style={{background:T.surface2,border:`1px solid ${T.border}`,borderRadius:12,padding:"10px 14px",fontSize:12,color:T.text2,whiteSpace:"pre-wrap",margin:"8px 0",fontFamily:"'IBM Plex Mono',monospace"}}>{buf.join("\n")}</pre>);
      continue;
    }
    if (l.trim().startsWith("|") && i+1 < lines.length && /^\s*\|[\s:-]+\|/.test(lines[i+1])) {
      const rows = [];
      while (i < lines.length && lines[i].trim().startsWith("|")) { rows.push(lines[i].trim().replace(/^\||\|$/g,"").split("|").map(c=>c.trim())); i++; }
      const head = rows[0], bodyRows = rows.slice(2);
      out.push(
        <div key={k++} style={{overflowX:"auto",margin:"8px 0"}}>
          <table style={{borderCollapse:"collapse",width:"100%",fontSize:12}}>
            <thead><tr>{head.map((c,j)=><th key={j} style={{textAlign:"left",padding:"6px 10px",borderBottom:`1px solid ${T.border2}`,color:T.text2,fontSize:10.5,letterSpacing:"0.08em",textTransform:"uppercase",fontWeight:600}}><MdInline text={c}/></th>)}</tr></thead>
            <tbody>{bodyRows.map((r,j)=><tr key={j}>{r.map((c,m)=><td key={m} style={{padding:"6px 10px",borderBottom:`1px solid ${T.border}`,color:T.text,verticalAlign:"top"}}><MdInline text={c}/></td>)}</tr>)}</tbody>
          </table>
        </div>
      );
      continue;
    }
    const h = l.match(/^(#{1,4})\s+(.*)$/);
    if (h) {
      const lvl = h[1].length;
      out.push(<div key={k++} style={{fontSize:lvl<=2?15:13,fontWeight:700,color:T.text,margin:lvl<=2?"20px 0 6px":"14px 0 4px",paddingTop:lvl<=2?14:0,borderTop:lvl<=2?`1px solid ${T.border}`:"none"}}><MdInline text={h[2]}/></div>);
      i++; continue;
    }
    const cm = l.match(CHECK_RE);
    if (cm) {
      const txt = cm[2], on = !!(ticks && ticks[txt]);
      out.push(
        <label key={k++} style={{display:"flex",alignItems:"flex-start",gap:10,padding:"3px 0",cursor:"pointer",fontSize:13,lineHeight:1.5,color:on?T.text3:T.text}}>
          <input type="checkbox" checked={on} onChange={()=>onTick&&onTick(txt)} style={{marginTop:4,accentColor:"#f4f4f5",flexShrink:0}}/>
          <span style={{textDecoration:on?"line-through":"none"}}><MdInline text={txt}/></span>
        </label>
      );
      i++; continue;
    }
    const bl = l.match(/^\s*[-*]\s+(.*)$/);
    if (bl) { out.push(<div key={k++} style={{display:"flex",gap:10,padding:"2px 0",fontSize:13,lineHeight:1.5,color:T.text}}><span style={{color:T.text3}}>•</span><span><MdInline text={bl[1]}/></span></div>); i++; continue; }
    const nl = l.match(/^\s*(\d+)\.\s+(.*)$/);
    if (nl) { out.push(<div key={k++} style={{display:"flex",gap:10,padding:"2px 0",fontSize:13,lineHeight:1.5,color:T.text}}><span style={{color:T.text3,minWidth:16}}>{nl[1]}.</span><span><MdInline text={nl[2]}/></span></div>); i++; continue; }
    if (!l.trim()) { i++; continue; }
    out.push(<div key={k++} style={{fontSize:13,lineHeight:1.6,color:T.text2,margin:"4px 0"}}><MdInline text={l}/></div>);
    i++;
  }
  return <div>{out}</div>;
}

function SopLibrary({service, data, upd, client}) {
  const [open, setOpen] = useState({});
  const [edit, setEdit] = useState(null);      // {id,title,link,body}
  const [driveEdit, setDriveEdit] = useState(false);
  const [driveIn, setDriveIn] = useState("");
  useEffect(()=>{ if(!data.sops) upd(d=>{ d.sops = SOP_SEED(); }); },[]);
  const sops = ((data.sops||{})[service]) || [];
  const drive = ((data.sopDrive||{})[service]) || "";
  const cid = client ? client.id : "";
  const setList = fn => upd(d=>{ d.sops = d.sops||SOP_SEED(); d.sops[service] = d.sops[service]||[]; fn(d.sops[service]); });
  const addSop = () => { const id = "sop_"+uid(); setList(l=>{ l.unshift({id,title:"New SOP",link:"",updated:Date.now(),body:"## Purpose\n\nWhat this SOP covers.\n\n## Steps\n\n- [ ] First step\n- [ ] Second step"}); }); setOpen(o=>({...o,[id]:true})); setEdit({id,title:"New SOP",link:"",body:"## Purpose\n\nWhat this SOP covers.\n\n## Steps\n\n- [ ] First step\n- [ ] Second step"}); };
  const saveEdit = () => { const e = edit; setList(l=>{ const s = l.find(x=>x.id===e.id); if(s){ s.title = e.title.trim()||"Untitled SOP"; s.link = e.link||""; s.body = e.body; s.updated = Date.now(); } }); setEdit(null); };
  const delSop = id => { setList(l=>{ const i = l.findIndex(x=>x.id===id); if(i>=0) l.splice(i,1); }); if(edit&&edit.id===id) setEdit(null); };
  const tickKey = id => id+"|"+cid;
  const ticksOf = id => (data.sopChecks||{})[tickKey(id)] || {};
  const toggleTick = (id,txt) => { if(!cid) return; upd(d=>{ d.sopChecks = d.sopChecks||{}; const k = tickKey(id); d.sopChecks[k] = d.sopChecks[k]||{}; if(d.sopChecks[k][txt]) delete d.sopChecks[k][txt]; else d.sopChecks[k][txt] = true; }); };
  const resetTicks = id => upd(d=>{ if(d.sopChecks) delete d.sopChecks[tickKey(id)]; });
  const saveDrive = () => { upd(d=>{ d.sopDrive = d.sopDrive||{}; d.sopDrive[service] = driveIn.trim(); }); setDriveEdit(false); };
  const done = id => Object.keys(ticksOf(id)).length;

  return (
    <div style={{height:"100%",overflowY:"auto"}}>
      <div style={{maxWidth:880,margin:"0 auto",padding:"22px 24px 40px"}}>
        <div style={{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap",marginBottom:6}}>
          <span style={{fontWeight:700,fontSize:18,color:T.text}}>SOPs</span>
          <span style={{fontSize:12,color:T.text3}}>{SOP_SERVICES[service]} · {sops.length}</span>
          <div style={{marginLeft:"auto",display:"flex",gap:6,alignItems:"center"}}>
            {drive ? <HBtn href={drive}>G.Drive SOP folder</HBtn> : <HBtn onClick={()=>{setDriveIn("");setDriveEdit(true);}}>Link G.Drive SOP folder</HBtn>}
            {drive && <HBtn onClick={()=>{setDriveIn(drive);setDriveEdit(true);}}>Edit link</HBtn>}
            <Btn variant="primary" onClick={addSop}><Icon n="plus" size={13}/>New SOP</Btn>
          </div>
        </div>
        {driveEdit && (
          <div style={{display:"flex",gap:8,alignItems:"center",margin:"10px 0 4px"}}>
            <input autoFocus value={driveIn} onChange={e=>setDriveIn(e.target.value)} onKeyDown={e=>{ if(e.key==="Enter") saveDrive(); if(e.key==="Escape") setDriveEdit(false); }} placeholder="https://drive.google.com/drive/folders/…" style={{...INP,flex:1}}/>
            <Btn variant="primary" onClick={saveDrive}>Save</Btn><Btn onClick={()=>setDriveEdit(false)}>Cancel</Btn>
          </div>
        )}
        <div style={{fontSize:12,color:T.text3,margin:"2px 0 18px"}}>Standard operating procedures for {SOP_SERVICES[service]}. Checklist ticks are saved per client{client?<> (currently <b style={{color:T.text2}}>{client.name}</b>)</>:null}.</div>
        {sops.length===0 && <div style={{border:`1px dashed ${T.border2}`,borderRadius:16,padding:"28px 20px",textAlign:"center",color:T.text3,fontSize:13}}>No SOPs yet. Add the first one, or link the G.Drive SOP folder above.</div>}
        {sops.map(s=>{
          const isOpen = !!open[s.id]; const editing = edit && edit.id===s.id; const total = countChecks(s.body);
          return (
            <div key={s.id} style={{background:T.surface,border:`1px solid ${T.border}`,borderRadius:16,marginBottom:10,overflow:"hidden"}}>
              <div onClick={()=>setOpen(o=>({...o,[s.id]:!isOpen}))} style={{display:"flex",alignItems:"center",gap:10,padding:"13px 16px",cursor:"pointer"}}>
                <Icon n="chevron" size={12} style={{transform:`rotate(${isOpen?90:0}deg)`,transition:"transform .15s",color:T.text3}}/>
                <span style={{fontWeight:600,fontSize:14,color:T.text,flex:1,minWidth:0,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{s.title}</span>
                {total>0 && cid && <span style={{fontSize:11,color:T.text2,background:T.surface2,border:`1px solid ${T.border}`,borderRadius:999,padding:"2px 10px"}}>{done(s.id)} / {total}</span>}
                <span style={{fontSize:11,color:T.text3}}>{new Date(s.updated||Date.now()).toLocaleDateString("en-ZA",{day:"numeric",month:"short",year:"numeric"})}</span>
              </div>
              {isOpen && (
                <div style={{borderTop:`1px solid ${T.border}`,padding:"14px 18px 16px"}}>
                  {editing ? (
                    <div>
                      <Field label="Title"><FIn value={edit.title} onChange={v=>setEdit(e=>({...e,title:v}))} placeholder="SOP title"/></Field>
                      <Field label="Link (optional, e.g. the Google Doc)"><FIn value={edit.link} onChange={v=>setEdit(e=>({...e,link:v}))} placeholder="https://"/></Field>
                      <Field label="Content (## headings, - bullets, - [ ] checklist items, | tables |)">
                        <textarea value={edit.body} onChange={e=>setEdit(x=>({...x,body:e.target.value}))} rows={22} style={{...INP,resize:"vertical",fontFamily:"'IBM Plex Mono',monospace",fontSize:12,lineHeight:1.55}}/>
                      </Field>
                      <div style={{display:"flex",gap:8,justifyContent:"flex-end"}}><Btn onClick={()=>setEdit(null)}>Cancel</Btn><Btn variant="primary" onClick={saveEdit}>Save SOP</Btn></div>
                    </div>
                  ) : (
                    <div>
                      <div style={{display:"flex",gap:6,alignItems:"center",marginBottom:8,flexWrap:"wrap"}}>
                        <Btn size="sm" onClick={()=>setEdit({id:s.id,title:s.title,link:s.link||"",body:s.body||""})}><Icon n="edit" size={12}/>Edit</Btn>
                        {s.link && <HBtn href={s.link}>Open link</HBtn>}
                        {total>0 && cid && done(s.id)>0 && <ConfirmBtn label="Reset ticks" confirmLabel="Reset for this client?" onConfirm={()=>resetTicks(s.id)} style={{fontSize:12,padding:"6px 12px",borderRadius:999,border:`1px solid ${T.border2}`,background:"transparent",color:T.text2,cursor:"pointer",fontFamily:"inherit"}}/>}
                        <span style={{marginLeft:"auto"}}><ConfirmBtn label="Delete" confirmLabel="Click again to delete" onConfirm={()=>delSop(s.id)} style={{fontSize:12,padding:"6px 12px",borderRadius:999,border:`1px solid ${T.border2}`,background:"transparent",color:"#ff6b6b",cursor:"pointer",fontFamily:"inherit"}}/></span>
                      </div>
                      <MdView body={s.body} ticks={ticksOf(s.id)} onTick={txt=>toggleTick(s.id,txt)}/>
                    </div>
                  )}
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

const FX_DEFAULT = {USD:18.5,EUR:20.5};
const money = n => "R"+Math.round(n).toLocaleString("en-ZA").replace(/,/g," ");
function subInfo(sub, fx) {
  if (!sub || !sub.paid) return null;
  let amount = sub.amount!==undefined && sub.amount!=="" ? parseFloat(sub.amount) : NaN;
  let cur = sub.cur||"ZAR", cyc = sub.cycle||"";
  const txt = sub.cost||"";
  if (isNaN(amount) && txt) {
    const m = txt.replace(/\s/g,"").match(/(\d[\d,]*\.?\d*)/);
    if (m) amount = parseFloat(m[1].replace(/,/g,""));
    if (/\$|usd/i.test(txt)) cur="USD"; else if (/€|eur/i.test(txt)) cur="EUR";
    if (/year|annual|\/yr|\bpa\b/i.test(txt)) cyc="annual"; else if (/month|\/m\b|\bpm\b|\/mo/i.test(txt)) cyc="monthly";
  }
  if (isNaN(amount)) return {known:false};
  if (!cyc) cyc = "monthly";
  const zar = amount * (cur==="ZAR"?1:((fx||FX_DEFAULT)[cur]||1));
  const monthly = cyc==="annual" ? zar/12 : zar;
  return {known:true, amount, cur, cyc, charge:zar, monthly, annual:monthly*12};
}
function Kpi({label, value, sub, tone}) {
  return <div style={{background:T.surface,border:`1px solid ${T.border}`,borderRadius:14,padding:"12px 14px"}}>
    <div style={{fontSize:10.5,fontWeight:600,letterSpacing:"0.08em",textTransform:"uppercase",color:T.text3}}>{label}</div>
    <div style={{fontSize:22,fontWeight:700,color:tone||T.text,marginTop:4,fontVariantNumeric:"tabular-nums"}}>{value}</div>
    {sub && <div style={{fontSize:11.5,color:T.text3,marginTop:2}}>{sub}</div>}
  </div>;
}
function Panel({title, children, note}) {
  return <div style={{background:T.surface,border:`1px solid ${T.border}`,borderRadius:14,padding:"12px 14px",minWidth:0}}>
    <div style={{display:"flex",alignItems:"baseline",gap:8,marginBottom:8}}><span style={{fontSize:11,fontWeight:600,letterSpacing:"0.1em",textTransform:"uppercase",color:T.text}}>{title}</span>{note && <span style={{fontSize:11,color:T.text4}}>{note}</span>}</div>
    {children}
  </div>;
}

const SR_FILTERS = [["tier","Tier"],["entity","Entity"],["type","Site type"],["hosted","Hosted"],["platform","Platform"],["law","Law"],["ff","FF CVE"]];
function SiteRegister({data, upd}) {
  const [q, setQ] = useState("");
  const [flt, setFlt] = useState({});
  const [open, setOpen] = useState({});
  const [form, setForm] = useState(null);
  useEffect(()=>{ if(!data.siteRegister) upd(d=>{ d.siteRegister = SITE_REGISTER_SEED.map(r=>({...r})); }); },[]);
  const rows = data.siteRegister||[];
  const opts = k => ["All",...[...new Set(rows.map(SR_GROUPS[k]))].sort((a,b)=>k==="tier"?SR_TIER_ORDER.indexOf(a)-SR_TIER_ORDER.indexOf(b):a.localeCompare(b))];
  const ql = q.trim().toLowerCase();
  const shown = rows.map((r,i)=>({r,i})).filter(({r})=>(!ql || SR_COLS.some(([k])=>(r[k]||"").toLowerCase().includes(ql))) && SR_FILTERS.every(([k])=>!flt[k]||flt[k]==="All"||SR_GROUPS[k](r)===flt[k]))
    .sort((a,b)=>{ const ta=SR_TIER_ORDER.indexOf(a.r.tier), tb=SR_TIER_ORDER.indexOf(b.r.tier); return (ta<0?99:ta)-(tb<0?99:tb) || (a.r.client||"").localeCompare(b.r.client||"") || a.i-b.i; });
  const activeN = Object.values(flt).filter(v=>v&&v!=="All").length;
  const save = () => { const f=form; if(!f.client.trim()) return; const row={...f}; delete row._new; upd(d=>{ d.siteRegister=d.siteRegister||[]; const i=d.siteRegister.findIndex(x=>x.id===row.id); if(i>=0) d.siteRegister[i]=row; else d.siteRegister.push(row); }); setForm(null); };
  const del = f => { upd(d=>{ d.siteRegister=(d.siteRegister||[]).filter(x=>x.id!==f.id); }); setForm(null); };
  const blank = () => { const r={id:"sr_"+uid(),_new:true}; SR_COLS.forEach(([k])=>{r[k]="";}); r.tier="Not on tier map"; return r; };
  const tone = r => { const v=(r.ff||"").toLowerCase(); if(/partial|not scanned|confirm/.test(v)) return "#ff9f0a"; if(/closed|not installed|not applicable|alias/.test(v)) return "#30d158"; return T.text3; };
  const th = {padding:"9px 12px",textAlign:"left",fontWeight:600,fontSize:10,color:T.text2,letterSpacing:"0.1em",textTransform:"uppercase",borderBottom:`1px solid ${T.border}`,whiteSpace:"nowrap",background:T.surface2,position:"sticky",top:0,zIndex:2};
  const td = {padding:"8px 12px",fontSize:12,color:T.text,whiteSpace:"nowrap",maxWidth:220,overflow:"hidden",textOverflow:"ellipsis"};
  const cols = ["tier","client","domain","type","hosted","platform","builder","law","region","ff","billed"];
  const label = Object.fromEntries(SR_COLS);
  return (
    <div style={{height:"100%",display:"flex",flexDirection:"column",minHeight:0}}>
      <div style={{padding:"14px 20px 12px",borderBottom:`1px solid ${T.border}`,flexShrink:0}}>
        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:10,flexWrap:"wrap"}}>
          <span style={{fontWeight:700,fontSize:16,color:T.text}}>Client Site Register</span>
          <span style={{fontSize:12,color:T.text3}}>{shown.length} of {rows.length} sites</span>
          <input value={q} onChange={e=>setQ(e.target.value)} placeholder="Search sites, clients, stack" style={{...INP,width:240,marginLeft:"auto",padding:"6px 14px"}}/>
          <Btn variant="primary" onClick={()=>setForm(blank())}><Icon n="plus" size={13}/>Add site</Btn>
        </div>
        <div style={{display:"flex",gap:6,flexWrap:"wrap",alignItems:"center"}}>
          {SR_FILTERS.map(([k,lab])=>{ const v=flt[k]||"All", on=v!=="All"; return <select key={k} value={v} onChange={e=>setFlt(f=>({...f,[k]:e.target.value}))} style={{background:on?"var(--inv)":T.surface2,color:on?"var(--inv-fg)":T.text3,border:`1px solid ${on?"var(--inv)":T.border}`,borderRadius:999,padding:"5px 12px",fontSize:11.5,fontFamily:"inherit",cursor:"pointer",outline:"none"}}>{opts(k).map(o=><option key={o} value={o}>{o==="All"?"All "+lab:o}</option>)}</select>; })}
          {(activeN>0||q) && <button onClick={()=>{setFlt({});setQ("");}} style={{background:"none",border:"none",color:T.text3,fontSize:12,cursor:"pointer",fontFamily:"inherit",textDecoration:"underline"}}>Clear</button>}
        </div>
      </div>
      <div style={{flex:1,overflow:"auto",padding:"14px 20px 30px"}}>
        <div style={{border:`1px solid ${T.border}`,borderRadius:14,overflow:"auto",background:T.surface}}>
          <table style={{width:"100%",borderCollapse:"collapse"}}>
            <thead><tr><th style={{...th,width:28}}></th>{cols.map(k=><th key={k} style={th}>{label[k]}</th>)}<th style={th}></th></tr></thead>
            <tbody>
              {shown.length===0 && <tr><td colSpan={cols.length+2} style={{padding:"30px 16px",color:T.text3,fontSize:13}}>No sites match.</td></tr>}
              {shown.map(({r},n)=>{ const isOpen=!!open[r.id]; return (
                <React.Fragment key={r.id}>
                  <tr onClick={()=>setOpen(o=>({...o,[r.id]:!o[r.id]}))} style={{cursor:"pointer",borderBottom:`1px solid ${T.border}`,background:n%2?T.surface:T.bg}}>
                    <td style={{...td,color:T.text3,fontSize:9}}>{isOpen?"▾":"▸"}</td>
                    {cols.map(k=>k==="client" ? <td key={k} style={{...td,fontWeight:600}}>{r.client}{r.entity && <span style={{marginLeft:6,fontSize:9.5,fontWeight:700,color:T.text3,border:`1px solid ${T.border}`,borderRadius:999,padding:"1px 6px"}}>{r.entity}</span>}</td>
                      : k==="ff" ? <td key={k} style={{...td,color:tone(r)}}>{r.ff||"-"}</td>
                      : <td key={k} style={{...td,color:k==="tier"||k==="domain"?T.text:T.text2}} title={r[k]}>{r[k]||"-"}</td>)}
                    <td style={td}><button title="Edit site" onClick={e=>{e.stopPropagation();setForm({...r});}} style={{background:"none",border:"none",color:T.text3,cursor:"pointer",display:"flex"}}><Icon n="edit" size={13}/></button></td>
                  </tr>
                  {isOpen && <tr style={{background:T.surface2,borderBottom:`1px solid ${T.border}`}}><td></td><td colSpan={cols.length+1} style={{padding:"12px 14px"}}>
                    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(220px,1fr))",gap:"8px 18px"}}>
                      {SR_COLS.filter(([k])=>!cols.includes(k)&&k!=="notes"&&r[k]).map(([k,lab])=><div key={k} style={{minWidth:0}}><div style={{fontSize:10,fontWeight:600,letterSpacing:"0.08em",textTransform:"uppercase",color:T.text3}}>{lab}</div><div style={{fontSize:12.5,color:T.text,marginTop:2,wordBreak:"break-word"}}>{r[k]}</div></div>)}
                    </div>
                    {r.notes && <div style={{marginTop:10,fontSize:12.5,color:T.text2,lineHeight:1.5,whiteSpace:"pre-wrap"}}>{r.notes}</div>}
                  </td></tr>}
                </React.Fragment>
              ); })}
            </tbody>
          </table>
        </div>
      </div>
      {form && (
        <Modal title={form._new?"Add site":"Edit site"} wide onClose={()=>setForm(null)}
          footer={<>{!form._new && <ConfirmBtn label="Delete" confirmLabel="Click again to delete" onConfirm={()=>del(form)} style={{marginRight:"auto",fontSize:13,padding:"8px 16px",borderRadius:999,border:`1px solid ${T.border2}`,background:"transparent",color:"#ff6b6b",cursor:"pointer",fontFamily:"inherit"}}/>}<Btn onClick={()=>setForm(null)}>Cancel</Btn><Btn variant="primary" onClick={save}>Save</Btn></>}>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0 12px"}}>
            {SR_COLS.filter(([k])=>k!=="notes"&&k!=="stack").map(([k,lab])=>(
              <Field key={k} label={lab}>
                {k==="tier" ? <FSel value={form.tier} onChange={v=>setForm(f=>({...f,tier:v}))}>{SR_TIER_ORDER.map(o=><option key={o} value={o}>{o}</option>)}</FSel>
                 : <FIn value={form[k]||""} onChange={v=>setForm(f=>({...f,[k]:v}))}/>}
              </Field>))}
          </div>
          <Field label="Other stack (client level)"><FIn textarea rows={2} value={form.stack||""} onChange={v=>setForm(f=>({...f,stack:v}))}/></Field>
          <Field label="Notes"><FIn textarea rows={5} value={form.notes||""} onChange={v=>setForm(f=>({...f,notes:v}))}/></Field>
        </Modal>
      )}
    </div>
  );
}

        title={"Change client status ("+(service||"service")+")"} style={{background:cur.bg,color:cur.fg,fontSize:compact?8:9,fontWeight:800,letterSpacing:"0.05em",textTransform:"uppercase",borderRadius:999,padding:compact?"2px 6px":"2px 8px",cursor:"pointer",whiteSpace:"nowrap",lineHeight:1.3}}>{cur.label}</span>

          {OPTS.map(x=>(

              style={{display:"flex",alignItems:"center",gap:8,padding:"6px 10px",borderRadius:7,cursor:"pointer",background:x.key===cur.key?"rgba(var(--ovc),.07)":"transparent"}}

function App() {
  const [data, setData] = useState(load);
  const [activeId, setActiveId] = useState("c1");

  const [leftPanel, setLeftPanel] = useState("flags"); // "flags" | "clients" | null

  const [searchOpen, setSearchOpen] = useState(false);
  const [superComms, setSuperComms] = useState(null);

  const [backupModal, setBackupModal] = useState(null);
  const [cmImport, setCmImport] = useState(false);
  const [toolsOpen, setToolsOpen] = useState(false);
  const [atPreset, setAtPreset] = useState({v:"All",n:0});
  const [theme, setThemeState] = useState(()=>document.documentElement.getAttribute("data-od")||"dark");
  const toggleTheme = () => { const n = theme==="dark" ? "light" : "dark"; setThemeState(n); document.documentElement.setAttribute("data-od",n); try{ localStorage.setItem("onedash_theme",n); }catch(e){} };
  const [hoveredId, setHoveredId] = useState(null);
  const [highlightedId, setHighlightedId] = useState(null);
  const [cardCtx, setCardCtx] = useState(null); // {kind,id} | {kind,isNew,preset}
  const [footerOpen, setFooterOpen] = useState(null);
  const [toolsFilter, setToolsFilter] = useState("All");
  const [registerSearch, setRegisterSearch] = useState("");
  const [registerFilters, setRegisterFilters] = useState({});
  const [expandedClients, setExpandedClients] = useState({});
  const [dragClientId, setDragClientId] = useState(null);
  const [dragOverClientId, setDragOverClientId] = useState(null);
  const [socialActiveId, setSocialActiveId] = useState(null);
  const [socialSub, setSocialSub] = useState("overview");
  const [extraText, setExtraText] = useState("");
  const searchWrapRef = useRef();
  const searchInputRef = useRef();
  const toolsRef = useRef();
  const fileRef = useRef();

  const upd = fn => setData(d => { const nd = JSON.parse(JSON.stringify(d)); fn(nd); return nd; });
  useEffect(() => { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch {} }, [data]);

  // Ctrl/Cmd+K focuses search; outside click closes search + tools menus
  useEffect(()=>{
    const k = e => { if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==="k"){ e.preventDefault(); if(searchInputRef.current){searchInputRef.current.focus();setSearchOpen(true);} } };
    const m = e => {
      if(searchWrapRef.current && !searchWrapRef.current.contains(e.target)) setSearchOpen(false);
      if(toolsRef.current && !toolsRef.current.contains(e.target)) setToolsOpen(false);
    };
    window.addEventListener("keydown",k); document.addEventListener("mousedown",m);
    return ()=>{ window.removeEventListener("keydown",k); document.removeEventListener("mousedown",m); };
  },[]);

  const effSub = clientTab==="social" ? "board" : (clientTab==="tech" ? techSub : (techSub==="overview" ? "overview" : "board"));
  const inTechPage = clientTab!=="social" && effSub!=="board"; // Overview / Agency Stack / Agency Tools / Client Site Register
  const inTasks = !inTechPage;
  const client = data.clients.find(c=>c.id===activeId);
  const listOf = kind => data[KINDS[kind].coll]||[];
  const visibleOf = kind => listOf(kind).filter(i=>!KINDS[kind].hidden.includes(i.status));
  const isBoard = clientTab==="creative"||clientTab==="tech"||clientTab==="ppc"||(clientTab==="social"&&socialSub==="board");
  const sortedClients = [...data.clients].sort((a,b)=>{const o={"1":0,"2":1,"3":2,"4":3,"internal":4,"churned":5};return (o[a.tier]||6)-(o[b.tier]||6)||a.priority-b.priority;});
  const people = TEAM;
  const backupFilename = `Digi-Unified-Backup_${today()}_v${(data.backupSeq||0)+1}.json`;
  const social = data.social;
  const {status:syncStatus, retry:retrySync, importSnapshot} = useCloudSync(data, setData);
  const socialSync = syncStatus.social, retrySocialSync = retrySync;
  const socialClient = social.clients.find(c=>c.id===socialActiveId);
  const isSocialBoard = clientTab==="social" && socialSub==="board";
  const socialBoardClients = social.clients.filter(c=>socialStatusKey(c.status)!=="archive").sort((a,b)=>a.name.localeCompare(b.name)).map(c=>({id:c.id,name:c.name,color:"#7b68ee",tier:"3",cat:"social",region:(c.platformsList||[]).join(", ")||"no platforms",_social:c}));
  const boardClients = isSocialBoard ? socialBoardClients : data.clients;
  const boardActiveId = isSocialBoard ? ((socialBoardClients.find(c=>c.id===socialActiveId)||socialBoardClients[0]||{}).id) : activeId;

  // Flags
  const crUrgent = visibleOf("creative").filter(isUrgent);
  const crFollow = visibleOf("creative").filter(isCRFollowUp);
  const tcUrgent = listOf("tech").filter(t=>t.urgent===1||t.status==="urgent");
  const tcFollow = listOf("tech").filter(t=>t.followUp===1);
  const ppcUrgent = visibleOf("ppc").filter(isUrgent);
  const ppcFollow = visibleOf("ppc").filter(isCRFollowUp);
  const socialLive = social.clients.filter(c=>socialStatusKey(c.status)!=="archive");
  const socialPriority = socialLive.filter(c=>{const g=gaugeFor(c);return g.cls==="warn"||g.cls==="late";}).sort((a,b)=>{const da=gaugeFor(a).days,db=gaugeFor(b).days;if(da===null)return 1;if(db===null)return -1;return da-db;});
  const socialErrors = socialLive.filter(c=>(c.errorLog||[]).some(e=>e.resolved==="N"));
  const myExtras = (data.extras||[]).filter(e=>e.tab===clientTab);

  // ── Actions ──────────────────────────────────────────────────────────────
  const changeStatus = (kind, id, next) => upd(d=>{
    const coll = KINDS[kind].coll;
    const arr = d[coll]||[]; const t = arr.find(x=>x.id===id); if(!t) return;
    if (next==="completed"||next==="archive") {
