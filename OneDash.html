                          <td colSpan={cols.length+2} style={{padding:"8px 16px 8px 50px"}}>
                            <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
                              {crN && <div style={{flex:1,minWidth:200,padding:"7px 10px",background:"rgba(var(--ovc),.04)",borderRadius:7,border:`1px solid ${T.border}`}}>
                                <div style={{fontSize:9,fontWeight:700,color:T.text3,letterSpacing:"0.05em",textTransform:"uppercase",marginBottom:4}}>Creative Notes</div>
                                <div style={{fontSize:11,color:T.text2,lineHeight:1.5,whiteSpace:"pre-wrap",maxHeight:60,overflow:"hidden",textOverflow:"ellipsis"}}>{crN}</div>
                              </div>}
                              {ppcN && <div style={{flex:1,minWidth:200,padding:"7px 10px",background:"rgba(66,133,244,.06)",borderRadius:7,border:"1px solid rgba(66,133,244,.15)"}}>
                                <div style={{fontSize:9,fontWeight:700,color:"#4285f4",letterSpacing:"0.05em",textTransform:"uppercase",marginBottom:4}}>PPC Notes</div>
                                <div style={{fontSize:11,color:T.text2,lineHeight:1.5,whiteSpace:"pre-wrap",maxHeight:60,overflow:"hidden",textOverflow:"ellipsis"}}>{ppcN}</div>
                              </div>}
                            </div>
                          </td>
                        </tr>
                      );
                    })()}
                  </React.Fragment>
                );
              })}
            </tbody>
          </table>
          </div>
        </div>
      </div>
    );
  };

  // ── Modals ───────────────────────────────────────────────────────────────
  const renderModals = () => (
    <>
      {cardCtx && (()=>{
        const kind = cardCtx.kind;
        const common = {kind,onAddPerson:addPerson,priorityLists:data.priorityLists||{},onTogglePriority:p=>togglePriority(p,kind,cardCtx.id),onToggleFlag:f=>toggleFlag(kind,cardCtx.id,f),onAddClient:name=>addClientQuick(kind,name),clients:isSocialBoard?socialBoardClients:sortedClients,people,activeId:boardActiveId,onClose:()=>setCardCtx(null),getParents:getParents(kind)};
        if (cardCtx.isNew) {
          return <NewTaskDialog key="new" kind={kind} preset={cardCtx.preset} clients={isSocialBoard?socialBoardClients:sortedClients} people={people} activeId={boardActiveId} getParents={getParents(kind)} onAddClient={name=>addClientQuick(kind,name)} onAddPerson={addPerson} onClose={()=>setCardCtx(null)}
            onCreate={(f,mode)=>{ const id=createTask(kind,f); if(!id) return; if(f.fromExtra) upd(d=>{ d.extras=(d.extras||[]).filter(z=>z.id!==f.fromExtra); }); if(f.fromPrio) removePl(f.fromPrio.who,f.fromPrio.id); const k=createdKind.current||kind; if(mode==="open") setCardCtx({kind:k,id}); else if(mode==="close") setCardCtx(null); }}/>;
        }
        const task = listOf(kind).find(x=>x.id===cardCtx.id);
        if (!task) return null;
        return <TaskCard key={task.id} {...common} task={task}
          subtasks={listOf(kind).filter(x=>x.parentId===task.id)}
          onPatch={(id,patch)=>patchTask(kind,id,patch)}
          onStatus={(id,n)=>changeStatus(kind,id,n)}
          onCreate={()=>{}}
          onDelete={id=>{ deleteTask(kind,id); }}
          onArchive={id=>changeStatus(kind,id,"archive")}
          onOpenTask={s=>setCardCtx({kind,id:s.id})}
          allTasks={allTasksFlat()} onLink={(rel,x)=>linkTask(kind,task.id,rel,x.kind,x.task.id)} onUnlink={unlinkTask} onOpenLinked={(k,id)=>setCardCtx({kind:k,id})}
          onAddSub={title=>createTask(kind,{title,parentId:task.id,cId:task.cId,type:task.type,section:task.section,status:"todo"})}
          onAddComment={(id,text)=>addComment(kind,id,text)}
          onDeleteComment={(id,cid)=>deleteComment(kind,id,cid)}/>;
      })()}
      {mlEdit && (
        <Modal title={"S.Comms Meetings link: "+mlEdit.name} onClose={()=>setMlEdit(null)}
          footer={<>{mlEdit.val && (data.meetingLinks||{})[mlEdit.key] && <Btn onClick={()=>{ upd(d=>{ d.meetingLinks={...(d.meetingLinks||{}),[mlEdit.key]:""}; }); setMlEdit(null); }}>Remove</Btn>}<Btn onClick={()=>setMlEdit(null)}>Cancel</Btn><Btn variant="primary" onClick={()=>{ const u=safeUrl(mlEdit.val); upd(d=>{ d.meetingLinks={...(d.meetingLinks||{}),[mlEdit.key]:u}; }); setMlEdit(null); }}>Save</Btn></>}>
          <Field label="Link to the client's meetings channel or board in S.Comms"><FIn value={mlEdit.val} onChange={v=>setMlEdit(m=>({...m,val:v}))} placeholder="https://"/></Field>
        </Modal>
      )}
      {modal==="client" && (
        <Modal title={form._id?"Edit Client":"Add Client"} onClose={()=>setModal(null)}
          footer={<><Btn onClick={()=>setModal(null)}>Cancel</Btn><Btn variant="primary" onClick={saveClient}>Save</Btn></>}>
          <Field label="Name"><FIn value={form.name||""} onChange={v=>setForm(f=>({...f,name:v}))} placeholder="Client name"/></Field>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
            <Field label="Tier">
              <FSel value={form.tier||"3"} onChange={v=>setForm(f=>({...f,tier:v}))}>
                {TIERS.map(t=><option key={t.key} value={t.key}>{t.label}</option>)}
              </FSel>
            </Field>
            <Field label="Category">
              <FSel value={form.cat||"other"} onChange={v=>setForm(f=>({...f,cat:v}))}>
                {["hotel","b2b","ecomm","other","internal"].map(c=><option key={c} value={c}>{c}</option>)}
              </FSel>
            </Field>
          </div>
          <Field label="Color">
            <div style={{display:"flex",gap:8,alignItems:"center"}}>
              <input type="color" value={form.color||T.accent} onChange={e=>setForm(f=>({...f,color:e.target.value}))} style={{width:40,height:32,border:"none",borderRadius:6,cursor:"pointer",background:"none"}}/>
              <FIn value={form.color||T.accent} onChange={v=>setForm(f=>({...f,color:v}))} placeholder="#4f7fff"/>
            </div>
          </Field>
        </Modal>
      )}
      {modal==="stack" && (
        <Modal title={form._id?"Edit Stack Item":"Add Stack Item"} onClose={()=>setModal(null)}
          footer={<>
            {form._id && <Btn variant="danger" onClick={()=>{upd(d=>{d.techStack=d.techStack.filter(s=>s.id!==form._id);});setModal(null);}}>Delete</Btn>}
            <Btn onClick={()=>setModal(null)}>Cancel</Btn>
            <Btn variant="primary" onClick={saveStack}>Save</Btn>
          </>}>
          <Field label="Name"><FIn value={form.name||""} onChange={v=>setForm(f=>({...f,name:v}))} placeholder="Tool name"/></Field>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
            <Field label="Category"><FIn value={form.category||""} onChange={v=>setForm(f=>({...f,category:v}))} placeholder="CMS, Hosting..."/></Field>
            <Field label="Status">
              <FSel value={form.status||"approved"} onChange={v=>setForm(f=>({...f,status:v}))}>
                {APPROVAL.map(a=><option key={a.key} value={a.key}>{a.label}</option>)}
              </FSel>
            </Field>
          </div>
          <Field label="Used For"><FIn value={form.usedFor||""} onChange={v=>setForm(f=>({...f,usedFor:v}))} placeholder="Primary CMS..."/></Field>
          <Field label="Notes"><FIn value={form.notes||""} onChange={v=>setForm(f=>({...f,notes:v}))} placeholder="Notes..." textarea rows={2}/></Field>
        </Modal>
      )}
      {cmImport && <ClientMapImport onClose={()=>setCmImport(false)} onImport={importSnapshot}/>}
      {backupModal==="backup" && (
        <Modal title="Backup Data" onClose={()=>setBackupModal(null)} footer={<><Btn onClick={()=>setBackupModal(null)}>Close</Btn><Btn variant="primary" onClick={()=>{exportData();setBackupModal(null);}}>Download JSON</Btn></>}>
          <div style={{color:T.text2,fontSize:13,lineHeight:1.6}}>
            <p>Download a full JSON backup of all clients, tasks, social media data and settings.</p>
            <p style={{marginTop:8,color:T.text3,fontSize:11}}>File: <code style={{color:T.text,fontSize:11}}>{backupFilename}</code></p>
          </div>
        </Modal>
      )}
      {backupModal==="restore" && (
        <Modal title="Restore from Backup" onClose={()=>setBackupModal(null)} footer={<Btn onClick={()=>setBackupModal(null)}>Cancel</Btn>}>
          <div style={{color:T.text2,fontSize:13,lineHeight:1.6,marginBottom:14}}>Select a previously exported JSON backup file to restore all data.</div>
          <input ref={fileRef} type="file" accept=".json" onChange={e=>{importData(e);setBackupModal(null);}} style={{display:"none"}}/>
          <Btn variant="primary" onClick={()=>fileRef.current?.click()}>Choose Backup File</Btn>
        </Modal>
      )}
      {superComms && client && <SuperCommsModal key={superComms} initialTab={superComms} client={client} data={data} onSaveResources={r=>saveResources(r)} onSaveTech={t=>{saveTechData(t,{cId:activeId,siteId:null});setTechDataOpen(null);}} onClose={()=>setSuperComms(null)} techOptsData={data.techOpts||{}} onAddOpt={addToTechOpts}/>}
      {techDataOpen && (()=>{
        const {cId,siteId}=techDataOpen;
        const tc=data.clients.find(c=>c.id===cId);
        if(!tc) return null;
        const techData=siteId?(tc.tech?.sites?.find(s=>s.id===siteId)||{}):(tc.tech||{});
        return <TechDataPopup tech={techData} onSave={t=>saveTechData(t,techDataOpen)} onClose={()=>setTechDataOpen(null)} techOptsData={data.techOpts||{}} onAddOpt={addToTechOpts} isSite={!!siteId} clientName={tc.name}/>;
      })()}
    </>
  );

  // ── Layout ───────────────────────────────────────────────────────────────
  return (
    <div style={{display:"flex",height:"100vh",background:T.bg,padding:8,gap:8,overflow:"hidden"}}>
      <aside style={{width:leftPanel?300:60,flexShrink:0,background:T.surface,border:`1px solid ${T.border}`,borderRadius:16,overflow:"hidden",transition:"width .25s cubic-bezier(.32,.72,0,1)"}}>
        {leftPanel ? renderSidebar() : renderRail()}
      </aside>
      <main style={{position:"relative",flex:1,minWidth:0,display:"flex",flexDirection:"column",background:T.surface,border:`1px solid ${T.border}`,borderRadius:16,overflow:"hidden"}}>
        {listOpen && <MyList all={allTasksFlat()} archive={data.archive||[]} people={people} who={listWho} setWho={setListWho} lists={data.priorityLists||{}} onOpen={(k,id)=>setCardCtx({kind:k,id})} onAddManual={addManual} onToggleManual={toggleManual} onPromote={promoteManual} onRemove={removePl} onReorder={reorderPl} onTogglePriority={togglePriority} onConvert={convertManual} onClearDone={clearDonePl} onClose={()=>setListOpen(false)}/>}
        {renderTopBar()}
        {healthOpen ? <HealthDash data={data} upd={upd} goTo={(k,t)=>{setHealthOpen(false);goTo(k,t);}}/> : fbOpen ? <FeedbackPage data={data} upd={upd} me={fbMe} setMe={setFbMe} ctx={fbCtx()} onReport={()=>setFbReport({})} onEditReport={e=>setFbReport({edit:e})} openIdProp={fbOpenId} clearOpenId={()=>setFbOpenId(null)}/> : <>
        {renderSubNav()}
        {renderHeader()}
        <div style={{flex:1,minHeight:0,background:T.bg,overflow:"hidden"}}>
          {inTasks && isBoard && ((isSocialBoard ? boardActiveId : client) ? renderBoard(clientTab) : <div style={{padding:24,color:T.text3,fontSize:13}}>Select a client from the sidebar.</div>)}
          {inTasks && clientTab==="social" && socialSub==="overview" && <OverviewShell service="social" label="Social overview" view={ovView("social")} setView={v=>setOvView("social",v)} data={data} upd={upd} goTo={goTo}><SocialDash social={social} upd={upd} activeId={socialActiveId} setActiveId={setSocialActiveId} sync={socialSync} retrySync={retrySocialSync}/></OverviewShell>}
          {clientTab!=="social" && effSub==="overview" && <div style={{height:"100%",display:"flex",flexDirection:"column",minHeight:0}}><HealthDash key={clientTab} data={data} upd={upd} goTo={goTo} lockSvc={clientTab} leftSlot={<span style={{fontSize:20,fontWeight:700,color:T.text,marginRight:6}}>{({creative:"Creative",tech:"Technical",ppc:"PPC"})[clientTab]} health</span>}/></div>}
          {clientTab==="tech" && techSub==="agencytools" && <AgencyTools key={atPreset.n} initialView={atPreset.v} data={data} upd={upd}/>}
          {clientTab==="tech" && techSub==="tools" && <div style={{height:"100%",background:T.surface}}>{renderTechTools()}</div>}
          {clientTab==="tech" && techSub==="register" && <div style={{height:"100%",background:T.bg}}><SiteRegister data={data} upd={upd} openClient={(id,tab)=>{setActiveId(id);setSuperComms(tab||"overview");}} draftClient={srDraft} onDraftUsed={()=>setSrDraft(null)}/></div>}
          {clientTab==="tech" && techSub==="spec" && <div style={{height:"100%",background:T.bg}}><ClientSpecSheet data={data} upd={upd} openClient={(id,tab)=>{setActiveId(id);setSuperComms(tab||"overview");}} addSite={name=>{setSrDraft(name);setTechSub("register");}} goRegister={()=>setTechSub("register")}/></div>}
        </div></>}
      </main>
      {fbReport && <FeedbackReport data={data} upd={upd} me={fbMe} setMe={setFbMe} ctx={fbCtx()} edit={fbReport.edit} startType={fbReport.type} onClose={ok=>{ setFbReport(null); if(ok && !fbReport.edit) { setHealthOpen(false); setFbOpen(true); } }} onVote={(id,name)=>upd(d=>{ const x=(d.feedback||[]).find(z=>z.id===id); if(x){ x.votes=x.votes||{}; x.votes[name]=Date.now(); x.updatedAt=Date.now(); } })}/>}
      {clientTab==="social" && socialSub==="overview" && ovView("social")!=="health" && socialClient && <SocialPanel key={socialClient.id} client={socialClient} upd={upd} onClose={()=>setSocialActiveId(null)}/>}
      {renderModals()}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
</html>

</body></html>
