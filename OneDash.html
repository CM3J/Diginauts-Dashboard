const SR_COLS = [
  ["tier","Tier"],["entity","Entity"],["client","Client"],["domain","Domain"],["type","Site type"],["hosted","Hosted with us"],
  ["sg","SG account"],["plan","SG hosting plan"],["registrar","Domain registrar"],["access","Domain access"],["domExp","Domain renewal"],["region","Region"],["law","Law"],
  ["platform","Platform"],["builder","Builder / theme"],["ssl","SSL"],["backups","Backups"],["stack","Other stack (client level)"],
  ["billed","Hosting billed (tier map)"],["verified","Last verified"],["notes","Notes"]
];
const SR_TIER_ORDER = ["Priority 1","Priority 2","Priority 3","Priority 4","Not on tier map","Archived","Churned"];
const SR_GROUPS = {
  tier: r=>r.tier||"-", entity: r=>r.entity||"None",
  type: r=>srBase(r.type,/\s*\(.*$/)||"Not set",
  hosted: r=>srBase(r.hosted,/\s*\(.*$/)||"Not set",
  platform: r=>srBase(r.platform,/\s*[\d.]+$/)||"Not set",
  law: r=>(r.law||"Not set").replace(/ likely$/,"")
};
function SiteRegister({data, upd, openClient, draftClient, onDraftUsed}) {
  const [info, setInfo] = useState(null);
  const [form, setForm] = useState(null);
  useEffect(()=>{ if(!data.siteRegister) upd(d=>{ d.siteRegister = SITE_REGISTER_SEED.map(r=>({...r})); }); },[]);
  const clients = data.clients||[];
  const blank = (client) => { const r={id:"sr_"+uid(),_new:true,_ver:true}; SR_COLS.forEach(([k])=>{r[k]="";}); r.tier="Not on tier map"; if(client) r.client=client; return r; };
  useEffect(()=>{ if(draftClient){ setForm(blank(draftClient)); onDraftUsed&&onDraftUsed(); } },[draftClient]);
  const rows = (data.siteRegister||[]).map(r=>{ const cl=clients.find(c=>srNorm(c.name)===srNorm(r.client)); const age=r.verified?-dsDays(r.verified):null; const dr=dsDays(r.domExp); return {...r,_id:r.id,_cl:cl||null,_score:srScore(r),_missing:srMissing(r),_stale:age==null||age>90,_age:age,_ren:dr!=null&&dr<=60,_dr:dr}; });
  const save = () => { const f=form; if(!f.client.trim()) return; const row={...f,updated:dsToday()}; if(f._ver) row.verified=dsToday(); ["_new","_ver","_id","_cl","_score","_missing","_stale","_age","_ren","_dr"].forEach(k=>delete row[k]); upd(d=>{ d.siteRegister=d.siteRegister||[]; const i=d.siteRegister.findIndex(x=>x.id===row.id); if(i>=0) d.siteRegister[i]=row; else d.siteRegister.push(row); }); setForm(null); };
  const del = f => { upd(d=>{ d.siteRegister=(d.siteRegister||[]).filter(x=>x.id!==f.id); }); setForm(null); };
  const markVerified = id => upd(d=>{ const r=(d.siteRegister||[]).find(x=>x.id===id); if(r){ r.verified=dsToday(); r.updated=dsToday(); } });
  const gapStyle = k => r => srIsGap(r[k])&&SR_KEY.some(x=>x[0]===k)&&r[k]!=="" ? {color:"var(--warn)"} : null;
  const cols = [
    {k:"tier",label:"Tier",get:r=>r.tier,sort:r=>{const i=SR_TIER_ORDER.indexOf(r.tier);return i<0?99:i;},style:()=>({color:T.text})},
    {k:"client",label:"Client",get:r=>r.client,cell:r=><span style={{fontWeight:600,color:T.text}}>{r.client}{r.entity && <span style={{marginLeft:6,fontSize:9.5,fontWeight:700,color:T.text3,border:`1px solid ${T.border}`,borderRadius:999,padding:"1px 6px"}}>{r.entity}</span>}{!r._cl && <span title="Not a client in OneDash yet" style={{marginLeft:6,fontSize:9.5,fontWeight:700,color:"var(--warn)"}}>not in OneDash</span>}</span>},
    {k:"domain",label:"Domain",get:r=>r.domain,style:gapStyle("domain")},
    {k:"type",label:"Site type",get:r=>r.type,style:gapStyle("type")},
    {k:"hosted",label:"Hosted with us",get:r=>r.hosted,style:gapStyle("hosted")},
    {k:"platform",label:"Platform",get:r=>r.platform,style:gapStyle("platform")},
    {k:"builder",label:"Builder / theme",get:r=>r.builder},
    {k:"law",label:"Law",get:r=>r.law,style:gapStyle("law")},
    {k:"region",label:"Region",get:r=>r.region,style:gapStyle("region")},
    {k:"domExp",label:"Domain renewal",get:r=>r.domExp,cell:r=>r.domExp?<span style={{color:r._ren?"var(--bad)":T.text2}}>{r.domExp}</span>:<span style={{color:T.text4}}>-</span>},
    {k:"verified",label:"Last verified",get:r=>r.verified||"",cell:r=>r.verified?<span style={{color:r._stale?"var(--warn)":"var(--ok)"}}>{r.verified}</span>:<span style={{color:"var(--warn)"}}>never</span>},
    {k:"score",label:"Complete %",get:r=>r._score,cell:r=><span style={{display:"inline-flex",alignItems:"center",gap:6}}><span style={{width:44,height:5,borderRadius:3,background:"rgba(var(--ovc),.1)",overflow:"hidden",display:"inline-block"}}><span style={{display:"block",height:"100%",width:r._score+"%",background:r._score>=90?"var(--ok)":r._score>=60?"var(--warn)":"var(--bad)"}}/></span><span style={{fontVariantNumeric:"tabular-nums"}}>{r._score}%</span></span>},
    {k:"edit",label:"",get:()=>"",cell:r=><button title="Edit site" onClick={e=>{e.stopPropagation();setForm({...r,_ver:true});}} style={{background:"none",border:"none",color:T.text3,cursor:"pointer",display:"flex"}}><Icon n="edit" size={13}/></button>}
  ];
  cols.find(c=>c.k==="edit").sort=()=>"";
  const live = rows.filter(r=>/^live/i.test(r.type||"")).length;
  const tiles = [
    {k:"all",label:"Sites",value:rows.length,sub:live+" live"},
    {k:"gaps",label:"Need details",test:r=>r._missing.length>0,tone:"warn",sub:"a key field is empty or says confirm"},
    {k:"stale",label:"Not verified, 90 days",test:r=>r._stale,tone:"warn",sub:"never or over 90 days ago"},
    {k:"ren",label:"Domain renewals",test:r=>r._ren,tone:"bad",sub:"due within 60 days or past"},
    {k:"ext",label:"Not hosted by us",test:r=>!(r.hosted||"").startsWith("Yes"),tone:"info",sub:"external, unknown or moving"},
    {k:"orph",label:"Not in OneDash",test:r=>!r._cl,tone:"warn",sub:"client name has no OneDash match"}
  ];
  const filters = [{k:"tier",label:"Tier",get:SR_GROUPS.tier,order:SR_TIER_ORDER},{k:"entity",label:"Entity",get:SR_GROUPS.entity},{k:"type",label:"Site type",get:SR_GROUPS.type},{k:"hosted",label:"Hosted",get:SR_GROUPS.hosted},{k:"platform",label:"Platform",get:SR_GROUPS.platform},{k:"law",label:"Law",get:SR_GROUPS.law}];
  const csvExtra = SR_COLS.filter(([k])=>!cols.some(c=>c.k===k)&&k!=="verified").map(([k,l])=>({label:l,get:r=>r[k]||""})).concat([{label:"In OneDash",get:r=>r._cl?"Yes":"No"},{label:"Missing key fields",get:r=>r._missing.join("; ")}]);
  const label = Object.fromEntries(SR_COLS);
  return (
    <div style={{height:"100%"}}>
      <DataSheet title="Client Site Register" noun="sites" rows={rows} cols={cols} filters={filters} tiles={tiles}
        search={r=>SR_COLS.map(([k])=>r[k]||"").join(" ")} onRow={r=>setInfo(r.id)} csvName="site-register" csvExtra={csvExtra}
        defaultSort={(a,b)=>{ const ta=SR_TIER_ORDER.indexOf(a.tier), tb=SR_TIER_ORDER.indexOf(b.tier); return (ta<0?99:ta)-(tb<0?99:tb) || (a.client||"").localeCompare(b.client||""); }}
        actions={<Btn variant="primary" onClick={()=>setForm(blank())}><Icon n="plus" size={13}/>Add site</Btn>} emptyText="No sites match."/>
      {info && (()=>{ const r = rows.find(x=>x.id===info); if(!r) return null;
        const fl = k => (r[k]||"").trim();
        const grid = (title, keys) => { const items = keys.filter(([k])=>fl(k)); if(!items.length) return null; return <div style={{marginTop:14}}>
          <div style={{fontSize:10.5,fontWeight:600,letterSpacing:"0.1em",textTransform:"uppercase",color:T.text3,marginBottom:8}}>{title}</div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"10px 16px"}}>{items.map(([k,lab])=><div key={k} style={{minWidth:0}}><div style={{fontSize:11,color:T.text3}}>{lab}</div><div style={{fontSize:13,color:srIsGap(r[k])&&SR_KEY.some(x=>x[0]===k)?"var(--warn)":T.text,marginTop:2,wordBreak:"break-word",lineHeight:1.4}}>{fl(k)}</div></div>)}</div></div>; };
        const L = label;
        return <Modal title={r.domain||r.client} wide onClose={()=>setInfo(null)}
          footer={<>{r._cl && openClient && <Btn style={{marginRight:"auto"}} onClick={()=>{setInfo(null);openClient(r._cl.id,"tech");}}>Open client</Btn>}<Btn onClick={()=>setInfo(null)}>Close</Btn><Btn onClick={()=>markVerified(r.id)}>Mark verified today</Btn><Btn variant="primary" onClick={()=>{setInfo(null);setForm({...r,_ver:true});}}>Edit</Btn></>}>
          <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
            <span style={{fontSize:15,fontWeight:700,color:T.text}}>{r.client}</span>
            {r.entity && <span style={{fontSize:10,fontWeight:700,color:T.text3,border:`1px solid ${T.border}`,borderRadius:999,padding:"1px 8px"}}>{r.entity}</span>}
            {r.tier && <span style={{fontSize:10,fontWeight:700,color:T.text2,background:T.surface2,borderRadius:999,padding:"2px 9px"}}>{r.tier}</span>}
            {r.type && <span style={{fontSize:10,fontWeight:700,color:T.text2,background:T.surface2,borderRadius:999,padding:"2px 9px"}}>{r.type}</span>}
          </div>
          <div style={{marginTop:12,padding:"10px 12px",background:T.surface2,borderRadius:10,display:"flex",gap:14,alignItems:"center",flexWrap:"wrap"}}>
            <div><div style={{fontSize:10,color:T.text3,letterSpacing:"0.1em",textTransform:"uppercase",fontWeight:600}}>Complete</div><div style={{fontSize:18,fontWeight:700,color:r._score>=90?"var(--ok)":r._score>=60?"var(--warn)":"var(--bad)"}}>{r._score}%</div></div>
            <div><div style={{fontSize:10,color:T.text3,letterSpacing:"0.1em",textTransform:"uppercase",fontWeight:600}}>Last verified</div><div style={{fontSize:13,color:r._stale?"var(--warn)":"var(--ok)",marginTop:3}}>{r.verified?r.verified+" ("+r._age+" days ago)":"Never"}</div></div>
            {r._missing.length>0 && <div style={{flex:1,minWidth:200}}><div style={{fontSize:10,color:T.text3,letterSpacing:"0.1em",textTransform:"uppercase",fontWeight:600}}>Still to confirm</div><div style={{fontSize:12,color:"var(--warn)",marginTop:3}}>{r._missing.join(", ")}</div></div>}
          </div>
          {grid("Site",[["domain",L.domain],["hosted",L.hosted],["region",L.region],["law",L.law]])}
          {grid("Hosting and domain",[["sg",L.sg],["plan",L.plan],["registrar",L.registrar],["access",L.access],["domExp",L.domExp],["billed",L.billed]])}
          {grid("Stack",[["platform",L.platform],["builder",L.builder],["ssl",L.ssl],["backups",L.backups]])}
          {fl("stack") && <div style={{marginTop:10}}><div style={{fontSize:11,color:T.text3}}>{L.stack}</div><div style={{fontSize:13,color:T.text,marginTop:2,lineHeight:1.5,wordBreak:"break-word"}}>{r.stack}</div></div>}
          {fl("notes") && <div style={{marginTop:14}}><div style={{fontSize:10.5,fontWeight:600,letterSpacing:"0.1em",textTransform:"uppercase",color:T.text3,marginBottom:6}}>Notes</div><div style={{fontSize:13,color:T.text2,lineHeight:1.55,whiteSpace:"pre-wrap",wordBreak:"break-word"}}>{r.notes}</div></div>}
        </Modal>; })()}
      {form && (
        <Modal title={form._new?"Add site":"Edit site"} wide onClose={()=>setForm(null)}
          footer={<>{!form._new && <ConfirmBtn label="Delete" confirmLabel="Click again to delete" onConfirm={()=>del(form)} style={{marginRight:"auto",fontSize:13,padding:"8px 16px",borderRadius:999,border:`1px solid ${T.border2}`,background:"transparent",color:"var(--bad)",cursor:"pointer",fontFamily:"inherit"}}/>}<Btn onClick={()=>setForm(null)}>Cancel</Btn><Btn variant="primary" onClick={save}>Save</Btn></>}>
          <datalist id="sr-clients">{clients.map(c=><option key={c.id} value={c.name}/>)}</datalist>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0 12px"}}>
            {SR_COLS.filter(([k])=>k!=="notes"&&k!=="stack"&&k!=="verified").map(([k,lab])=>(
              <Field key={k} label={k==="client"?"Client (pick from OneDash, or type a new name)":lab}>
                {k==="tier" ? <FSel value={form.tier} onChange={v=>setForm(f=>({...f,tier:v}))}>{SR_TIER_ORDER.map(o=><option key={o} value={o}>{o}</option>)}</FSel>
                 : k==="client" ? <input list="sr-clients" value={form.client||""} onChange={e=>setForm(f=>({...f,client:e.target.value}))} style={INP}/>
                 : <FIn type={k==="domExp"?"date":"text"} value={form[k]||""} onChange={v=>setForm(f=>({...f,[k]:v}))}/>}
              </Field>))}
          </div>
          <Field label="Other stack (client level)"><FIn textarea rows={2} value={form.stack||""} onChange={v=>setForm(f=>({...f,stack:v}))}/></Field>
          <Field label="Notes"><FIn textarea rows={4} value={form.notes||""} onChange={v=>setForm(f=>({...f,notes:v}))}/></Field>
          <label style={{display:"flex",alignItems:"center",gap:8,fontSize:12,color:T.text2,cursor:"pointer"}}><input type="checkbox" checked={!!form._ver} onChange={e=>setForm(f=>({...f,_ver:e.target.checked}))}/>I checked these details just now (stamps Last verified as today)</label>
        </Modal>
      )}
    </div>
  );
}

// ── Client Spec Sheet: one row per client, built from the client record plus the Site Register ──
function ClientSpecSheet({data, upd, openClient, addSite, goRegister}) {
  const [info, setInfo] = useState(null);
  const tierLabel = k => (TIERS.find(t=>t.key===k)||{}).label||k||"-";
  const svcs = [["creative","CR"],["tech","TC"],["ppc","PPC"]];
  const rows = (data.clients||[]).map(c=>{ const sp=clientSpec(c,data); const lc=svcs.map(([k,s])=>{ const v=(c.lifecycleBy||{})[k]||c.lifecycle||"active"; return {k,s,v,label:(LCL[v]||LCL.active).label}; });
    const open = (data.items||[]).filter(x=>x.cId===c.id).length+(data.tasks||[]).filter(x=>x.cId===c.id).length+(data.ppcItems||[]).filter(x=>x.cId===c.id).length;
    return {...sp,_id:c.id,_c:c,_lc:lc,_open:open,_name:c.name,_tier:tierLabel(c.tier),_health:(HL[c.health]||HL.unknown).label}; });
  const linkCell = (u,lab) => u ? <a href={u} target="_blank" rel="noreferrer" onClick={e=>e.stopPropagation()} style={{color:"var(--ok)",textDecoration:"none",fontWeight:600}}>{lab||"Open"}</a> : <span style={{color:"var(--warn)"}}>missing</span>;
  const cols = [
    {k:"tier",label:"Tier",get:r=>r._tier,sort:r=>{const i=TIERS.findIndex(t=>t.key===r._c.tier);return i<0?99:i;},style:()=>({color:T.text})},
    {k:"client",label:"Client",get:r=>r._name,cell:r=><span style={{display:"inline-flex",alignItems:"center",gap:8}}><span style={{width:20,height:20,borderRadius:5,background:r._c.color||T.accent,color:"#fff",fontSize:8,fontWeight:800,display:"inline-flex",alignItems:"center",justifyContent:"center"}}>{(r._name||"").split(" ").map(w=>w[0]).join("").slice(0,2).toUpperCase()}</span><span style={{fontWeight:600,color:T.text}}>{r._name}</span></span>},
    {k:"services",label:"Services",get:r=>r._lc.map(x=>x.s+" "+x.label).join(" · "),cell:r=><span>{r._lc.map(x=><span key={x.k} style={{marginRight:8}}><span style={{color:T.text3}}>{x.s}</span> {x.label}</span>)}</span>},
    {k:"open",label:"Open tasks",get:r=>r._open},
    {k:"drive",label:"G.Drive",get:r=>r.drive,cell:r=>linkCell(r.drive)},
    {k:"scBoard",label:"S.Comms Board",get:r=>r.scBoard,cell:r=>linkCell(r.scBoard)},
    {k:"scClient",label:"S.Comms client",get:r=>r.scClient,cell:r=>linkCell(r.scClient)},
    {k:"website",label:"Website",get:r=>r.website},
    {k:"sites",label:"Sites",get:r=>r.n,cell:r=>r.n?r.n:<span style={{color:"var(--warn)"}}>none</span>},
    {k:"platform",label:"Platform",get:r=>r.platform,cell:r=>r.platform?<span>{r.platform}{r.legacy&&<span title="From the old client record. Add the site to the Site Register." style={{marginLeft:5,color:T.text4}}>*</span>}</span>:<span style={{color:T.text4}}>-</span>},
    {k:"builder",label:"Builder",get:r=>r.builder},
    {k:"hosting",label:"Hosting",get:r=>r.hosting},
    {k:"tracking",label:"Tracking",get:r=>r.tracking},
    {k:"score",label:"Spec complete %",get:r=>r.score,cell:r=><span style={{display:"inline-flex",alignItems:"center",gap:6}}><span style={{width:44,height:5,borderRadius:3,background:"rgba(var(--ovc),.1)",overflow:"hidden",display:"inline-block"}}><span style={{display:"block",height:"100%",width:r.score+"%",background:r.score>=90?"var(--ok)":r.score>=60?"var(--warn)":"var(--bad)"}}/></span><span style={{fontVariantNumeric:"tabular-nums"}}>{r.score}%</span></span>}
  ];
  const tiles = [
    {k:"all",label:"Clients",value:rows.length,sub:rows.filter(r=>r._c.tier!=="churned").length+" not churned"},
    {k:"nosite",label:"No site in register",test:r=>!r.n,tone:"warn",sub:"add the site so it is tracked"},
    {k:"links",label:"Missing S.Comms links",test:r=>!r.scBoard||!r.scClient,tone:"warn",sub:"board or client link empty"},
    {k:"drive",label:"Missing G.Drive",test:r=>!r.drive,tone:"warn",sub:"no folder linked"},
    {k:"track",label:"No tracking",test:r=>!r.tracking,tone:"info",sub:"GA4 or GTM not recorded"},
    {k:"inc",label:"Spec incomplete",test:r=>r.score<100,tone:"warn",sub:"any of the 8 checks missing"}
  ];
  const filters = [{k:"tier",label:"Tier",get:r=>r._tier,order:TIERS.map(t=>t.label)},{k:"platform",label:"Platform",get:r=>r.platform||"Not set"},{k:"hosting",label:"Hosting",get:r=>r.hosting||"Not set"}];
  const csvExtra = [{label:"Category",get:r=>r._c.cat||""},{label:"Region",get:r=>r._c.region||""},{label:"Health",get:r=>r._health},{label:"Backups",get:r=>r.backups},{label:"SSL",get:r=>r.ssl},{label:"GA4 ID",get:r=>(r._c.tech||{}).ga4Id||""},{label:"GTM ID",get:r=>(r._c.tech||{}).gtmId||""},{label:"Missing",get:r=>r.missing.join("; ")}];
  return (
    <div style={{height:"100%"}}>
      <DataSheet title="Client Spec Sheet" noun="clients" rows={rows} cols={cols} filters={filters} tiles={tiles}
        search={r=>[r._name,r.platform,r.builder,r.hosting,r.tracking,r.website].join(" ")} onRow={r=>setInfo(r._id)} csvName="client-spec-sheet" csvExtra={csvExtra}
        defaultSort={(a,b)=>{ const ta=TIERS.findIndex(t=>t.key===a._c.tier), tb=TIERS.findIndex(t=>t.key===b._c.tier); return (ta<0?99:ta)-(tb<0?99:tb) || a._name.localeCompare(b._name); }}
        actions={<Btn onClick={goRegister}>Open Site Register</Btn>} emptyText="No clients match."/>
      {info && (()=>{ const r = rows.find(x=>x._id===info); if(!r) return null; const c=r._c, t=c.tech||{};
        const sec = (title,items) => { const its=items.filter(([,v])=>v); return <div style={{marginTop:14}}><div style={{fontSize:10.5,fontWeight:600,letterSpacing:"0.1em",textTransform:"uppercase",color:T.text3,marginBottom:8}}>{title}</div>
          {its.length? <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"10px 16px"}}>{its.map(([k,v])=><div key={k} style={{minWidth:0}}><div style={{fontSize:11,color:T.text3}}>{k}</div><div style={{fontSize:13,color:T.text,marginTop:2,wordBreak:"break-word",lineHeight:1.4}}>{typeof v==="string"&&/^https?:/.test(v)?<a href={v} target="_blank" rel="noreferrer" style={{color:T.text}}>{v}</a>:v}</div></div>)}</div> : <div style={{fontSize:12,color:T.text3}}>Nothing recorded yet.</div>}</div>; };
        return <Modal title={c.name} wide onClose={()=>setInfo(null)}
          footer={<><Btn style={{marginRight:"auto"}} onClick={()=>{setInfo(null);addSite(c.name);}}>Add site</Btn><Btn onClick={()=>setInfo(null)}>Close</Btn><Btn variant="primary" onClick={()=>{setInfo(null);openClient(c.id,"overview");}}>Open client record</Btn></>}>
          <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
            <span style={{fontSize:10,fontWeight:700,color:T.text2,background:T.surface2,borderRadius:999,padding:"2px 9px"}}>{r._tier}</span>
            <span style={{fontSize:10,fontWeight:700,color:T.text2,background:T.surface2,borderRadius:999,padding:"2px 9px"}}>{r._health}</span>
          </div>
          <div style={{marginTop:12,padding:"10px 12px",background:T.surface2,borderRadius:10,display:"flex",gap:14,alignItems:"center",flexWrap:"wrap"}}>
            <div><div style={{fontSize:10,color:T.text3,letterSpacing:"0.1em",textTransform:"uppercase",fontWeight:600}}>Spec complete</div><div style={{fontSize:18,fontWeight:700,color:r.score>=90?"var(--ok)":r.score>=60?"var(--warn)":"var(--bad)"}}>{r.score}%</div></div>
            {r.missing.length>0 && <div style={{flex:1,minWidth:200}}><div style={{fontSize:10,color:T.text3,letterSpacing:"0.1em",textTransform:"uppercase",fontWeight:600}}>Still missing</div><div style={{fontSize:12,color:"var(--warn)",marginTop:3}}>{r.missing.join(", ")}</div></div>}
          </div>
          {sec("Overview",[["Category",c.cat],["Region",c.region],["Open tasks",String(r._open)],...r._lc.map(x=>[x.s+" status",x.label])])}
          {sec("Resources",[["G.Drive",r.drive],["S.Comms Board",r.scBoard],["S.Comms client",r.scClient],["Website",r.website],["Brand guide",(c.resources||{}).brandGuide]])}
          {sec("Tech (from the Site Register"+(r.legacy?", old client record shown":"")+")",[["Sites",r.n?String(r.n):""],["Platform",r.platform],["Builder",r.builder],["Hosting",r.hosting],["SSL",r.ssl],["Backups",r.backups],["Tracking",r.tracking],["GA4 ID",t.ga4Id],["GTM ID",t.gtmId],["Staging URL",t.stagingUrl],["Admin URL",t.adminUrl]])}
          <div style={{marginTop:14}}><div style={{fontSize:10.5,fontWeight:600,letterSpacing:"0.1em",textTransform:"uppercase",color:T.text3,marginBottom:8}}>Sites</div>
            {r.rows.length===0 ? <div style={{fontSize:12,color:"var(--warn)"}}>No sites in the register for this client.</div> : r.rows.map(s=><div key={s.id} style={{display:"flex",gap:10,fontSize:12,padding:"6px 0",borderTop:`1px solid ${T.border}`,color:T.text2}}><span style={{color:T.text,fontWeight:600,flex:1,minWidth:0,overflow:"hidden",textOverflow:"ellipsis"}}>{s.domain||"no domain"}</span><span>{s.type||"-"}</span><span>{s.platform||"-"}</span></div>)}
          </div>
        </Modal>; })()}
    </div>
  );
}

// ── User Lists: a person's personal priorities (tagged tasks and manual entries), their assigned tasks, and a manual list ──
const MLC_WHO_KEY = "od_list_who";
const MLC_SORT_KEY = "od_list_sort";
const MLC_SORTS = [["due","Due date"],["status","Status"],["client","Client"],["service","Service"],["title","Task name"]];
const MLC_COLS = "20px minmax(0,1fr) 92px 120px 112px";
function MyListClassic({layoutToggle, all, archive, people, who, setWho, lists, onOpen, onAddManual, onToggleManual, onPromote, onRemove, onReorder, onTogglePriority, onConvert, onClose, onClearDone}) {
  const [text, setText] = useState("");
  const [tab, setTab] = useState("assigned");
  const [q, setQ] = useState("");
  const [showAll, setShowAll] = useState(false);
  const [view, setView] = useState("all");     // all | prio | assigned | manual | work | recents
  const [colS, setColS] = useState(()=>{ try{ return JSON.parse(localStorage.getItem("od_list_collapsed")||"{}")||{}; }catch(e){ return {}; } });
  const toggleCol = sec => setColS(c=>{ const n={...c,[sec]:!c[sec]}; try{ localStorage.setItem("od_list_collapsed",JSON.stringify(n)); }catch(e){} return n; });
  const show = sec => view==="all" || view===sec;
  const isCol = sec => view==="all" && !!colS[sec];
  const [drag, setDrag] = useState(null);      // {id, sec}
  const [over, setOver] = useState(null);      // {id, pos, sec} or {sec, end:true}
  const [sortOpen, setSortOpen] = useState(false);
  const [sort, setSortS] = useState(()=>{ try{ return JSON.parse(localStorage.getItem(MLC_SORT_KEY)||"null")||{k:"due",d:1}; }catch(e){ return {k:"due",d:1}; } });
  const setSort = s => { setSortS(s); try{ localStorage.setItem(MLC_SORT_KEY,JSON.stringify(s)); }catch(e){} };
  useEffect(()=>{ if(!sortOpen) return; const h=()=>setSortOpen(false); const t=setTimeout(()=>document.addEventListener("mousedown",h),0); return ()=>{ clearTimeout(t); document.removeEventListener("mousedown",h); }; },[sortOpen]);

  const items = lists[who]||[];
  const find = (k,id) => all.find(x=>x.kind===k && x.task.id===id);
  const rows = items.map(it=>it.t==="task" ? {it, ref:find(it.k,it.tid)} : {it}).filter(r=>r.it.t==="manual" || (r.ref && !isDoneTask(r.ref.kind,r.ref.task)));
  const prioRows = rows.filter(r=>r.it.t==="task" || r.it.p);
  const manualRows = rows.filter(r=>r.it.t==="manual" && !r.it.p);
  const prioOpen = prioRows.filter(r=>!(r.it.t==="manual"&&r.it.done)), prioDone = prioRows.filter(r=>r.it.t==="manual"&&r.it.done);
  const manualOpen = manualRows.filter(r=>!r.it.done), manualDone = manualRows.filter(r=>r.it.done);
  const inList = new Set(items.filter(i=>i.t==="task").map(i=>i.k+i.tid));
  const mine = all.filter(x=>!isDoneTask(x.kind,x.task) && asg(x.task).includes(who));
  const watching = all.filter(x=>!isDoneTask(x.kind,x.task) && wch(x.task).includes(who) && !asg(x.task).includes(who));
  const ql = q.trim().toLowerCase();
  const STAT = {urgent:0,review:1,progress:2,revision:3,client:4,awaiting:4,todo:5,blocked:6};
  const cmp = (a,b) => {
    const k=sort.k; let r=0;
    if (k==="due") { const da=a.task.deadline?daysUntil(a.task.deadline):null, db=b.task.deadline?daysUntil(b.task.deadline):null; r = da===null&&db===null?0:da===null?1:db===null?-1:da-db; }
    else if (k==="status") r=(STAT[a.task.status]??9)-(STAT[b.task.status]??9);
    else if (k==="client") r=a.client.localeCompare(b.client);
    else if (k==="service") r=a.label.localeCompare(b.label);
    else r=a.task.title.localeCompare(b.task.title);
    if (r===0 && k!=="title") r=(STAT[a.task.status]??9)-(STAT[b.task.status]??9);
    const nullLast = k==="due" && (!a.task.deadline || !b.task.deadline);
    return nullLast ? r : r*sort.d;
  };
  const pool = (tab==="assigned"?mine:watching).filter(x=>!inList.has(x.kind+x.task.id) && (!ql || (x.task.title+" "+x.client+" "+x.label).toLowerCase().includes(ql))).sort(cmp);
  const shown = showAll ? pool : pool.slice(0,10);

  // drag and drop: reorder inside a list, or move a manual entry between Personal priorities and the manual list
  const secOf = r => (r.it.t==="task"||r.it.p) ? "prio" : "manual";
  const dropOn = (targetId, pos, tsec) => {
    if (!drag || drag.id===targetId) return;
    const di = items.find(i=>i.id===drag.id); if(!di) return;
    if (di.t==="task" && tsec!=="prio") return;                       // tasks only live in Personal priorities
    const ids = items.map(i=>i.id).filter(id=>id!==drag.id); const at = ids.indexOf(targetId);
    ids.splice(at<0?ids.length:(pos==="after"?at+1:at),0,drag.id);
    onReorder(who, ids, di.t==="manual" ? {id:di.id,p:tsec==="prio"} : null);
  };
  const dropEnd = tsec => {
    if (!drag) return; const di = items.find(i=>i.id===drag.id); if(!di) return;
    if (di.t==="task" && tsec!=="prio") return;
    const ids = items.map(i=>i.id).filter(id=>id!==drag.id); ids.push(drag.id);
    onReorder(who, ids, di.t==="manual" ? {id:di.id,p:tsec==="prio"} : null);
  };
  const dndRow = (id, sec) => ({
    draggable:true,
    onDragStart:e=>{ setDrag({id,sec}); e.dataTransfer.effectAllowed="move"; try{e.dataTransfer.setData("text/plain",id);}catch(x){} },
    onDragOver:e=>{ if(!drag) return; e.preventDefault(); e.stopPropagation(); const rc=e.currentTarget.getBoundingClientRect(); const pos=e.clientY>rc.top+rc.height/2?"after":"before"; if(!over||over.id!==id||over.pos!==pos) setOver({id,pos,sec}); },
    onDrop:e=>{ e.preventDefault(); e.stopPropagation(); const rc=e.currentTarget.getBoundingClientRect(); dropOn(id, e.clientY>rc.top+rc.height/2?"after":"before", sec); setDrag(null); setOver(null); },
    onDragEnd:()=>{ setDrag(null); setOver(null); }
  });
  const secDnd = sec => ({
    onDragOver:e=>{ if(!drag) return; const di=items.find(i=>i.id===drag.id); if(!di || (di.t==="task"&&sec!=="prio")) return; e.preventDefault(); if(!over||!over.end||over.sec!==sec) setOver({sec,end:true}); },
    onDrop:e=>{ if(!drag) return; e.preventDefault(); dropEnd(sec); setDrag(null); setOver(null); }
  });
  const secStyle = sec => ({borderRadius:14,padding:6,margin:-6,outline:over&&over.end&&over.sec===sec?"2px dashed var(--info)":"2px dashed transparent",transition:"outline-color .12s"});
  const rowBox = (id, extra) => ({display:"grid",gridTemplateColumns:MLC_COLS,alignItems:"center",columnGap:10,padding:"10px 12px",background:T.surface,borderRadius:12,marginBottom:6,opacity:drag&&drag.id===id?.4:1,border:`1px solid ${T.border}`,borderTop:over&&over.id===id&&over.pos==="before"?"2px solid var(--info)":`1px solid ${T.border}`,borderBottom:over&&over.id===id&&over.pos==="after"?"2px solid var(--info)":`1px solid ${T.border}`,...extra});
  const iconBtn = {background:"none",border:"none",cursor:"pointer",color:T.text3,padding:4,display:"inline-flex",borderRadius:6};
  const meta = x => <div style={{fontSize:11,color:T.text4,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",marginTop:1}}>{x.client} · {x.label}{x.task.deadline?<span style={{color:isOverdue(x.task.deadline)?"#ff6b6b":T.text4}}> · due {fmtDate(x.task.deadline)}</span>:null}</div>;
  const flagDot = x => flagU(x.task) ? <Icon n="flag" size={11} style={{color:"#ff3b30",flexShrink:0}}/> : flagF(x.kind,x.task) ? <Icon n="flag" size={11} style={{color:"#ff9f0a",flexShrink:0}}/> : null;
  const dot = st => <span style={{width:9,height:9,borderRadius:"50%",background:st.bg==="#1c1c1e"?st.text:st.bg,justifySelf:"center"}}/>;
  const head = (label, note, right, sec) => <div style={{display:"flex",alignItems:"center",gap:8,margin:isCol(sec)?0:"0 0 10px"}}>
    <button onClick={()=>toggleCol(sec)} aria-expanded={!isCol(sec)} title={isCol(sec)?"Expand":"Collapse"} style={{display:"inline-flex",alignItems:"center",gap:7,background:"none",border:"none",padding:"2px 0",cursor:"pointer",fontFamily:"inherit"}}>
      <span style={{display:"inline-flex",color:T.text3,transform:isCol(sec)?"rotate(0deg)":"rotate(90deg)",transition:"transform .15s"}}><Icon n="chevron" size={11}/></span>
      <span style={{fontSize:11,fontWeight:700,letterSpacing:"0.1em",textTransform:"uppercase",color:label==="Personal priorities"?"var(--warn)":T.text2}}>{label}</span>
    </button>
    <span style={{fontSize:11,color:T.text4}}>{note}</span><span style={{marginLeft:"auto"}}>{isCol(sec)?null:right}</span></div>;
  const clearBtn = n => n>0 && <button onClick={()=>onClearDone(who)} style={{background:"none",border:"none",color:T.text3,fontSize:11.5,cursor:"pointer",textDecoration:"underline",fontFamily:"inherit"}}>Clear {n} done</button>;
  const addIt = () => { const v=text.trim(); if(!v) return; onAddManual(who,v); setText(""); };
  const seg = (k,label,n) => <button key={k} onClick={()=>{setTab(k);setShowAll(false);}} style={{background:tab===k?"var(--inv)":"transparent",color:tab===k?"var(--inv-fg)":T.text2,border:`1px solid ${tab===k?"var(--inv)":T.border}`,borderRadius:999,padding:"4px 12px",fontSize:12,fontWeight:tab===k?700:600,cursor:"pointer",fontFamily:"inherit"}}>{label} {n}</button>;
  const isMe = who===CURRENT_USER;
  const todoCount = mine.length;
  const recentCount = (()=>{ try{ return (JSON.parse(localStorage.getItem("od_recents")||"[]")).filter(r=>find(r.k,r.id)).length; }catch(e){ return 0; } })();
  const cards = [["prio","Personal priorities",prioOpen.length,"open"],["assigned",isMe?"Assigned to me":"Assigned",mine.length,"open"],["manual","Manual list",manualOpen.length,"open"],["work","My work",todoCount,"to do"],["recents","Recents",recentCount,"opened"]];
  const manualRow = (r, sec) => { const it=r.it; return (
    <div key={it.id} className="cm" {...dndRow(it.id,sec)} style={{...rowBox(it.id),cursor:"grab"}}>
      <button onClick={()=>onToggleManual(who,it.id)} title={it.done?"Mark open":"Mark done"} style={{width:18,height:18,borderRadius:"50%",border:`1.5px solid ${it.done?"#30d158":T.border2}`,background:it.done?"#30d158":"transparent",color:"#0e0e0e",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",padding:0,justifySelf:"center"}}>{it.done && <Icon n="check" size={11}/>}</button>
      <div style={{gridColumn:"2 / 5",fontSize:13.5,color:it.done?T.text3:T.text,textDecoration:it.done?"line-through":"none",whiteSpace:"pre-wrap",wordBreak:"break-word"}}>{it.text}</div>
      <div style={{display:"flex",alignItems:"center",justifyContent:"flex-end",gap:2}}>
        {sec==="manual" && !it.done && <button title="Add to Personal priorities" onClick={()=>onPromote(who,it.id,true)} style={{display:"inline-flex",alignItems:"center",gap:5,background:"transparent",border:`1px solid ${T.border2}`,color:T.text2,borderRadius:999,padding:"3px 10px",fontSize:11.5,fontWeight:600,cursor:"pointer",fontFamily:"inherit",marginRight:4}}><Icon n="star" size={11}/>Prioritise</button>}
        <button className="cm-x" title="Convert to a task card" onClick={()=>onConvert(who,it)} style={iconBtn}><Icon n="plus" size={14}/></button>
        <button className="cm-x" title={sec==="prio"?"Move back to the manual list":"Remove"} onClick={()=>sec==="prio"?onPromote(who,it.id,false):onRemove(who,it.id)} style={iconBtn}><Icon n="x" size={13}/></button>
        {sec==="prio" && <button className="cm-x" title="Remove" onClick={()=>onRemove(who,it.id)} style={iconBtn}><Icon n="trash" size={13}/></button>}
      </div>
    </div>); };
  return (
    <div style={{position:"absolute",inset:0,zIndex:60,background:T.bg,display:"flex",flexDirection:"column",minHeight:0}}>
      <div style={{display:"flex",alignItems:"center",gap:12,padding:"14px 22px",borderBottom:`1px solid ${T.border}`,background:T.surface,flexShrink:0,flexWrap:"wrap"}}>
        <Avatar name={who} size={32}/>
        <div>
          <div style={{fontSize:19,fontWeight:700,color:T.text,letterSpacing:"-0.01em",lineHeight:1.2}}>User Lists</div>
          <div style={{fontSize:11.5,color:T.text3,marginTop:2}}>{isMe?"Your":who+"'s"} personal priorities, assigned tasks and manual list</div>
        </div>
        <div style={{marginLeft:"auto",display:"flex",alignItems:"center",gap:8}}>
          <select aria-label="Whose list" value={who} onChange={e=>setWho(e.target.value)} style={{background:T.bg,color:T.text,border:`1px solid ${T.border}`,borderRadius:999,padding:"6px 14px",fontSize:12.5,fontWeight:600,fontFamily:"inherit",cursor:"pointer"}}>
            {people.map(p=><option key={p} value={p}>{p===CURRENT_USER?p+" (me)":p}</option>)}
          </select>
          {layoutToggle}<Btn onClick={onClose}>Back to dashboards</Btn>
        </div>
      </div>
      <div style={{flex:1,minHeight:0,overflowY:"auto"}} onDragOver={e=>{ if(drag) e.preventDefault(); }}>
        <div style={{maxWidth:1000,margin:"0 auto",padding:"20px 22px 70px"}}>

          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(150px,1fr))",gap:10,marginBottom:6}}>
            {cards.map(([k,l,n,sub])=>{ const on=view===k; return (
              <button key={k} onClick={()=>setView(on?"all":k)} aria-pressed={on} style={{textAlign:"left",background:on?T.surface2:T.surface,border:`1.5px solid ${on?"var(--inv)":T.border}`,borderRadius:14,padding:"12px 14px",cursor:"pointer",fontFamily:"inherit",display:"flex",flexDirection:"column",gap:4,transition:"border-color .12s,background .12s"}}>
                <span style={{fontSize:10.5,fontWeight:700,letterSpacing:"0.08em",textTransform:"uppercase",color:on?T.text:T.text2}}>{l}</span>
                <span style={{display:"flex",alignItems:"baseline",gap:6}}><span style={{fontSize:24,fontWeight:700,color:T.text,letterSpacing:"-0.02em",lineHeight:1.1}}>{n}</span><span style={{fontSize:11.5,color:T.text3}}>{sub}</span></span>
              </button>); })}
          </div>
          <div style={{fontSize:11.5,color:T.text4,margin:"0 2px 22px"}}>{view==="all"?"Click a card to show only that part.":"Showing one part. Click the card again to show everything."}</div>

          {show("prio") && <div {...secDnd("prio")} style={secStyle("prio")}>
          {head("Personal priorities", prioOpen.length+" open"+(isCol("prio")?"":" · drag to reorder"), clearBtn(prioDone.length), "prio")}
          {!isCol("prio") && <>
          {prioOpen.length===0 && prioDone.length===0 && <div style={{padding:"16px 16px",border:`1px dashed ${T.border2}`,borderRadius:12,color:T.text3,fontSize:13,lineHeight:1.5,marginBottom:6}}>Nothing here yet. Use Prioritise on a task or manual entry below, or add a task from its card with Personal priorities.</div>}
          {[...prioOpen,...prioDone].map(r=>{
            if (r.it.t==="manual") return manualRow(r,"prio");
            const x=r.ref, st=statusOf(x.kind,x.task.status), id=r.it.id;
            return (
              <div key={id} className="cm" {...dndRow(id,"prio")} onClick={()=>onOpen(x.kind,x.task.id)} style={{...rowBox(id),cursor:"pointer"}}>
                {dot(st)}
                <div style={{minWidth:0}}>
                  <div style={{display:"flex",alignItems:"center",gap:6,fontSize:13.5,color:T.text}}>{flagDot(x)}<span style={{overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{x.task.title}</span></div>
                  {meta(x)}
                </div>
                <AvatarStack names={asg(x.task)} size={20}/>
                <span style={{fontSize:11.5,color:T.text3,whiteSpace:"nowrap"}}>{st.label}</span>
                <div style={{display:"flex",justifyContent:"flex-end"}}><button className="cm-x" title="Remove from Personal priorities" onClick={e=>{e.stopPropagation();onRemove(who,id);}} style={iconBtn}><Icon n="x" size={13}/></button></div>
              </div>);
          })}
          </>}
          </div>}

          {show("assigned") && <div style={{marginTop:view==="all"?34:0}}>
            {head(isMe?"Assigned to me":"Assigned to "+who, mine.length+" open", <span style={{display:"inline-flex",gap:6,alignItems:"center"}}>{seg("assigned","Assigned",mine.length)}{seg("watching","Watching",watching.length)}<input value={q} onChange={e=>setQ(e.target.value)} placeholder="Filter" style={{width:150,background:T.surface,border:`1px solid ${T.border}`,borderRadius:999,padding:"4px 12px",color:T.text,fontSize:12,fontFamily:"inherit",outline:"none",marginLeft:4}}/></span>, "assigned")}
            {!isCol("assigned") && <>
            <div style={{display:"grid",gridTemplateColumns:MLC_COLS,columnGap:10,alignItems:"center",padding:"0 12px 6px",fontSize:10.5,fontWeight:700,letterSpacing:"0.08em",textTransform:"uppercase",color:T.text4}}>
              <span/><span>Task</span><span/>
              <span style={{position:"relative"}}>
                <button onClick={e=>{e.stopPropagation();setSortOpen(o=>!o);}} title="Sort the assigned tasks" style={{display:"inline-flex",alignItems:"center",gap:4,whiteSpace:"nowrap",background:sortOpen?"rgba(var(--ovc),.08)":"transparent",border:`1px solid ${T.border}`,borderRadius:999,padding:"2px 9px",fontSize:10.5,fontWeight:700,letterSpacing:"0.06em",textTransform:"uppercase",color:T.text2,cursor:"pointer",fontFamily:"inherit"}}>Status<span style={{fontWeight:500,letterSpacing:0,textTransform:"none",color:T.text4}}>· {(MLC_SORTS.find(s=>s[0]===sort.k)||[])[1]}</span><Icon n="chevron" size={9}/></button>
                {sortOpen && (
                  <div onMouseDown={e=>e.stopPropagation()} style={{position:"absolute",top:"calc(100% + 6px)",left:0,zIndex:20,background:T.surface2,border:`1px solid ${T.border2}`,borderRadius:12,padding:5,width:190,boxShadow:"0 12px 36px rgba(0,0,0,.55)",textTransform:"none",letterSpacing:0,fontWeight:500}}>
                    <div style={{fontSize:10,fontWeight:700,letterSpacing:"0.08em",textTransform:"uppercase",color:T.text4,padding:"4px 8px"}}>Sort by</div>
                    {MLC_SORTS.map(([k,l])=>(
                      <div key={k} onClick={()=>{ setSort({k,d:sort.k===k?-sort.d:1}); setSortOpen(false); }} style={{display:"flex",alignItems:"center",gap:8,padding:"6px 8px",borderRadius:8,cursor:"pointer",fontSize:12.5,color:T.text}} onMouseEnter={e=>e.currentTarget.style.background="rgba(var(--ovc),.08)"} onMouseLeave={e=>e.currentTarget.style.background="transparent"}>
                        <span style={{width:12,color:"#30d158",fontWeight:800}}>{sort.k===k?"✓":""}</span>{l}{sort.k===k && <span style={{marginLeft:"auto",color:T.text4,fontSize:11}}>{sort.d===1?"\u2191":"\u2193"}</span>}
                      </div>))}
                    <div style={{fontSize:10.5,color:T.text4,padding:"4px 8px"}}>Choose the same option again to reverse it.</div>
                  </div>)}
              </span>
              <span/>
            </div>
            {pool.length===0 && <div style={{fontSize:12.5,color:T.text4,padding:"6px 2px"}}>{(tab==="assigned"?mine:watching).length===0?"Nothing here.":"Everything here is already in Personal priorities, or nothing matches the filter."}</div>}
            {shown.map(x=>{ const st=statusOf(x.kind,x.task.status); return (
              <div key={x.kind+x.task.id} className="cm" onClick={()=>onOpen(x.kind,x.task.id)} style={{display:"grid",gridTemplateColumns:MLC_COLS,alignItems:"center",columnGap:10,padding:"9px 12px",border:`1px solid ${T.border}`,borderRadius:12,marginBottom:6,cursor:"pointer"}} onMouseEnter={e=>e.currentTarget.style.background=T.surface} onMouseLeave={e=>e.currentTarget.style.background="transparent"}>
                {dot(st)}
                <div style={{minWidth:0}}>
                  <div style={{display:"flex",alignItems:"center",gap:6,fontSize:13,color:T.text}}>{flagDot(x)}<span style={{overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{x.task.title}</span></div>
                  {meta(x)}
                </div>
                <AvatarStack names={asg(x.task)} size={20}/>
                <span style={{fontSize:11.5,color:T.text3,whiteSpace:"nowrap"}}>{st.label}</span>
                <div style={{display:"flex",justifyContent:"flex-end"}}><button title="Add to Personal priorities" onClick={e=>{e.stopPropagation();onTogglePriority(who,x.kind,x.task.id);}} style={{display:"inline-flex",alignItems:"center",gap:5,background:"transparent",border:`1px solid ${T.border2}`,color:T.text2,borderRadius:999,padding:"3px 10px",fontSize:11.5,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}><Icon n="star" size={11}/>Prioritise</button></div>
              </div>); })}
            {!showAll && pool.length>shown.length && <button onClick={()=>setShowAll(true)} style={{background:"none",border:"none",color:T.text2,fontSize:12.5,cursor:"pointer",textDecoration:"underline",fontFamily:"inherit",padding:"4px 2px"}}>Show all {pool.length}</button>}
            </>}
          </div>}

          {show("manual") && <div {...secDnd("manual")} style={{...secStyle("manual"),marginTop:view==="all"?34:0}}>
            {head("Manual list", manualOpen.length+" open"+(isCol("manual")?"":" · your own notes and reminders · drag to reorder"), clearBtn(manualDone.length), "manual")}
            {!isCol("manual") && <>
            <div style={{display:"flex",gap:8,marginBottom:12}}>
              <input value={text} onChange={e=>setText(e.target.value)} onKeyDown={e=>{ if(e.key==="Enter") addIt(); }} placeholder="Add to your manual list, e.g. Call Jutta about pricing terms" style={{flex:1,background:T.surface,border:`1px solid ${T.border}`,borderRadius:12,padding:"10px 14px",color:T.text,fontSize:13.5,fontFamily:"inherit",outline:"none"}} onFocus={e=>e.target.style.borderColor=T.border2} onBlur={e=>e.target.style.borderColor=T.border}/>
              <Btn variant="primary" onClick={addIt} disabled={!text.trim()}>Add</Btn>
            </div>
            {[...manualOpen,...manualDone].map(r=>manualRow(r,"manual"))}
            </>}
          </div>}

          {(show("work")||show("recents")) && <div style={{display:"grid",gridTemplateColumns:view==="all"?"repeat(auto-fit,minmax(380px,1fr))":"1fr",gap:16,marginTop:view==="all"?34:0,alignItems:"start"}}>
            {show("work") && <MLWorkC who={who} all={all} archive={archive} onOpen={onOpen}/>}
            {show("recents") && <MLRecentsC all={all} onOpen={onOpen}/>}
          </div>}
        </div>
      </div>
    </div>
  );
}


// ── My work: to do / done / watching, grouped by due date (layout proof of concept) ──
function MLWorkC({who, all, archive, onOpen}) {
  const [tab, setTab] = useState("todo");
  const [shut, setShut] = useState({});
  const cardBox = {background:T.surface,border:`1px solid ${T.border}`,borderRadius:16,padding:"16px 16px 12px",minWidth:0};
  const live = all.filter(x=>!isDoneTask(x.kind,x.task));
  const todo = live.filter(x=>asg(x.task).includes(who));
  const watch = live.filter(x=>wch(x.task).includes(who) && !asg(x.task).includes(who));
  const done = (archive||[]).filter(a=>asg(a).includes(who)).sort((a,b)=>(b.archivedAt||"").localeCompare(a.archivedAt||"")).slice(0,30);
  const bucket = x => { const d = x.task.deadline ? daysUntil(x.task.deadline) : null; return d===null?"none":d<0?"overdue":d===0?"today":d<=7?"week":"later"; };
  const BK = [["overdue","Overdue","#C23B2E"],["today","Today","#1E8A4C"],["week","Next 7 days","#2F5FE0"],["later","Later","#6E6E73"],["none","No due date","#6E6E73"]];
  const list = tab==="watch" ? watch : todo;

function mlGroups(pool, mode) {
  if (mode==="none") return [{key:"all",label:"",color:"#6E6E73",items:pool,none:true}];
  const m=new Map();
  pool.forEach(x=>{ let k,label,color,frac=null;
    if (mode==="status") { const st=statusOf(x.kind,x.task.status); k=x.task.status; label=st.label; color=mlCol(st); frac=ML_FRAC[k]||0; }
    else if (mode==="priority") { const p=PR[prio(x.task)]||PR.normal; k=p.key; label=p.label; color=p.color; }
    else { const d=x.task.deadline?daysUntil(x.task.deadline):null; k=d===null?"none":d<0?"overdue":d===0?"today":d<=7?"week":"later"; const b=ML_BK.find(b=>b[0]===k); label=b[1]; color=b[2]; }
    if(!m.has(k)) m.set(k,{key:k,label,color,frac,items:[]}); m.get(k).items.push(x); });

}

          {close=><div>{mlHead("Sort by")}{ML_SORTS.map(([k,l])=><MLItem key={k} label={l} check={sort.k===k} right={sort.k===k?<span style={{color:T.text4,fontSize:11}}>{sort.d===1?"↑":"↓"}</span>:null} onClick={()=>{setSort({k,d:sort.k===k?-sort.d:1});close();}}/>)}<div style={{fontSize:10.5,color:T.text4,padding:"4px 8px"}}>Choose the same option again to reverse it.</div></div>}
        </MLDrop>

        <MLDrop align="right" btn={(o,t)=><button onClick={t} title="Quickly filter your tasks" aria-label="Quickly filter your tasks" style={tbBtn(o||scope!=="assigned")}><MLI n="filter"/></button>}>
          {close=><div>{mlHead("Show")}{[["assigned","Assigned to me"],["watching","Watching"],["both","Both"]].map(([k,l])=><MLItem key={k} label={l} check={scope===k} onClick={()=>{setScope(k);close();}}/>)}</div>}
        </MLDrop>
        <button onClick={()=>setClosed(c=>!c)} title="Quickly show closed tasks" aria-label="Quickly show closed tasks" style={tbBtn(closed)}><MLI n="done"/></button>
        <button onClick={()=>setSOpen(o=>!o)} title="Search tasks" aria-label="Search tasks" style={tbBtn(sOpen||!!q)}><MLI n="search"/></button>
        <span style={{width:1,height:16,background:T.border,margin:"0 4px"}}/>
        <MLDrop align="right" width={240} btn={(o,t)=><button onClick={t} title="Customise view" aria-label="Customise view" style={tbBtn(o)}><MLI n="sliders"/></button>}>
          {()=><div>{mlHead("Customise view")}<MLSwitch label="Show client and service" on={loc} onChange={setLoc}/><MLSwitch label="Wrap text" on={wrap} onChange={setWrap}/><MLSwitch label="Show closed tasks" on={closed} onChange={setClosed}/></div>}
        </MLDrop>
      </div>
      {sOpen && <input autoFocus value={q} onChange={e=>setQ(e.target.value)} placeholder="Search tasks" style={{width:"100%",boxSizing:"border-box",background:T.bg,border:`1px solid ${T.border}`,borderRadius:999,padding:"5px 12px",color:T.text,fontSize:12,fontFamily:"inherit",outline:"none",marginBottom:6}}/>}
    </div>
  );
  return (
    <MLShell title={who===CURRENT_USER?"Assigned to me":"Assigned to "+who} sh={sh} toolbar={toolbar}>
      {groups.length===0 && <div style={{fontSize:12.5,color:T.text4,padding:"16px 20px"}}>{ql?"Nothing matches the search.":"Nothing assigned right now."}</div>}
      {groups.map(g=>{ const isShut=!!shut[g.key]; const items=g.items; return (
        <div key={g.key}>
          {!g.none && <GroupHead g={g} closed={isShut} toggle={()=>setShut(s=>({...s,[g.key]:!s[g.key]}))}/>}
          {!isShut && <>
            <ColHead cols={cols} labels={["Name","Priority","Due date",""]} sortKey={[null,"priority","due",null]} sort={sort} setSort={setSort}/>
            {items.map(x=>(
              <div key={x.kind+x.task.id} className="mlr" onClick={()=>onOpen(x.kind,x.task.id)} style={rowCss(cols)}>
                <NameCell x={x} showLoc={loc} wrap={wrap}/><PrioCell x={x}/><DueCell x={x}/>{star(x)}
              </div>))}
          </>}
        </div>); })}
    </MLShell>
  );
}

// ── Personal priorities ──
function MLPrio({who, all, lists, rows, doneRows, sh, dnd, onOpen, onToggleManual, onPromote, onRemove, onAddManual, onClearDone, onTogglePriority}) {

  const ql = text.trim().toLowerCase();

    .sort((a,b)=>(asg(b.task).includes(who)?1:0)-(asg(a.task).includes(who)?1:0)).slice(0,8);
  const all2 = [...rows,...doneRows];
  const header = <ColHead cols={cols} labels={["# Name","Priority","Age","Due date",""]}/>;

      toolbar={<div style={{flexShrink:0,display:"flex",alignItems:"center",height:22,marginBottom:2}}><span style={{fontSize:11,color:T.text4}}>{rows.length} open. Drag to reorder.</span><span style={{flex:1}}/>{doneRows.length>0 && <button onClick={()=>onClearDone(who)} style={{background:"none",border:"none",color:T.text3,fontSize:11.5,cursor:"pointer",textDecoration:"underline",fontFamily:"inherit"}}>Clear {doneRows.length} done</button>}</div>}

            </span>

            <span className="mlk" style={{display:"inline-flex",justifyContent:"flex-end"}}><button title="Move back to the manual list" onClick={()=>onPromote(who,id,false)} style={tbBtn(false)}><Icon n="x" size={13}/></button><button title="Remove" onClick={()=>onRemove(who,id)} style={tbBtn(false)}><Icon n="trash" size={13}/></button></span>

                  <span style={{display:"inline-flex",alignItems:"center",gap:4,fontSize:11,fontWeight:600,color:T.text2}}><Icon n="star" size={11}/>Add</span>
                </div>))}
            </div>

        : <button onClick={()=>setAdding(true)} style={{display:"flex",alignItems:"center",gap:6,width:"100%",padding:"9px 20px",background:"none",border:"none",color:T.text2,fontSize:11,fontWeight:600,cursor:"pointer",fontFamily:"inherit",textAlign:"left"}}><Icon n="plus" size={13}/>Add task</button>}

// ── My work ──
function MLWork({who, all, archive, lists, sh, onOpen, onTogglePriority}) {
  const [tab,setTab]=useState("todo"); const [shut,setShut]=useState({});
  const live=all.filter(x=>!isDoneTask(x.kind,x.task));
  const todo=live.filter(x=>asg(x.task).includes(who));
  const watch=live.filter(x=>wch(x.task).includes(who)&&!asg(x.task).includes(who));
  const done=(archive||[]).filter(a=>asg(a).includes(who)).sort((a,b)=>(b.archivedAt||"").localeCompare(a.archivedAt||"")).slice(0,30);
  const inList=new Set((lists[who]||[]).filter(i=>i.t==="task").map(i=>i.k+i.tid));
  const groups = mlGroups((tab==="watch"?watch:todo).slice().sort((a,b)=>(a.task.deadline||"9999").localeCompare(b.task.deadline||"9999")),"due");
  const cols="minmax(0,1fr) 60px 68px 28px";
  const tabBtn=(k,l,n)=><button key={k} onClick={()=>setTab(k)} style={{background:"none",border:"none",borderBottom:`2px solid ${tab===k?"var(--inv)":"transparent"}`,padding:"2px 2px 8px",marginRight:16,fontSize:12,fontWeight:tab===k?700:500,color:tab===k?T.text:T.text3,cursor:"pointer",fontFamily:"inherit"}}>{l} <span style={{color:T.text4,fontWeight:500}}>{n}</span></button>;
  return (
    <MLShell title="My work" hint="Your tasks by when they are due." sh={sh}
      toolbar={<div style={{flexShrink:0,display:"flex",borderBottom:`1px solid ${T.border}`}}>{tabBtn("todo","To do",todo.length)}{tabBtn("done","Done",done.length)}{tabBtn("watch","Watching",watch.length)}</div>}>
      {tab==="done" ? (done.length===0 ? <div style={{fontSize:12.5,color:T.text4,padding:"14px 20px"}}>Nothing completed yet. Tasks you finish move to the archive and show here.</div> : done.map(a=>(
        <div key={a.id+(a.archivedAt||"")} style={rowCss("16px minmax(0,1fr) auto",{cursor:"default"})}>
          <span style={{color:"#1E8A4C",display:"inline-flex"}}><Icon n="check" size={13}/></span>
          <span style={{fontSize:12,color:T.text3,textDecoration:"line-through",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{a.title}</span>
          <span style={{fontSize:11.5,color:T.text4}}>{a.archivedAt?fmtDate(a.archivedAt):""}</span>
        </div>))) : (groups.length===0 ? <div style={{fontSize:12.5,color:T.text4,padding:"14px 20px"}}>Nothing here.</div> : groups.map(g=>{ const isShut=!!shut[g.key]; return (
        <div key={g.key}>
          <GroupHead g={g} closed={isShut} toggle={()=>setShut(s=>({...s,[g.key]:!s[g.key]}))}/>
          {!isShut && <><ColHead cols={cols} labels={["Name","Priority","Due date",""]}/>{g.items.map(x=>{ const on=inList.has(x.kind+x.task.id); return (
            <div key={x.kind+x.task.id} className="mlr" onClick={()=>onOpen(x.kind,x.task.id)} style={rowCss(cols)}>
              <NameCell x={x}/><PrioCell x={x}/><DueCell x={x}/>
              <span className="mls" style={{opacity:on?1:undefined,justifySelf:"end"}}><button title={on?"Remove from Personal priorities":"Add to Personal priorities"} onClick={e=>{e.stopPropagation();onTogglePriority(who,x.kind,x.task.id);}} style={{...tbBtn(false),color:on?"var(--warn)":T.text3}}><Icon n="star" size={13} style={{fill:on?"currentColor":"none"}}/></button></span>
            </div>); })}</>}
        </div>); }))}
    </MLShell>
  );
}

// ── page ──
function MyListCards({layoutToggle, all, archive, people, who, setWho, lists, onOpen, onAddManual, onToggleManual, onPromote, onRemove, onReorder, onTogglePriority, onConvert, onClose, onClearDone}) {
  const [view,setView]=useState("all");
  const [colS,setColS]=useML("od_list_collapsed",{});
  const [hidden,setHidden]=useML("od_list_hidden",{});
  const [full,setFull]=useState(null); const [manage,setManage]=useState(false);
  const [drag,setDrag]=useState(null); const [over,setOver]=useState(null);
  const wrapRef=useRef(null); const [w,setW]=useState(1200);
  useEffect(()=>{ const el=wrapRef.current; if(!el) return; const ro=new ResizeObserver(es=>{ for(const e of es) setW(e.contentRect.width); }); ro.observe(el); return ()=>ro.disconnect(); },[]);

  const items = lists[who]||[];
  const find = (k,id) => all.find(x=>x.kind===k && x.task.id===id);
  const rows = items.map(it=>it.t==="task" ? {it, ref:find(it.k,it.tid)} : {it}).filter(r=>r.it.t==="manual" || (r.ref && !isDoneTask(r.ref.kind,r.ref.task)));
  const prioRows = rows.filter(r=>r.it.t==="task" || r.it.p);
  const manualRows = rows.filter(r=>r.it.t==="manual" && !r.it.p);
  const prioOpen = prioRows.filter(r=>!(r.it.t==="manual"&&r.it.done)), prioDone = prioRows.filter(r=>r.it.t==="manual"&&r.it.done);
  const manualOpen = manualRows.filter(r=>!r.it.done);
  const mine = all.filter(x=>!isDoneTask(x.kind,x.task) && asg(x.task).includes(who));
  const recentCount = (()=>{ try{ return (JSON.parse(localStorage.getItem("od_recents")||"[]")).filter(r=>find(r.k,r.id)).length; }catch(e){ return 0; } })();
  const counts = {prio:prioOpen.length, assigned:mine.length, manual:manualOpen.length, work:mine.length, recents:recentCount};
  const subs = {prio:"open",assigned:"open",manual:"open",work:"to do",recents:"opened"};

  // drag and drop: reorder inside a list, or move a manual entry between Personal priorities and the manual list
  const dropOn = (targetId, pos, tsec) => {
    if (!drag || drag.id===targetId) return;
    const di = items.find(i=>i.id===drag.id); if(!di) return;
    if (di.t==="task" && tsec!=="prio") return;
    const ids = items.map(i=>i.id).filter(id=>id!==drag.id); const at = ids.indexOf(targetId);
    ids.splice(at<0?ids.length:(pos==="after"?at+1:at),0,drag.id);
    onReorder(who, ids, di.t==="manual" ? {id:di.id,p:tsec==="prio"} : null);
  };
  const dropEnd = tsec => {
    if (!drag) return; const di = items.find(i=>i.id===drag.id); if(!di) return;
    if (di.t==="task" && tsec!=="prio") return;
    const ids = items.map(i=>i.id).filter(id=>id!==drag.id); ids.push(drag.id);
    onReorder(who, ids, di.t==="manual" ? {id:di.id,p:tsec==="prio"} : null);
  };
  const dnd = {
    row:(id,sec)=>({
      draggable:true,
      onDragStart:e=>{ setDrag({id,sec}); e.dataTransfer.effectAllowed="move"; try{e.dataTransfer.setData("text/plain",id);}catch(x){} },
      onDragOver:e=>{ if(!drag) return; e.preventDefault(); e.stopPropagation(); const rc=e.currentTarget.getBoundingClientRect(); const pos=e.clientY>rc.top+rc.height/2?"after":"before"; if(!over||over.id!==id||over.pos!==pos) setOver({id,pos,sec}); },
      onDrop:e=>{ e.preventDefault(); e.stopPropagation(); const rc=e.currentTarget.getBoundingClientRect(); dropOn(id, e.clientY>rc.top+rc.height/2?"after":"before", sec); setDrag(null); setOver(null); },
      onDragEnd:()=>{ setDrag(null); setOver(null); }
    }),
    sec:sec=>({
      onDragOver:e=>{ if(!drag) return; const di=items.find(i=>i.id===drag.id); if(!di || (di.t==="task"&&sec!=="prio")) return; e.preventDefault(); if(!over||!over.end||over.sec!==sec) setOver({sec,end:true}); },
      onDrop:e=>{ if(!drag) return; e.preventDefault(); dropEnd(sec); setDrag(null); setOver(null); }
    }),
    secStyle:sec=>({outline:over&&over.end&&over.sec===sec?"2px dashed var(--info)":"2px dashed transparent",outlineOffset:-4,borderRadius:14,transition:"outline-color .12s"}),
    mark:id=>({opacity:drag&&drag.id===id?.4:1,boxShadow:over&&over.id===id?(over.pos==="before"?"inset 0 2px 0 var(--info)":"inset 0 -2px 0 var(--info)"):"none"})
  };

  const sh0 = id => ({collapsed:view==="all"&&!!colS[id], onToggle:()=>setColS(c=>({...c,[id]:!c[id]})), onExpand:()=>setFull(id)});
  const card = (id, isFull) => {
    const sh = isFull ? {full:true,onClose:()=>setFull(null)} : sh0(id);

const H_KINDS = ["creative","tech","ppc","social"];
const H_LABEL = {creative:"Creative",tech:"Technical",ppc:"PPC",social:"Social Media"};
const H_RANK = {urgent:0,review:1,progress:2,revision:3,client:4,awaiting:4,todo:5,blocked:6};
function hCollect(data, kinds) {
  const out = [];
  H_KINDS.forEach(k=>{
    const names = {}; ((k==="social"?data.social.clients:data.clients)||[]).forEach(c=>{names[c.id]=c.name;});
    (data[KINDS[k].coll]||[]).forEach(t=>{
      if (KINDS[k].hidden.includes(t.status) || t.status==="done" || t.status==="deliver" || t.status==="completed") return;
      if (!dashKinds(k,t).some(x=>kinds.includes(x))) return;
      const days = t.deadline ? daysUntil(t.deadline) : null;
      const urgent = flagU(t);
      const follow = flagF(k,t);
      const ppl = asg(t).filter(p=>TEAM.includes(p));
      out.push({...t,_k:k,_client:names[t.cId]||"No client",_days:days,_urgent:urgent,_follow:follow,_overdue:days!==null&&days<0,_due7:days!==null&&days>=0&&days<=7,_waiting:t.status==="client"||t.status==="awaiting",_blocked:t.status==="blocked"||!!LINK_BLOCKED[t.id],_asg:ppl,_unassigned:ppl.length===0});
    });
  });
  return out;
}

// ── Bugs and ideas: report, vote, discuss and triage. Synced through the "feedback" Firestore field. ──
const FB_BUILD = "2026-10-04";
const FB_ADMINS = ["Don"];
const FB_TYPES = {
  bug:{label:"Bug",plural:"Bugs",hint:"Something is broken or behaves wrongly",c:"var(--bad)"},
  feature:{label:"Feature",plural:"Features",hint:"Something new you would like OneDash to do",c:"var(--info)"},
  improvement:{label:"Improvement",plural:"Improvements",hint:"It works, but it could work better",c:"var(--warn)"},
  question:{label:"Question",plural:"Questions",hint:"You are not sure how something works",c:"var(--text3)"}
};
const FB_STATUS = {
  new:{label:"New",c:"var(--info)"},
  "needs-info":{label:"Needs info",c:"var(--warn)"},
  planned:{label:"Planned",c:"#bf5af2"},
  building:{label:"In progress",c:"var(--warn)"},
  shipped:{label:"Shipped",c:"var(--ok)"},
  declined:{label:"Not doing",c:"var(--text4)"}
};
const FB_OPEN = ["new","needs-info","planned","building"];
const FB_IMPACT = {
  bug:["Cosmetic","Minor","Major","Blocks my work"],
  other:["Nice to have","Useful","Important","Critical"]
};
const FB_AREAS = ["Creative","Technical","PPC","Social Media","Health snapshot","Client Site Register","Client Spec Sheet","Cloud sync","Menu and navigation","Light and dark mode","Other"];
const fbImpactLabel = e => (FB_IMPACT[e.type==="bug"?"bug":"other"])[Math.max(0,Math.min(3,(e.impact||2)-1))];
const fbVotes = e => Object.values(e.votes||{}).filter(v=>v>0).length;
const fbVoted = (e,me) => !!me && (e.votes||{})[me]>0;
const fbWhen = ts => { try{ return new Date(ts).toLocaleString("en-ZA",{day:"numeric",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"}); }catch(e){ return ""; } };
const fbAgo = ts => { const m=Math.max(0,Math.round((Date.now()-ts)/60000)); if(m<1) return "just now"; if(m<60) return m+"m ago"; const h=Math.round(m/60); if(h<24) return h+"h ago"; const d=Math.round(h/24); if(d<30) return d+"d ago"; return fbWhen(ts).split(",")[0]; };
const fbIsAdmin = me => FB_ADMINS.includes(me);

// Merge two lists of entries by id: newest edit wins the fields; votes, comments and history merge per item.
function mergeFb(a, b) {
  const map = new Map();
  const uni = (x,y,key) => { const m=new Map(); [...(x||[]),...(y||[])].forEach(i=>{ const o=m.get(i.id); m.set(i.id, o?{...o,...i,del:o.del||i.del}:i); }); return [...m.values()].sort((p,q)=>(p[key]||0)-(q[key]||0)); };
  [...(a||[]),...(b||[])].forEach(e=>{
    const o = map.get(e.id);
    if (!o) { map.set(e.id, e); return; }
    const newer = (e.updatedAt||0) >= (o.updatedAt||0) ? e : o;
    const votes = {...(o.votes||{})}; Object.keys(e.votes||{}).forEach(k=>{ if(Math.abs(e.votes[k])>Math.abs(votes[k]||0)) votes[k]=e.votes[k]; });
    map.set(e.id, {...newer, votes, comments:uni(o.comments,e.comments,"at"), history:uni(o.history,e.history,"at"), updatedAt:Math.max(o.updatedAt||0,e.updatedAt||0), deleted:(o.deleted||e.deleted)&&newer.deleted!==false ? true : newer.deleted});
  });
  return [...map.values()];
}

function useFbMe() {
  const [me, setM] = useState(()=>{ try{ return localStorage.getItem("od_me")||""; }catch(e){ return ""; } });
  const set = v => { setM(v); try{ localStorage.setItem("od_me",v); }catch(e){} };
  return [me,set];
}

function fbBrief(list, nums) {
  const out = ["# OneDash feedback to build","Build "+FB_BUILD+" · exported "+fbWhen(Date.now()),""];
  list.forEach(e=>{
    out.push("## #"+nums[e.id]+" ["+FB_TYPES[e.type].label+"] "+e.title);
    out.push("- Status: "+FB_STATUS[e.status].label+" · "+(e.type==="bug"?"Severity":"Value")+": "+fbImpactLabel(e)+" · Area: "+e.area+" · Votes: "+fbVotes(e));
    out.push("- Reported by "+e.by+" on "+fbWhen(e.createdAt));
    if (e.ctx && e.ctx.where) out.push("- Where: "+e.ctx.where+(e.ctx.client?" · Client: "+e.ctx.client:"")+" · "+(e.ctx.theme||"")+" · "+(e.ctx.size||"")+" · "+(e.ctx.browser||""));
    if (e.link) out.push("- Link: "+e.link);
    if (e.desc) out.push("","What: "+e.desc);
    if (e.steps) out.push("","Steps to reproduce: "+e.steps);
    if (e.expected) out.push("","Expected: "+e.expected);
    const cs = (e.comments||[]).filter(c=>!c.del);
    if (cs.length) { out.push("","Discussion:"); cs.forEach(c=>out.push("- "+c.by+": "+c.text)); }
    if (e.resolution) out.push("","Resolution: "+e.resolution);
    out.push("");
  });
  return out.join("\n");
}

function FbPill({c, children, solid}) {
  return <span style={{display:"inline-flex",alignItems:"center",fontSize:10.5,fontWeight:700,letterSpacing:"0.04em",padding:"2px 9px",borderRadius:999,whiteSpace:"nowrap",color:solid?"#fff":c,background:solid?c:"transparent",border:solid?"none":"1px solid "+c}}>{children}</span>;
}

// ── Report / edit form ──────────────────────────────────────────────────────
function FeedbackReport({data, upd, me, setMe, ctx, edit, startType, onClose, onVote}) {
  const [type, setType] = useState(edit?edit.type:(startType||"bug"));
  const [f, setF] = useState(()=>edit ? {title:edit.title,desc:edit.desc||"",steps:edit.steps||"",expected:edit.expected||"",area:edit.area,impact:edit.impact||2,link:edit.link||""} : {title:"",desc:"",steps:"",expected:"",area:ctx.area||"Other",impact:2,link:""});
  const [incl, setIncl] = useState(true);
  const [who, setWho] = useState(me||"");
  const [err, setErr] = useState("");
  const set = (k,v) => setF(s=>({...s,[k]:v}));
  const words = s => String(s).toLowerCase().split(/[^a-z0-9]+/).filter(w=>w.length>3);
  const tw = words(f.title);
  const similar = edit||tw.length<2 ? [] : (data.feedback||[]).filter(e=>!e.deleted&&FB_OPEN.includes(e.status)).map(e=>{ const ew=words(e.title+" "+(e.desc||"")); const hit=tw.filter(w=>ew.includes(w)).length; return {e,hit}; }).filter(x=>x.hit>=2&&x.hit>=tw.length*0.5).sort((a,b)=>b.hit-a.hit).slice(0,3).map(x=>x.e);
  const isBug = type==="bug";
  const labels = {
    bug:{t:"What went wrong?",d:"Describe what happened",ph:"e.g. Health snapshot shows the wrong overdue count"},
    feature:{t:"What would you like?",d:"Describe what you would like to be able to do and why",ph:"e.g. Let me filter the Board by assignee"},
    improvement:{t:"What could be better?",d:"Describe what you do now and what would make it easier",ph:"e.g. The register export should keep my filters"},
    question:{t:"What are you unsure about?",d:"Describe what you tried and what confused you",ph:"e.g. How do I archive a social client?"}
  }[type];
  const submit = () => {
    if (!f.title.trim()) { setErr("Give it a short title so it is easy to find."); return; }
    if (!edit && !who) { setErr("Choose your name so we know who to follow up with."); return; }
    const now = Date.now();
    if (!edit) setMe(who);
    upd(d=>{
      d.feedback = d.feedback||[];
      if (edit) { const e=d.feedback.find(x=>x.id===edit.id); if(e){ Object.assign(e,{type,title:f.title.trim(),desc:f.desc.trim(),steps:f.steps.trim(),expected:f.expected.trim(),area:f.area,impact:+f.impact,link:f.link.trim(),updatedAt:now}); e.history=[...(e.history||[]),{id:uid(),at:now,by:me,text:"Edited the report"}]; } }
      else d.feedback.push({id:"fb_"+uid(),type,title:f.title.trim(),desc:f.desc.trim(),steps:isBug?f.steps.trim():"",expected:isBug?f.expected.trim():"",area:f.area,impact:+f.impact,link:f.link.trim(),status:"new",by:who,createdAt:now,updatedAt:now,votes:{[who]:now},comments:[],history:[{id:uid(),at:now,by:who,text:"Reported"}],resolution:"",ctx:incl?{...ctx}:null});
    });
    onClose(true);
  };
  const seg = (k) => { const on=type===k; return <button key={k} onClick={()=>setType(k)} style={{flex:1,textAlign:"left",background:on?"var(--inv)":T.surface2,color:on?"var(--inv-fg)":T.text,border:`1px solid ${on?"var(--inv)":T.border}`,borderRadius:12,padding:"8px 10px",cursor:"pointer",fontFamily:"inherit"}}><div style={{fontSize:12.5,fontWeight:700}}>{FB_TYPES[k].label}</div><div style={{fontSize:10.5,opacity:.75,marginTop:2,lineHeight:1.3}}>{FB_TYPES[k].hint}</div></button>; };
  return (
    <Modal wide title={edit?"Edit report":"Report a bug or idea"} onClose={()=>onClose(false)} footer={<><Btn onClick={()=>onClose(false)}>Cancel</Btn><Btn variant="primary" onClick={submit}>{edit?"Save changes":"Submit"}</Btn></>}>
      <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:6,marginBottom:14}}>{Object.keys(FB_TYPES).map(seg)}</div>
      <Field label={labels.t}><FIn value={f.title} onChange={v=>set("title",v)} placeholder={labels.ph}/></Field>
      {similar.length>0 && <div style={{margin:"-4px 0 12px",padding:"8px 10px",border:`1px dashed ${T.border2}`,borderRadius:12,background:T.surface2}}>
        <div style={{fontSize:11,color:T.text3,marginBottom:4}}>Already reported? Add your vote instead of a new entry.</div>
        {similar.map(e=><div key={e.id} style={{display:"flex",alignItems:"center",gap:8,padding:"3px 0",fontSize:12,color:T.text}}><span style={{flex:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{e.title}</span><span style={{color:T.text4}}>{fbVotes(e)} votes</span><Btn size="sm" onClick={()=>{ onVote(e.id,who||me); onClose(true); }} disabled={!(who||me)}>Me too</Btn></div>)}
      </div>}
      <Field label={isBug?"What happened":"Details"}><FIn textarea rows={3} value={f.desc} onChange={v=>set("desc",v)} placeholder={labels.d}/></Field>
      {isBug && <><Field label="Steps to reproduce"><FIn textarea rows={3} value={f.steps} onChange={v=>set("steps",v)} placeholder={"1. Open Menu\n2. Click ...\n3. See the problem"}/></Field>
      <Field label="What you expected to happen"><FIn value={f.expected} onChange={v=>set("expected",v)} placeholder="What should have happened instead"/></Field></>}
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
        <Field label="Where in OneDash"><FSel value={f.area} onChange={v=>set("area",v)}>{FB_AREAS.map(a=><option key={a} value={a}>{a}</option>)}</FSel></Field>
        <Field label={isBug?"How bad is it":"How much would it help"}><FSel value={String(f.impact)} onChange={v=>set("impact",v)}>{FB_IMPACT[isBug?"bug":"other"].map((l,i)=><option key={l} value={i+1}>{l}</option>)}</FSel></Field>
      </div>
      <Field label="Link or screenshot (optional)"><FIn value={f.link} onChange={v=>set("link",v)} placeholder="Paste a link to a screenshot, Drive file or screen recording"/></Field>
      {!edit && <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,alignItems:"end"}}>
        <Field label="You are"><FSel value={who} onChange={setWho}><option value="">Choose your name</option>{TEAM.map(n=><option key={n} value={n}>{n}</option>)}</FSel></Field>
        <label style={{display:"flex",gap:8,alignItems:"flex-start",fontSize:11.5,color:T.text2,marginBottom:14,cursor:"pointer",lineHeight:1.4}}><input type="checkbox" checked={incl} onChange={e=>setIncl(e.target.checked)} style={{marginTop:2}}/><span>Attach where I am: {ctx.where}{ctx.client?" · "+ctx.client:""}, {ctx.theme}, {ctx.size}</span></label>
      </div>}
      {err && <div style={{color:"var(--bad)",fontSize:12}}>{err}</div>}
    </Modal>
  );
}

// ── Detail slide-over ───────────────────────────────────────────────────────
function FeedbackDrawer({e, num, me, setMe, upd, onClose, onEdit}) {
  const [txt, setTxt] = useState("");
  const [res, setRes] = useState(e.resolution||"");
  useEffect(()=>{ setRes(e.resolution||""); },[e.id]);
  useEffect(()=>{ const k=ev=>{ if(ev.key==="Escape") onClose(); }; window.addEventListener("keydown",k); return ()=>window.removeEventListener("keydown",k); },[]);
  const admin = fbIsAdmin(me), mine = e.by===me;
  const mut = (fn, hist) => upd(d=>{ const x=(d.feedback||[]).find(z=>z.id===e.id); if(!x) return; fn(x); x.updatedAt=Date.now(); if(hist) x.history=[...(x.history||[]),{id:uid(),at:Date.now(),by:me||"Someone",text:hist}]; });
  const needMe = () => { if(me) return true; alert("Choose who you are first, using the dropdown at the top of the Bugs and ideas page."); return false; };
  const vote = () => { if(!needMe()) return; mut(x=>{ x.votes=x.votes||{}; x.votes[me]=fbVoted(x,me)?-Date.now():Date.now(); }); };
  const comment = () => { if(!needMe()||!txt.trim()) return; const t=txt.trim(); setTxt(""); mut(x=>{ x.comments=[...(x.comments||[]),{id:uid(),at:Date.now(),by:me,text:t}]; }); };
  const setStatus = s => mut(x=>{ x.status=s; }, "Status changed to "+FB_STATUS[s].label);
  const saveRes = () => { if(res!==(e.resolution||"")) mut(x=>{ x.resolution=res; }, "Updated the resolution note"); };
  const del = () => { if(confirm("Delete this report? It disappears for everyone.")) { mut(x=>{ x.deleted=true; }, "Deleted"); onClose(); } };
  const cs = (e.comments||[]).filter(c=>!c.del);
  const lab = {fontSize:10.5,fontWeight:600,letterSpacing:"0.1em",textTransform:"uppercase",color:T.text3,margin:"16px 0 6px"};
  const body = {fontSize:13,color:T.text,lineHeight:1.55,whiteSpace:"pre-wrap",wordBreak:"break-word"};
  return (
    <div onClick={ev=>{ if(ev.target===ev.currentTarget) onClose(); }} style={{position:"fixed",inset:0,zIndex:900,background:"rgba(0,0,0,.45)",display:"flex",justifyContent:"flex-end"}}>
      <div style={{width:"min(540px,100%)",height:"100%",background:T.bg,borderLeft:`1px solid ${T.border2}`,overflowY:"auto",padding:"20px 20px 40px",animation:"slideInRight .18s ease-out"}}>
        <div style={{display:"flex",gap:10,alignItems:"flex-start"}}>

            <div style={{fontSize:18,fontWeight:700,color:T.text,letterSpacing:"-0.01em",lineHeight:1.3}}>{e.title}</div>
          </div>
          <button onClick={onClose} aria-label="Close" style={{background:"rgba(var(--ovc),.06)",border:`1px solid ${T.border}`,borderRadius:6,cursor:"pointer",color:T.text2,fontSize:16,lineHeight:1,padding:"3px 9px",fontFamily:"inherit"}}>×</button>
        </div>
        {!me && <div style={{margin:"12px 0 0"}}><FSel value="" onChange={setMe}><option value="">Who are you? Choose to vote or comment</option>{TEAM.map(n=><option key={n} value={n}>{n}</option>)}</FSel></div>}
        <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:1,background:T.border,border:`1px solid ${T.border}`,borderRadius:10,overflow:"hidden",margin:"14px 0"}}>
          {[["Area",e.area],[e.type==="bug"?"Severity":"Value",fbImpactLabel(e)],["Reported by",e.by||"Unknown"]].map(([l,v])=><div key={l} style={{background:T.surface,padding:"9px 11px"}}><div style={{fontSize:13,fontWeight:700,color:T.text}}>{v}</div><div style={{fontSize:10,letterSpacing:"0.1em",textTransform:"uppercase",color:T.text3,marginTop:2}}>{l}</div></div>)}

  const csv = () => dsDownload("onedash-feedback-"+dsToday()+".csv", csvText(["#","Type","Title","Status","Severity or value","Area","Votes","Reported by","Created","Updated","Details","Steps","Expected","Link","Resolution","Where","Client"], exportList.map(e=>[nums[e.id],FB_TYPES[e.type].label,e.title,FB_STATUS[e.status].label,fbImpactLabel(e),e.area,fbVotes(e),e.by,new Date(e.createdAt).toISOString().slice(0,10),new Date(e.updatedAt).toISOString().slice(0,10),e.desc,e.steps,e.expected,e.link,e.resolution,e.ctx&&e.ctx.where||"",e.ctx&&e.ctx.client||""])));

        <span style={{fontSize:20,fontWeight:700,color:T.text,marginRight:6}}>Bugs and ideas</span>
        {chip(type==="all","All",()=>setType("all"))}{Object.keys(FB_TYPES).map(k=>chip(type===k,FB_TYPES[k].plural,()=>setType(k)))}
        <span style={{marginLeft:"auto",display:"flex",gap:6,alignItems:"center",flexWrap:"wrap"}}>

          <Btn variant="primary" onClick={()=>onReport()}>+ Report</Btn>
        </span>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(150px,1fr))",gap:10}}>
        {tiles.map(([l,n,tone,fn])=><button key={l} onClick={fn} className="sm-row" style={{textAlign:"left",background:T.surface,border:`1px solid ${T.border}`,borderRadius:14,padding:"14px 16px",cursor:"pointer",fontFamily:"inherit"}}>

      </div>

        <select aria-label="Status" value={status} onChange={e=>setStatus(e.target.value)} style={sel}><option value="open">Open</option><option value="all">All statuses</option>{Object.keys(FB_STATUS).map(s=><option key={s} value={s}>{FB_STATUS[s].label}</option>)}</select>

      <div style={{display:"grid",gap:8}}>
        {list.map(e=>{ const done=!FB_OPEN.includes(e.status); const nc=(e.comments||[]).filter(c=>!c.del).length; return (

            <div style={{flex:1,minWidth:0}}>
              <div style={{display:"flex",gap:6,alignItems:"center",flexWrap:"wrap",marginBottom:4}}><FbPill c={FB_TYPES[e.type].c} solid>{FB_TYPES[e.type].label}</FbPill><span style={{fontSize:11,color:T.text4}}>#{nums[e.id]}</span><span style={{fontSize:11,color:T.text3}}>{e.area}</span><span style={{fontSize:11,color:e.impact>=3?"var(--bad)":T.text4}}>{fbImpactLabel(e)}</span></div>
              <div style={{fontSize:14,fontWeight:700,color:T.text}}>{e.title}</div>
              {e.desc && <div style={{fontSize:12,color:T.text3,marginTop:2,overflow:"hidden",display:"-webkit-box",WebkitLineClamp:2,WebkitBoxOrient:"vertical"}}>{e.desc}</div>}
              {e.resolution && done && <div style={{fontSize:12,color:"var(--ok)",marginTop:4}}>{e.resolution}</div>}
              <div style={{fontSize:11,color:T.text4,marginTop:6}}>{e.by} · {fbAgo(e.createdAt)}{nc>0 && " · "+nc+" comment"+(nc>1?"s":"")}</div>
            </div>
            <div style={{flexShrink:0,display:"flex",alignItems:"flex-start"}}><FbPill c={FB_STATUS[e.status].c}>{FB_STATUS[e.status].label}</FbPill></div>
          </div>); })}
      </div>
      {cur && <FeedbackDrawer key={cur.id} e={cur} num={nums[cur.id]} me={me} setMe={setMe} upd={upd} onClose={()=>setOpenId(null)} onEdit={()=>onEditReport(cur)}/>}
    </div>
  );
}
