      d.social.clients = (d.social.clients||[]).map(normalizeSocialClient);
      d.social.sops = (d.social.sops||DEFAULT_SOPS).map(s=>normalizeSop({...s}));
    }
    // old sidebar scratchpad notes become Additional Items
    Object.keys(d.notes||{}).forEach(k=>{
      const m = k.match(/^(.+)_discuss_(creative|tech|ppc)$/);
      if (!m) return;
      String(d.notes[k]||"").split(/\n+/).map(s=>s.trim()).filter(Boolean).forEach(line=>d.extras.push({id:uid(),cId:m[1],tab:m[2],text:line,done:false,at:Date.now()}));
      delete d.notes[k];
    });
    return d;
  };
  try {
    const r = localStorage.getItem(KEY);
    if (r) {
      const d = JSON.parse(r);
      d.clients = d.clients.map(c => ({resources:{...EMPTY_RESOURCES},health:"unknown",tech:{...EMPTY_CLIENT_TECH},...c,tech:{...EMPTY_CLIENT_TECH,...(c.tech||{})},resources:{...EMPTY_RESOURCES,...(c.resources||{})}}));
      if (d.meetingMode === undefined) d.meetingMode = false;
      if (d.backupSeq === undefined) d.backupSeq = 0;
      if (!d.deleted) d.deleted = [];
      if (!d.notes) d.notes = {};
      if (!d.tasks) d.tasks = SEED_TASKS;
      if (!d.ppcItems) d.ppcItems = [];
      if (!d.techStack) d.techStack = SEED_TECH_STACK;
      if (!d.techOpts) d.techOpts = {};
      d.clients = d.clients.map(c=>({...c,tech:{...EMPTY_CLIENT_TECH,...(c.tech||{}),sites:(c.tech?.sites||[])}}));
      return migrate(d);
    }
  } catch {}
  return migrate({clients:SEED_CLIENTS,items:SEED_ITEMS,tasks:SEED_TASKS,ppcItems:[],techStack:SEED_TECH_STACK,archive:[],deleted:[],notes:{},dark:true,meetingMode:false,backupSeq:0,driveLink:"",techOpts:{}});
}

};
const isOverdue = s => !!s && s < today();
const hueOf = s => { let h=0; for (const ch of (s||"")) h=(h*31+ch.charCodeAt(0))%360; return `hsl(${h} 42% 40%)`; };

function Avatar({name, size=20, color}) {
  const label = (name||"?").trim().split(/\s+/).slice(0,2).map(w=>w[0]).join("").toUpperCase();
  return <span title={name} style={{width:size,height:size,borderRadius:"50%",background:color||hueOf(name),color:"#fff",fontSize:Math.max(8,Math.round(size*0.42)),fontWeight:700,display:"inline-flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>{label}</span>;
}

  const m = {WebkitMaskImage:"url("+LOGO_URI+")",maskImage:"url("+LOGO_URI+")",WebkitMaskRepeat:"no-repeat",maskRepeat:"no-repeat",WebkitMaskSize:"100% 100%",maskSize:"100% 100%"};

function ConfirmBtn({label, confirmLabel="Sure?", onConfirm, style, title}) {
  const [armed, setArmed] = useState(false);
  const t = useRef();
  useEffect(()=>()=>clearTimeout(t.current),[]);
  const armedStyle = armed ? {background:"rgba(255,59,48,.22)",color:"#ff3b30",border:"1px solid rgba(255,59,48,.5)"} : {};
  return (
    <button title={title} onClick={e=>{e.stopPropagation(); if(armed){clearTimeout(t.current);setArmed(false);onConfirm();} else {setArmed(true);t.current=setTimeout(()=>setArmed(false),3000);}}}
      style={{...style,...armedStyle}}>{armed?confirmLabel:label}</button>
  );
}

function AutoTA({value, onChange, placeholder, maxLines=3, style, onKeyDown, className}) {
  const ref = useRef();
  useEffect(()=>{
    const el = ref.current; if (!el) return;
    el.style.height = "auto";
    const cs = getComputedStyle(el);
    let lh = parseFloat(cs.lineHeight); if (isNaN(lh)) lh = 19;
    const pv = (parseFloat(cs.paddingTop)||0)+(parseFloat(cs.paddingBottom)||0);
    const maxH = lh*maxLines+pv;
    el.style.height = Math.min(el.scrollHeight,maxH)+"px";
    el.style.overflowY = el.scrollHeight>maxH ? "auto" : "hidden";
  },[value]);
  return <textarea ref={ref} rows={1} className={className} value={value} onChange={e=>onChange(e.target.value)} onKeyDown={onKeyDown} placeholder={placeholder}
    style={{width:"100%",background:"transparent",border:"none",outline:"none",resize:"none",color:T.text,fontFamily:"inherit",fontSize:13,lineHeight:1.5,padding:"6px 8px",borderRadius:6,...style}}/>;
}

// Status dropdown + pill (generic, takes the status list for the service)
function StatusDropdown({cfg, current, onChange, onClose}) {
  const ref = useRef();
  useEffect(()=>{
    const h = e => { if(ref.current && !ref.current.contains(e.target)) onClose(); };
    document.addEventListener("mousedown", h);
    return ()=>document.removeEventListener("mousedown",h);
  },[]);
  return (
    <div ref={ref} onClick={e=>e.stopPropagation()} style={{position:"absolute",top:"100%",left:0,zIndex:200,background:T.surface2,border:`1px solid ${T.border}`,borderRadius:10,padding:4,minWidth:170,boxShadow:"0 8px 32px rgba(0,0,0,.6)",marginTop:4}}>
      {cfg.map(s=>(
        <div key={s.key} onClick={()=>{onChange(s.key);onClose();}}
          style={{display:"flex",alignItems:"center",gap:8,padding:"6px 10px",borderRadius:7,cursor:"pointer",background:s.key===current?"rgba(var(--ovc),.06)":"transparent"}}
          onMouseEnter={e=>e.currentTarget.style.background="rgba(var(--ovc),.08)"}
          onMouseLeave={e=>e.currentTarget.style.background=s.key===current?"rgba(var(--ovc),.06)":"transparent"}>
          <span style={{width:8,height:8,borderRadius:"50%",background:s.bg,flexShrink:0}}/>
          <span style={{fontSize:12,color:T.text,fontWeight:s.key===current?600:400}}>{s.label}</span>
        </div>
      ))}
    </div>
  );
}

function StatusPill({cfg, status, onChange, compact}) {
  const [open, setOpen] = useState(false);
  const s = cfg.find(x=>x.key===status) || cfg[1];
  return (
    <div style={{position:"relative",display:"inline-block"}}>
      <span onClick={e=>{e.stopPropagation();setOpen(o=>!o);}}
        style={{display:"inline-flex",alignItems:"center",gap:5,background:s.bg,color:s.text,borderRadius:20,padding:compact?"2px 9px 2px 7px":"4px 12px 4px 10px",fontSize:compact?11:11.5,fontWeight:700,cursor:"pointer",whiteSpace:"nowrap",letterSpacing:compact?0:"0.04em",textTransform:compact?"none":"uppercase"}}>
        <span style={{width:5,height:5,borderRadius:"50%",background:s.text,opacity:0.7,flexShrink:0}}/>
        {s.label}
      </span>
      {open && <StatusDropdown cfg={cfg} current={status} onChange={onChange} onClose={()=>setOpen(false)}/>}
    </div>
  );
}

function HBtn({children, onClick, active, href, style}) {
  const st = {display:"inline-flex",alignItems:"center",gap:6,background:active?"var(--inv)":"transparent",border:`1px solid ${active?"var(--inv)":T.border}`,borderRadius:8,padding:"5px 12px",cursor:"pointer",fontSize:12,fontWeight:600,color:active?"var(--inv-fg)":T.text2,fontFamily:"inherit",lineHeight:1.2,textDecoration:"none",transition:"all .15s",whiteSpace:"nowrap",...style};
  if (href) return <a href={href} target="_blank" rel="noreferrer" style={st}>{children}</a>;
  return <button onClick={onClick} style={st}>{children}</button>;
}

// ── Hover card (shows comments, latest first) ──────────────────────────────
function HoverRow({icon, children}) {
  return <div style={{display:"flex",alignItems:"center",gap:8,fontSize:12,color:T.text2,marginTop:5}}><Icon n={icon} size={13} style={{color:T.text3}}/>{children}</div>;
}

function HoverCard({task, kind, client, rect, onEnter, onLeave, onFlag, onComplete, onEdit}) {
  const st = statusOf(kind, task.status);
  const pr = prio(task)!=="normal" ? PR[prio(task)] : null;
  const comments = [...(task.comments||[])].sort((a,b)=>b.at-a.at);
  const W = 340;
  const vw = window.innerWidth, vh = window.innerHeight;
  const left = Math.min(Math.max(8, rect.left), vw-W-8);
  const spaceBelow = vh - rect.bottom;
  const above = spaceBelow < 330 && rect.top > spaceBelow;
  const pos = above ? {bottom: vh-rect.top+6} : {top: rect.bottom+6};
  const stColor = st.bg==="#1c1c1e" ? st.text : st.bg;
  const subs = (task._subCount||0);
  return (
    <div onMouseEnter={onEnter} onMouseLeave={onLeave} style={{position:"fixed",left,...pos,width:W,zIndex:150,background:T.surface2,border:`1px solid ${T.border2}`,borderRadius:12,padding:"12px 14px",boxShadow:"0 14px 40px rgba(0,0,0,.65)",pointerEvents:"auto",maxHeight:"70vh",overflowY:"auto",animation:"fadeIn .12s ease",maxHeight:"60vh",overflow:"hidden"}}>
      <div style={{display:"flex",alignItems:"flex-start",gap:8}}>
        <div style={{fontWeight:700,fontSize:14,color:T.text,lineHeight:1.3,flex:1,minWidth:0}}>{task.title}</div>
        <div style={{display:"flex",gap:4,flexShrink:0}}>
          {[["Flag","flag",onFlag],["Open S.Comms task","link",task.link?()=>openUrl(task.link):null],["Mark complete","check",onComplete],["Edit","edit",onEdit]].map(([t,ic,fn])=>fn && <button key={t} title={t} onClick={fn} style={{background:"rgba(var(--ovc),.06)",border:`1px solid ${T.border}`,cursor:"pointer",color:T.text2,padding:"4px 6px",lineHeight:1,borderRadius:6,display:"inline-flex",alignItems:"center"}}><Icon n={ic} size={12}/></button>)}
        </div>
      </div>
      <div style={{fontSize:11,color:T.text3,margin:"3px 0 8px"}}>In {client?client.name:"No client"} · {KINDS[kind].label}</div>
      <div style={{display:"flex",alignItems:"center",gap:6,fontSize:11,fontWeight:700,letterSpacing:"0.06em",textTransform:"uppercase",color:stColor}}>
        <span style={{width:8,height:8,borderRadius:"50%",border:`2px solid ${stColor}`}}/>{st.label}
      </div>
      {asg(task).length>0 && <HoverRow icon="user"><AvatarStack names={asg(task)} size={16}/>{asg(task).join(", ")}</HoverRow>}
      {wch(task).length>0 && <HoverRow icon="users">Watching: {wch(task).join(", ")}</HoverRow>}
      {(task.start||task.deadline) && <HoverRow icon="calendar"><span style={{color:isOverdue(task.deadline)?"#ff6b6b":T.text2}}>{task.start?fmtDate(task.start)+" → ":""}{task.deadline?fmtDate(task.deadline):"No due date"}</span></HoverRow>}
      {pr && <HoverRow icon="flag"><span style={{color:pr.color,fontWeight:600}}>{pr.label}</span></HoverRow>}
      {subs>0 && <HoverRow icon="subtask">{subs} subtask{subs>1?"s":""}</HoverRow>}
      {(task.tags||[]).length>0 && <div style={{display:"flex",gap:5,flexWrap:"wrap",marginTop:7}}>{task.tags.map(t=><TagChip key={t} tag={t} small/>)}</div>}
      {task.notes && <div style={{fontSize:12,color:T.text3,marginTop:8,lineHeight:1.4,display:"-webkit-box",WebkitLineClamp:2,WebkitBoxOrient:"vertical",overflow:"hidden"}}>{task.notes}</div>}
      <div style={{marginTop:10,paddingTop:8,borderTop:`1px solid ${T.border}`}}>
        <div style={{display:"flex",alignItems:"center",gap:6,fontSize:10,fontWeight:700,letterSpacing:"0.08em",textTransform:"uppercase",color:T.text3,marginBottom:7}}>
          <Icon n="comment" size={11}/>Comments{comments.length>0?` (${comments.length})`:""}
          <span style={{marginLeft:"auto",textTransform:"none",letterSpacing:0,fontWeight:500,color:T.text4}}>latest first</span>
        </div>
        {comments.length===0 && <div style={{fontSize:12,color:T.text4}}>No comments yet</div>}
        {comments.slice(0,3).map(c=>(
          <div key={c.id} style={{display:"flex",gap:8,marginBottom:7}}>
            <Avatar name={c.author} size={20}/>
            <div style={{minWidth:0,flex:1}}>
              <div style={{fontSize:11,color:T.text}}><b style={{fontWeight:700}}>{c.author}</b> <span style={{color:T.text3}}>{timeAgo(c.at)}</span></div>
              <div style={{fontSize:12,color:T.text2,lineHeight:1.4,display:"-webkit-box",WebkitLineClamp:2,WebkitBoxOrient:"vertical",overflow:"hidden",wordBreak:"break-word"}}>{c.text}</div>
            </div>
          </div>
        ))}
        {comments.length>3 && <div style={{fontSize:11,color:T.text3}}>+{comments.length-3} older</div>}
      </div>
    </div>
  );
}

// ── Task row ───────────────────────────────────────────────────────────────
function TaskRow({task, kind, all, clients, depth=0, onOpen, onStatus, onToggleFollowUp, onToggleUrgent, highlightedId, hoveredId, setHoveredId, meetingMode}) {
  const [flagOpen, setFlagOpen] = useState(false);
  const [flagAnchor, setFlagAnchor] = useState(null);
  const [cardRect, setCardRect] = useState(null);
  const rowRef = useRef();
  const timer = useRef();
  useEffect(()=>()=>clearTimeout(timer.current),[]);
  const children = all.filter(t=>t.parentId===task.id);
  const isHL = highlightedId===task.id;
  const hov = hoveredId===task.id;
  const dimmed = meetingMode && hoveredId && !hov;
  const client = clients.find(c=>c.id===task.cId);
  const st = statusOf(kind, task.status);
  const cmts = (task.comments||[]).length;
  const enter = () => { setHoveredId(task.id); clearTimeout(timer.current); timer.current = setTimeout(()=>{ if(rowRef.current) setCardRect(rowRef.current.getBoundingClientRect()); },260); };
  const leave = () => { clearTimeout(timer.current); timer.current = setTimeout(()=>{ setHoveredId(null); setCardRect(null); },160); };
  const hardLeave = () => { clearTimeout(timer.current); setHoveredId(null); setCardRect(null); };
  const keep = () => { clearTimeout(timer.current); setHoveredId(task.id); };
  const isU = flagU(task);
  const isF = flagF(kind,task);
  const openFlag = e => {e.stopPropagation();setFlagAnchor(e.currentTarget.getBoundingClientRect());setFlagOpen(true);};
  const mini = {background:"rgba(var(--ovc),.06)",border:`1px solid ${T.border}`,cursor:"pointer",color:T.text2,padding:"3px 6px",lineHeight:1,borderRadius:6,fontFamily:"inherit",display:"inline-flex",alignItems:"center"};
  return (
    <div>
      <div ref={rowRef} onMouseEnter={enter} onMouseLeave={leave} onClick={()=>{hardLeave();onOpen(task);}}
        style={{background:isHL?"rgba(123,104,238,.12)":hov?T.surface2:(isU?"rgba(255,59,48,.05)":isF?"rgba(255,159,10,.05)":T.surface),border:`1px solid ${isHL?"rgba(123,104,238,.45)":isU?"rgba(255,59,48,.6)":isF?"rgba(255,159,10,.6)":hov?T.border2:T.border}`,borderRadius:10,padding:"9px 12px",marginLeft:depth*18,marginBottom:6,transition:"background .15s,border-color .15s,opacity .2s",position:"relative",cursor:"pointer",opacity:dimmed?0.25:1}}>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          {isU ? <Icon n="flag" size={12} style={{color:"#ff3b30"}}/> : isF ? <Icon n="flag" size={12} style={{color:"#ff9f0a"}}/> : <span style={{width:3,height:14,borderRadius:2,background:st.bg==="#1c1c1e"?st.text:st.bg,flexShrink:0}}/>}
          <span title={(isU||isF)?"On the Meeting Flags list, so it may already have been discussed":undefined} style={{color:T.text,fontSize:13,fontWeight:500,flex:1,minWidth:0,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{task.title}</span>
          {task._nk && <span title={"From the "+KINDS[task._nk].label+" dashboard (tagged for this one)"} style={{fontSize:9.5,fontWeight:700,letterSpacing:"0.05em",color:T.text3,border:`1px solid ${T.border2}`,borderRadius:6,padding:"0 5px"}}>{KINDS[task._nk].short}</span>}
          {children.length>0 && <span title="Subtasks" style={{display:"inline-flex",alignItems:"center",gap:3,fontSize:11,color:T.text3}}><Icon n="subtask" size={12}/>{children.length}</span>}
          {LINK_BLOCKED[task.id]>0 && <span title="Waiting on another task" style={{display:"inline-flex",alignItems:"center",gap:3,fontSize:11,fontWeight:700,color:"var(--warn)"}}>⛓ {LINK_BLOCKED[task.id]}</span>}
          {cmts>0 && <span title="Comments" style={{display:"inline-flex",alignItems:"center",gap:3,fontSize:11,color:T.text3}}><Icon n="comment" size={12}/>{cmts}</span>}
          <div style={{display:"flex",alignItems:"center",gap:5,flexShrink:0}}>
            {hov && <button title="Flag" onClick={openFlag} style={mini}><Icon n="flag" size={12}/></button>}
            {hov && task.link && <button title="Open S.Comms task" onClick={e=>{e.stopPropagation();openUrl(task.link);}} style={mini}><Icon n="link" size={12}/></button>}
            {hov && <button title="Mark complete" onClick={e=>{e.stopPropagation();onStatus(task.id,"completed");}} style={mini}><Icon n="check" size={12}/></button>}
            {hov && <button title="Edit" onClick={e=>{e.stopPropagation();onOpen(task);}} style={mini}><Icon n="edit" size={12}/></button>}
            <div onClick={e=>e.stopPropagation()}><StatusPill cfg={KINDS[kind].cfg} status={task.status} onChange={v=>onStatus(task.id,v)} compact/></div>
          </div>
        </div>
        {(asg(task).length>0 || task.deadline || task.notes) && (
          <div style={{display:"flex",alignItems:"center",gap:10,marginTop:4,paddingLeft:11}}>
            {asg(task).length>0 && <span style={{fontSize:11,color:T.text3,display:"inline-flex",alignItems:"center",gap:5}}><AvatarStack names={asg(task)} size={14}/>{asg(task).join(", ")}</span>}
            {task.deadline && <span style={{fontSize:11,color:isOverdue(task.deadline)?"#ff6b6b":T.text3}}>{fmtDate(task.deadline)}</span>}
            {task.notes && <span style={{fontSize:11,color:T.text4,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",maxWidth:240}}>{task.notes}</span>}
          </div>
        )}
      </div>
      {cardRect && !flagOpen && <HoverCard task={{...task,_subCount:children.length}} kind={kind} client={client} rect={cardRect} onEnter={keep} onLeave={leave} onFlag={openFlag} onComplete={()=>{hardLeave();onStatus(task.id,"completed");}} onEdit={()=>{hardLeave();onOpen(task);}}/>}
      {flagOpen && <FlagPanel task={{...task,urgent:isU?1:0,followUp:isF?1:0}} onToggleFollowUp={()=>onToggleFollowUp(task.id)} onToggleUrgent={()=>onToggleUrgent(task.id)} onClose={()=>setFlagOpen(false)} anchorRect={flagAnchor}/>}
      {children.map(child=>(
        <TaskRow key={child.id} task={child} kind={kind} all={all} clients={clients} depth={depth+1} onOpen={onOpen} onStatus={onStatus} onToggleFollowUp={onToggleFollowUp} onToggleUrgent={onToggleUrgent} highlightedId={highlightedId} hoveredId={hoveredId} setHoveredId={setHoveredId} meetingMode={meetingMode}/>
      ))}
    </div>
  );
}

function SectionHead({title, count, right}) {

function ClientPicker({clients, value, onPick, onAdd, trigger}) {
  const [open, setOpen] = useState(false);
  const [q, setQ] = useState("");
  const ql = q.trim().toLowerCase();
  const list = clients.filter(c=>!ql || c.name.toLowerCase().includes(ql));
  const exact = clients.some(c=>c.name.trim().toLowerCase()===ql);
  const pick = id => { onPick(id); setOpen(false); setQ(""); };
  const add = () => { if(!ql||!onAdd) return; const id = onAdd(q.trim()); if(id) pick(id); };
  return (
    <div style={{position:"relative"}}>
      {trigger(()=>setOpen(o=>!o))}
      <Pop open={open} onClose={()=>{ setOpen(false); setQ(""); }} width={270}>
        <input autoFocus value={q} onChange={e=>setQ(e.target.value)} onKeyDown={e=>{ if(e.key==="Enter"){ if(list.length===1) pick(list[0].id); else if(!exact && ql) add(); } }} placeholder="Search or type a new client" style={{background:T.surface,border:`1px solid ${T.border}`,borderRadius:10,outline:"none",color:T.text,fontSize:13,fontFamily:"inherit",padding:"7px 10px",width:"100%",marginBottom:6}}/>
        <div style={{maxHeight:230,overflowY:"auto"}}>
          {list.map(c=><div key={c.id} onClick={()=>pick(c.id)} style={{display:"flex",alignItems:"center",gap:8,padding:"7px 10px",borderRadius:8,cursor:"pointer",fontSize:13,color:T.text,background:c.id===value?"rgba(var(--ovc),.08)":"transparent"}} onMouseEnter={e=>e.currentTarget.style.background="rgba(var(--ovc),.06)"} onMouseLeave={e=>e.currentTarget.style.background=c.id===value?"rgba(var(--ovc),.08)":"transparent"}><span style={{width:8,height:8,borderRadius:"50%",background:c.color||T.accent,flexShrink:0}}/>{c.name}{c.id===value && <span style={{marginLeft:"auto",fontSize:11,color:T.text3}}>current</span>}</div>)}
          {list.length===0 && !ql && <div style={{padding:"7px 10px",fontSize:12,color:T.text3}}>No clients yet.</div>}
        </div>
        {onAdd && ql && !exact && <div onClick={add} style={{display:"flex",alignItems:"center",gap:8,padding:"8px 10px",marginTop:4,borderTop:`1px solid ${T.border}`,cursor:"pointer",fontSize:13,fontWeight:700,color:T.text}}>+ Add client "{q.trim()}"</div>}
      </Pop>
    </div>
  );
}

let LINK_BLOCKED = {};
const LK_LABEL = {out_waiting_on:"Waiting on", in_waiting_on:"Blocking", out_related:"Related", in_related:"Related"};
const LK_COLOR = {"Waiting on":"var(--warn)","Blocking":"var(--bad)","Related":"var(--info)"};
const isDoneTask = (kind, t) => ["done","completed","deliver"].includes(t.status) || (KINDS[kind].hidden||[]).includes(t.status);
function TaskLinks({kind, task, allTasks, onLink, onUnlink, onOpen}) {
  const [adding, setAdding] = useState(false);
  const [rel, setRel] = useState("waiting_on");
  const [q, setQ] = useState("");
  const find = (k,id) => allTasks.find(x=>x.kind===k && x.task.id===id);
  const rows = [];
  (task.links||[]).forEach(l=>{ const ref=find(l.k,l.id); if(ref) rows.push({label:LK_LABEL["out_"+l.rel], ref, rel:l.rel, dir:"out"}); });
  allTasks.forEach(x=>{ (x.task.links||[]).forEach(l=>{ if(l.id===task.id && l.k===kind) rows.push({label:LK_LABEL["in_"+l.rel], ref:x, rel:l.rel, dir:"in"}); }); });
  const order = ["Waiting on","Blocking","Related"];
  rows.sort((a,b)=>order.indexOf(a.label)-order.indexOf(b.label));
  const taken = new Set(rows.map(r=>r.ref.kind+r.ref.task.id));
  const ql = q.trim().toLowerCase();
  const results = allTasks.filter(x=>!(x.kind===kind&&x.task.id===task.id) && !taken.has(x.kind+x.task.id) && (!ql || (x.task.title+" "+x.client+" "+x.label).toLowerCase().includes(ql)))
    .sort((a,b)=>(isDoneTask(a.kind,a.task)-isDoneTask(b.kind,b.task))||a.task.title.localeCompare(b.task.title)).slice(0,8);
  const unresolved = rows.filter(r=>r.label==="Waiting on" && !isDoneTask(r.ref.kind,r.ref.task)).length;
  return (
    <div style={{padding:"16px 24px 18px",borderTop:`1px solid ${T.border}`}}>
      <SectionHead title="Dependencies and links" count={rows.length||undefined} right={unresolved>0 && <span style={{fontSize:11,fontWeight:700,color:"var(--warn)"}}>Waiting on {unresolved} open</span>}/>
      <div style={{border:`1px solid ${T.border}`,borderRadius:12,overflow:"hidden"}}>
        {rows.map((r,i)=>{ const x=r.ref, st=statusOf(x.kind,x.task.status), done=isDoneTask(x.kind,x.task); return (
          <div key={i} onClick={()=>onOpen(x.kind,x.task.id)} style={{display:"flex",alignItems:"center",gap:10,padding:"9px 14px",borderBottom:`1px solid ${T.border}`,cursor:"pointer"}} onMouseEnter={e=>e.currentTarget.style.background="rgba(var(--ovc),.04)"} onMouseLeave={e=>e.currentTarget.style.background="transparent"}>
            <span style={{fontSize:10,fontWeight:700,letterSpacing:"0.04em",textTransform:"uppercase",color:LK_COLOR[r.label],minWidth:72}}>{r.label}</span>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontSize:13,color:T.text,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",textDecoration:done?"line-through":"none",opacity:done?.6:1}}>{x.task.title}</div>
              <div style={{fontSize:11,color:T.text4}}>{x.client} · {x.label}</div>
            </div>
            <span style={{fontSize:11,color:T.text3,display:"inline-flex",alignItems:"center",gap:5}}><span style={{width:7,height:7,borderRadius:"50%",background:st.bg}}/>{st.label}</span>
            <button title="Remove link" onClick={e=>{ e.stopPropagation(); onUnlink(r.dir==="out"?{kind,id:task.id}:{kind:x.kind,id:x.task.id}, r.dir==="out"?{k:x.kind,id:x.task.id,rel:r.rel}:{k:kind,id:task.id,rel:r.rel}); }} style={{background:"none",border:"none",color:T.text4,cursor:"pointer",fontSize:15,lineHeight:1,padding:"0 2px"}}>×</button>
          </div>); })}
        {!adding ? (
          <div onClick={()=>setAdding(true)} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 14px",color:T.text3,cursor:"pointer",fontSize:13}}><Icon n="plus" size={14}/>Add dependency or link</div>
        ) : (
          <div style={{padding:"10px 14px"}}>
            <div style={{display:"flex",gap:8,marginBottom:8}}>
              <select value={rel} onChange={e=>setRel(e.target.value)} style={{background:T.surface2,color:T.text,border:`1px solid ${T.border}`,borderRadius:999,padding:"5px 10px",fontSize:12,fontFamily:"inherit"}}>
                <option value="waiting_on">This is waiting on</option><option value="blocks">This is blocking</option><option value="related">Related to</option>
              </select>
              <input autoFocus value={q} onChange={e=>setQ(e.target.value)} placeholder="Search any task, client or service" style={{flex:1,background:T.surface2,color:T.text,border:`1px solid ${T.border}`,borderRadius:999,padding:"5px 12px",fontSize:12.5,fontFamily:"inherit",outline:"none"}}/>
              <button onClick={()=>{ setAdding(false); setQ(""); }} style={{background:"none",border:"none",color:T.text3,cursor:"pointer",fontSize:12,fontFamily:"inherit"}}>Done</button>
            </div>
            {results.length===0 && <div style={{fontSize:12,color:T.text4}}>No matching tasks.</div>}
            {results.map(x=>{ const done=isDoneTask(x.kind,x.task); return (
              <div key={x.kind+x.task.id} onClick={()=>onLink(rel,x)} style={{display:"flex",alignItems:"center",gap:8,padding:"6px 8px",borderRadius:8,cursor:"pointer",opacity:done?.6:1}} onMouseEnter={e=>e.currentTarget.style.background="rgba(var(--ovc),.05)"} onMouseLeave={e=>e.currentTarget.style.background="transparent"}>
                <span style={{flex:1,minWidth:0,fontSize:12.5,color:T.text,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{x.task.title}</span>
                <span style={{fontSize:11,color:T.text4,whiteSpace:"nowrap"}}>{x.client} · {x.label}</span>
              </div>); })}
          </div>
        )}
      </div>
    </div>
  );
}

function TaskCard({kind, task, preset, isNew, clients, people, activeId, getParents, onAddClient, allTasks, onLink, onUnlink, onOpenLinked, onAddPerson, onToggleFlag, priorityLists, onTogglePriority, onClose, onPatch, onStatus, onCreate, onDelete, onArchive, subtasks, onOpenTask, onAddSub, onAddComment, onDeleteComment}) {
  const cfg = KINDS[kind].cfg;
  const [draft, setDraft] = useState(()=>({title:"",status:"todo",assignee:"",assignees:[],watchers:[],start:"",deadline:"",priority:"normal",tags:[],link:"",notes:"",cId:activeId,type:KINDS[kind].defType,section:"sites",parentId:null,...(preset||{})}));
  const t = isNew ? draft : task;
  const set = (k,v) => isNew ? setDraft(d=>({...d,[k]:v})) : onPatch(task.id,{[k]:v});
  const [tagPop, setTagPop] = useState(false);
  const [subIn, setSubIn] = useState("");
  const [cmt, setCmt] = useState("");
  const [menu, setMenu] = useState(false);
  const [fieldsOpen, setFieldsOpen] = useState(true);
  const [linkPop, setLinkPop] = useState(false);
  const [prPop, setPrPop] = useState(false);
  const [linkVal, setLinkVal] = useState("");
  const setPeople = (key,list) => { const patch = key==="assignees" ? {assignees:list, assignee:list.join(", ")} : {watchers:list}; if(isNew) setDraft(d=>({...d,...patch})); else onPatch(task.id,patch); };
  const titleRef = useRef();
  useEffect(()=>{ if(isNew && titleRef.current) titleRef.current.focus(); },[]);
  useEffect(()=>{ const h = e => { if(e.key==="Escape") onClose(); }; window.addEventListener("keydown",h); return ()=>window.removeEventListener("keydown",h); },[]);
  const client = clients.find(c=>c.id===t.cId);
  const comments = [...(t.comments||[])].sort((a,b)=>b.at-a.at);
  const tags = t.tags||[];
  const pCfg = isNew ? cfg.filter(s=>!s.action && s.key!=="completed") : cfg;
  const sendComment = () => { const v = cmt.trim(); if(!v||isNew) return; onAddComment(task.id,v); setCmt(""); };
  const secList = kind==="ppc" ? PPC_SECTIONS : kind==="tech" ? TASK_SECTIONS : null;
  const secField = kind==="tech" ? "section" : "type";
  const selStyle = {background:"transparent",border:"none",outline:"none",color:T.text,fontSize:13,fontFamily:"inherit",cursor:"pointer",padding:"5px 6px",borderRadius:6};
  const inStyle = {background:"transparent",border:"none",outline:"none",color:T.text,fontSize:13,fontFamily:"inherit",padding:"5px 6px",borderRadius:6};
  return (
    <div onMouseDown={e=>{ if(e.target===e.currentTarget) onClose(); }} style={{position:"fixed",inset:0,background:"rgba(0,0,0,.72)",zIndex:1000,display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
      <div style={{background:T.surface,border:`1px solid ${T.border2}`,borderRadius:16,width:"100%",maxWidth:700,maxHeight:"88vh",display:"flex",flexDirection:"column",animation:"fadeIn .18s ease",boxShadow:"0 28px 80px rgba(0,0,0,.7)",overflow:"hidden"}}>
        {/* breadcrumb bar */}
        <div style={{display:"flex",alignItems:"center",gap:8,padding:"12px 18px",borderBottom:`1px solid ${T.border}`,flexShrink:0,fontSize:12,color:T.text2,flexWrap:"wrap"}}>
          <ClientPicker clients={clients} value={t.cId} onAdd={onAddClient} onPick={id=>{ set("cId",id); if(isNew) set("parentId",null); }} trigger={tg=><button type="button" onClick={tg} title="Change client" style={{background:"transparent",border:`1px solid ${T.border}`,borderRadius:999,padding:"3px 10px 3px 6px",cursor:"pointer",fontFamily:"inherit",fontSize:12,color:T.text,display:"inline-flex",alignItems:"center",gap:6}}>{client ? <span style={{display:"inline-flex",alignItems:"center",gap:8,fontWeight:600,color:T.text}}><span style={{width:18,height:18,borderRadius:5,background:client.color||T.accent,display:"inline-flex",alignItems:"center",justifyContent:"center",fontSize:8,fontWeight:800,color:"#fff"}}>{ini(client.name)}</span>{client.name}</span> : <span>Choose client</span>}<span style={{fontSize:9,opacity:.6}}>▼</span></button>}/>
          <div style={{marginLeft:"auto",display:"flex",alignItems:"center",gap:6,position:"relative",flexWrap:"wrap",justifyContent:"flex-end"}}>
            {!isNew && (()=>{ const on1=flagU(t), on2=flagF(kind,t); const fb=(on,col,label,fl,title)=>(
              <button type="button" title={title} onClick={()=>onToggleFlag(fl)} style={{display:"inline-flex",alignItems:"center",gap:5,background:on?col+"33":"transparent",border:`1px solid ${on?col:T.border2}`,color:on?col:T.text3,borderRadius:999,padding:"3px 10px",fontSize:11,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}><Icon n="flag" size={11}/>{label}</button>);
              return <span title="Meeting flags put this task on the Meeting Flags list in the sidebar, for discussion in meetings" style={{display:"inline-flex",alignItems:"center",gap:6,border:`1px solid ${T.border}`,borderRadius:999,padding:"2px 3px 2px 10px",background:"rgba(var(--ovc),.03)"}}><span style={{fontSize:9.5,fontWeight:700,letterSpacing:"0.08em",textTransform:"uppercase",color:T.text3,whiteSpace:"nowrap"}}>Meeting flags</span>{fb(on1,"#ff3b30","Urgent","urgent","Meeting flag: Urgent")}{fb(on2,"#ff9f0a",FLAG_F_LABEL,"followUp","Meeting flag: "+FLAG_F_LABEL)}</span>; })()}
            {!isNew && (
              <span style={{position:"relative",display:"inline-flex",alignItems:"center",gap:4}}>
                {t.link ? <>
                  <button type="button" title={safeUrl(t.link)} onClick={()=>openUrl(t.link)} style={{display:"inline-flex",alignItems:"center",gap:5,background:"rgba(79,127,255,.16)",border:"1px solid rgba(79,127,255,.5)",color:"#7aa2ff",borderRadius:999,padding:"3px 10px",fontSize:11,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}><Icon n="link" size={11}/>S.Comms task</button>
                  <button type="button" title="Edit link" onClick={()=>{setLinkVal(t.link||"");setLinkPop(o=>!o);}} style={{background:"transparent",border:"none",cursor:"pointer",color:T.text3,padding:4,display:"flex"}}><Icon n="edit" size={12}/></button>
                </> : <button type="button" title="Add the S.Comms task link" onClick={()=>{setLinkVal("");setLinkPop(o=>!o);}} style={{display:"inline-flex",alignItems:"center",gap:5,background:"transparent",border:`1px dashed ${T.border2}`,color:T.text3,borderRadius:999,padding:"3px 10px",fontSize:11,fontWeight:600,cursor:"pointer",fontFamily:"inherit"}}><Icon n="link" size={11}/>S.Comms link</button>}
                <Pop open={linkPop} onClose={()=>setLinkPop(false)} width={290} align="right">
                  <div style={{padding:"4px"}}>
                    <div style={{fontSize:11,color:T.text3,fontWeight:700,textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:6}}>S.Comms task link</div>
                    <input autoFocus value={linkVal} onChange={e=>setLinkVal(e.target.value)} onKeyDown={e=>{ if(e.key==="Enter"){ set("link",safeUrl(linkVal)); setLinkPop(false); } }} placeholder="Paste the S.Comms task URL" style={{width:"100%",background:T.surface,border:`1px solid ${T.border}`,borderRadius:8,outline:"none",color:T.text,fontSize:12.5,fontFamily:"inherit",padding:"7px 10px"}}/>
                    <div style={{display:"flex",gap:6,marginTop:8}}>
                      <Btn size="sm" variant="primary" onClick={()=>{ set("link",safeUrl(linkVal)); setLinkPop(false); }}>Save</Btn>
                      {safeUrl(linkVal) && <Btn size="sm" onClick={()=>openUrl(linkVal)}>Open in new tab</Btn>}
                      {t.link && <Btn size="sm" onClick={()=>{ set("link",""); setLinkPop(false); }}>Remove</Btn>}
                    </div>
                  </div>
                </Pop>
              </span>
            )}
            {!isNew && onTogglePriority && (()=>{ const inL = people.filter(p=>((priorityLists||{})[p]||[]).some(x=>x.t==="task"&&x.k===kind&&x.tid===task.id)); return (
              <span style={{position:"relative",display:"inline-flex"}}>
                <button type="button" title="Personal priorities: add this task to someone's personal priorities in User Lists" onClick={()=>setPrPop(o=>!o)} style={{display:"inline-flex",alignItems:"center",gap:5,background:inL.length?"rgba(255,214,10,.15)":"transparent",border:`1px solid ${inL.length?"rgba(255,214,10,.55)":T.border2}`,color:inL.length?"#ffd60a":T.text3,borderRadius:999,padding:"3px 10px",fontSize:11,fontWeight:700,cursor:"pointer",fontFamily:"inherit"}}><Icon n="star" size={11}/>Personal priorities{inL.length?` (${inL.length})`:""}</button>
                <Pop open={prPop} onClose={()=>setPrPop(false)} width={230} align="right">
                  <div style={{fontSize:10.5,color:T.text3,fontWeight:700,textTransform:"uppercase",letterSpacing:"0.08em",padding:"4px 8px 6px"}}>In the personal priorities of</div>
                  <div style={{maxHeight:260,overflowY:"auto"}}>
                  {people.map(p=>{ const on=inL.includes(p); return (
                    <div key={p} onClick={()=>onTogglePriority(p)} style={{display:"flex",alignItems:"center",gap:8,padding:"6px 8px",borderRadius:8,cursor:"pointer",fontSize:13,color:T.text}} onMouseEnter={e=>e.currentTarget.style.background="rgba(var(--ovc),.08)"} onMouseLeave={e=>e.currentTarget.style.background="transparent"}>
                      <span style={{width:15,height:15,borderRadius:4,border:`1.5px solid ${on?"#ffd60a":T.border2}`,background:on?"#ffd60a":"transparent",color:"#0e0e0e",fontSize:11,fontWeight:800,display:"inline-flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>{on?"✓":""}</span>
                      <Avatar name={p} size={20}/>{p}
                    </div>); })}
                  </div>
                </Pop>
              </span>); })()}
            {!isNew && (
              <>
                <button title="More" onClick={()=>setMenu(m=>!m)} style={{background:"transparent",border:"none",cursor:"pointer",color:T.text2,padding:6,borderRadius:8,display:"flex"}}><Icon n="more" size={16}/></button>
                {menu && (
                  <div style={{position:"absolute",top:"100%",right:34,zIndex:50,background:T.surface2,border:`1px solid ${T.border2}`,borderRadius:10,padding:4,minWidth:170,boxShadow:"0 10px 30px rgba(0,0,0,.6)"}}>
                    <div onClick={()=>{setMenu(false);onArchive(task.id);}} style={{display:"flex",alignItems:"center",gap:8,padding:"7px 10px",borderRadius:7,cursor:"pointer",fontSize:12,color:T.text}} onMouseEnter={e=>e.currentTarget.style.background="rgba(var(--ovc),.07)"} onMouseLeave={e=>e.currentTarget.style.background="transparent"}><Icon n="archive" size={13}/>Archive</div>
                    <ConfirmBtn label="Delete task" confirmLabel="Click again to delete" onConfirm={()=>{setMenu(false);onDelete(task.id);}} style={{display:"flex",alignItems:"center",gap:8,width:"100%",padding:"7px 10px",borderRadius:7,cursor:"pointer",fontSize:12,color:"#ff6b6b",background:"transparent",border:"1px solid transparent",fontFamily:"inherit",textAlign:"left"}}/>
                  </div>
                )}
              </>
            )}
            <button title="Close" onClick={onClose} style={{background:"transparent",border:"none",cursor:"pointer",color:T.text2,padding:6,borderRadius:8,display:"flex"}}><Icon n="x" size={16}/></button>
          </div>
        </div>
        <div style={{flex:1,minHeight:0,overflowY:"auto"}}>
          {/* main */}
          <div style={{display:"flex",flexDirection:"column"}}>
            <div style={{padding:"20px 24px 14px"}}>
              <input ref={titleRef} value={t.title||""} onChange={e=>set("title",e.target.value)} onKeyDown={e=>{ if(isNew && e.key==="Enter" && t.title?.trim()) onCreate(draft); }} placeholder="Task name"
                style={{width:"100%",background:"transparent",border:"none",outline:"none",color:T.text,fontSize:22,fontWeight:700,fontFamily:"inherit",padding:"2px 0",marginBottom:14,letterSpacing:"-0.01em"}}/>
              <div style={{display:"grid",gridTemplateColumns:"minmax(0,1.6fr) minmax(0,1fr)",gap:"2px 24px"}}>
                <div>
                  <PropRow icon="check" label="Status">
                    <StatusPill cfg={pCfg} status={t.status||"todo"} onChange={v=>isNew?set("status",v):onStatus(task.id,v)}/>
                    {!isNew && <button title="Mark complete" onClick={()=>onStatus(task.id,"completed")} style={{width:26,height:26,borderRadius:"50%",border:`1px solid ${T.border2}`,background:"transparent",color:T.text2,cursor:"pointer",display:"inline-flex",alignItems:"center",justifyContent:"center"}}><Icon n="check" size={13}/></button>}
                  </PropRow>
                  <PropRow icon="calendar" label="Dates">
                    <input type="date" className="ghost-in" value={t.start||""} onChange={e=>set("start",e.target.value)} style={{...inStyle,width:118,fontSize:12,padding:"5px 4px"}}/>
                    <span style={{color:T.text3,fontSize:12}}>→</span>
                    <input type="date" className="ghost-in" value={t.deadline||""} onChange={e=>set("deadline",e.target.value)} style={{...inStyle,width:118,fontSize:12,padding:"5px 4px",color:isOverdue(t.deadline)?"#ff6b6b":T.text}}/>
                  </PropRow>
                  <PropRow icon="tag" label="Tags">
                    {tags.map(x=><TagChip key={x} tag={x} onRemove={()=>set("tags",tags.filter(y=>y!==x))}/>)}
                    <span style={{position:"relative",display:"inline-flex"}}>
                      <button type="button" onClick={()=>setTagPop(o=>!o)} style={{background:"transparent",border:`1px dashed ${T.border2}`,borderRadius:999,padding:"2px 10px",fontSize:11,color:T.text3,cursor:"pointer",fontFamily:"inherit"}}>+ Tag</button>
                      <Pop open={tagPop} onClose={()=>setTagPop(false)} width={290}><TagPicker tags={tags} onChange={v=>set("tags",v)}/></Pop>
                    </span>
                  </PropRow>
                </div>
                <div>
                  <PropRow icon="users" label="Assignees">
                    <PeoplePicker value={asg(t)} onChange={l=>setPeople("assignees",l)} people={people} onAddPerson={onAddPerson} addLabel="Assign"/>
                  </PropRow>
                  <PropRow icon="users" label="Watchers">
                    <PeoplePicker value={wch(t)} onChange={l=>setPeople("watchers",l)} people={people} onAddPerson={onAddPerson} addLabel="Watch"/>
                  </PropRow>
                  <PropRow icon="flag" label="Priority">
                    <Icon n="flag" size={14} style={{color:PR[prio(t)].color}}/>
                    <select className="ghost-in" value={prio(t)} onChange={e=>set("priority",e.target.value)} style={selStyle}>{PRIORITIES.map(p=><option key={p.key} value={p.key}>{p.label}</option>)}</select>
                  </PropRow>
                  {secList && <PropRow icon="tag" label="Section"><select className="ghost-in" value={t[secField]||KINDS[kind].defType} onChange={e=>set(secField,e.target.value)} style={selStyle}>{secList.map(s=>(<option key={s.key} value={s.key}>{s.label}</option>))}</select></PropRow>}
                </div>
              </div>
            </div>
            <div style={{padding:"4px 24px 16px",borderTop:`1px solid ${T.border}`}}>
              <AutoTA className="ghost-in" value={t.notes||""} onChange={v=>set("notes",v)} placeholder="Add description" maxLines={12} style={{fontSize:14,padding:"12px 8px",minHeight:56}}/>
            </div>
            <div style={{padding:"4px 24px",borderTop:`1px solid ${T.border}`}}><PropRow icon="subtask" label="Parent task">
              <select className="ghost-in" value={t.parentId||""} onChange={e=>set("parentId",e.target.value||null)} style={{...selStyle,maxWidth:360}}>
                <option value="">None (top-level)</option>
                {getParents(t.cId, isNew?null:task.id).map(p=><option key={p.id} value={p.id}>{p.title}</option>)}
              </select>
            </PropRow></div>
            {!isNew && allTasks && <TaskLinks kind={kind} task={task} allTasks={allTasks} onLink={(r,x)=>onLink(r,x)} onUnlink={onUnlink} onOpen={onOpenLinked}/>}
            <div style={{padding:"16px 24px 18px",borderTop:`1px solid ${T.border}`}}>
              <SectionHead title="Subtasks" count={isNew?undefined:subtasks.length}/>
              {isNew ? <div style={{fontSize:12,color:T.text3}}>Create the task first, then add subtasks.</div> : (
                <div style={{border:`1px solid ${T.border}`,borderRadius:12,overflow:"hidden"}}>
                  {subtasks.map(s=>(
                    <div key={s.id} onClick={()=>onOpenTask(s)} style={{display:"flex",alignItems:"center",gap:10,padding:"9px 14px",borderBottom:`1px solid ${T.border}`,cursor:"pointer"}} onMouseEnter={e=>e.currentTarget.style.background="rgba(var(--ovc),.04)"} onMouseLeave={e=>e.currentTarget.style.background="transparent"}>
                      <span style={{width:8,height:8,borderRadius:"50%",background:statusOf(kind,s.status).bg,flexShrink:0}}/>
                      <span style={{flex:1,fontSize:13,color:T.text,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{s.title}</span>
                      {asg(s).length>0 && <AvatarStack names={asg(s)} size={18}/>}
                      <div onClick={e=>e.stopPropagation()}><StatusPill cfg={cfg} status={s.status} onChange={v=>onStatus(s.id,v)} compact/></div>
                    </div>
                  ))}
                  <div style={{display:"flex",alignItems:"center",gap:10,padding:"10px 14px",color:T.text3}}>
                    <Icon n="plus" size={14}/>
                    <input value={subIn} onChange={e=>setSubIn(e.target.value)} onKeyDown={e=>{ if(e.key==="Enter"&&subIn.trim()){onAddSub(subIn.trim());setSubIn("");} }} placeholder="Add subtask (press Enter)" style={{flex:1,background:"transparent",border:"none",outline:"none",color:T.text,fontSize:13,fontFamily:"inherit"}}/>
                  </div>
                </div>
              )}
              {isNew && (
                <div style={{marginTop:22,display:"flex",gap:8,justifyContent:"flex-end"}}>
                  <Btn onClick={onClose}>Cancel</Btn>
                  <Btn variant="primary" disabled={!t.title?.trim()} onClick={()=>onCreate(draft)}>Create task</Btn>
                </div>
              )}
            </div>
          </div>
          {/* activity */}
          <div style={{display:"flex",flexDirection:"column",borderTop:`1px solid ${T.border}`}}>
            <div style={{padding:"14px 24px 4px",display:"flex",alignItems:"center",gap:8,fontSize:11,fontWeight:700,letterSpacing:"0.1em",textTransform:"uppercase",color:T.text2,flexShrink:0}}>
              Comments <span style={{color:T.text3,fontWeight:600}}>{comments.length}</span>
              <span style={{marginLeft:"auto",textTransform:"none",letterSpacing:0,fontWeight:500,color:T.text4}}>latest first</span>
            </div>
            <div style={{padding:"10px 24px 6px"}}>
              {comments.length===0 && <div style={{textAlign:"center",color:T.text3,fontSize:12,margin:"8px 0 12px"}}>{isNew?"Create the task to start the conversation.":"No comments yet."}</div>}
              {comments.map(c=>(
                <div key={c.id} className="cm" style={{display:"flex",gap:10,marginBottom:14}}>
                  <Avatar name={c.author} size={26}/>
                  <div style={{minWidth:0,flex:1}}>
                    <div style={{display:"flex",alignItems:"center",gap:8,fontSize:12}}>
                      <b style={{color:T.text,fontWeight:700}}>{c.author}</b><span style={{color:T.text3,fontSize:11}}>{timeAgo(c.at)}</span>
                      {c.author===CURRENT_USER && <button className="cm-x" title="Delete comment" onClick={()=>onDeleteComment(task.id,c.id)} style={{marginLeft:"auto",background:"none",border:"none",cursor:"pointer",color:T.text3,padding:0,display:"flex"}}><Icon n="x" size={12}/></button>}
                    </div>
                    <div style={{fontSize:13,color:T.text2,lineHeight:1.5,whiteSpace:"pre-wrap",wordBreak:"break-word",marginTop:2}}>{c.text}</div>
                  </div>
                </div>
              ))}
            </div>
            <div style={{padding:"4px 24px 20px"}}>
              <div style={{border:`1px solid ${T.border2}`,borderRadius:14,background:T.surface2,padding:"6px 8px 8px",opacity:isNew?0.5:1}}>
                <AutoTA value={cmt} onChange={setCmt} placeholder={isNew?"Create the task first":"Write a comment (Enter to send)"} maxLines={5} style={{fontSize:13}}
                  onKeyDown={e=>{ if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendComment();} }}/>
                <div style={{display:"flex",justifyContent:"flex-end",marginTop:4}}>
                  <Btn size="sm" variant="primary" disabled={isNew||!cmt.trim()} onClick={sendComment}><Icon n="send" size={11}/>Comment</Btn>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

// ── New task dialog (modelled on the Supercomms "Create task" dialog) ──────
function Chip({icon, label, active, danger, onClick, children, style}) {
  return (
    <button type="button" onClick={onClick} style={{display:"inline-flex",alignItems:"center",gap:7,background:active?"rgba(var(--ovc),.10)":"transparent",border:`1px solid ${active?T.border2:T.border2}`,borderRadius:999,padding:"6px 13px",cursor:"pointer",color:T.text,fontSize:13,fontFamily:"inherit",fontWeight:500,whiteSpace:"nowrap",...style}}>
      {icon && <Icon n={icon} size={14} style={{color:T.text2}}/>}{label}{children}
    </button>
  );
}
function Pop({open, onClose, children, width=240, align="left", up}) {
  const ref = useRef();
  useEffect(()=>{

}

var SHARED_FIELDS = [["website","websiteUrl"],["supercomms","supercomms"],["otherLinks","otherLinks"]];
function reconcileShared(r,t) {
  const res = {...EMPTY_RESOURCES,...(r||{})}, tech = {...EMPTY_CLIENT_TECH,...(t||{})};
  SHARED_FIELDS.forEach(([a,b])=>{ const v = res[a] || tech[b] || ""; res[a]=v; tech[b]=v; });
  return {res, tech};
}

function ComboBox({value, onChange, opts, placeholder, onAdd}) {
  const [open, setOpen] = useState(false);
  const [query, setQuery] = useState(value||"");
  const ref = useRef();
  useEffect(()=>{ setQuery(value||""); },[value]);
  useEffect(()=>{
    const h = e => { if(ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener("mousedown",h);
    return ()=>document.removeEventListener("mousedown",h);
  },[]);
  const filtered = query ? opts.filter(o=>o.toLowerCase().includes(query.toLowerCase())) : opts;
  const isNew = onAdd && query.trim() && !opts.find(o=>o.toLowerCase()===query.trim().toLowerCase());
  return (
    <div ref={ref} style={{position:"relative"}}>
      <div style={{position:"relative"}}>
        <input value={query} onChange={e=>{setQuery(e.target.value);onChange(e.target.value);setOpen(true);}} onFocus={()=>setOpen(true)}
          placeholder={placeholder} style={{...INP,paddingRight:30}}/>
        <button type="button" onClick={()=>setOpen(o=>!o)} style={{position:"absolute",right:8,top:"50%",transform:"translateY(-50%)",background:"none",border:"none",cursor:"pointer",color:T.text3,fontSize:12,padding:2,lineHeight:1}}>{open?"▴":"▾"}</button>
      </div>
      {open && (filtered.length>0 || isNew) && (
        <div style={{position:"absolute",top:"calc(100% + 3px)",left:0,right:0,zIndex:800,background:T.surface2,border:`1px solid ${T.border}`,borderRadius:6,overflow:"hidden auto",maxHeight:200,boxShadow:"0 10px 30px rgba(0,0,0,.6)",animation:"fadeIn .1s ease"}}>
          {filtered.map(o=>(
            <div key={o} onClick={()=>{onChange(o);setQuery(o);setOpen(false);}}
              style={{padding:"7px 12px",cursor:"pointer",fontSize:12,color:o===value?T.accent:T.text,background:o===value?"rgba(79,127,255,.1)":"transparent"}}
              onMouseEnter={e=>e.currentTarget.style.background="rgba(var(--ovc),.08)"}
              onMouseLeave={e=>e.currentTarget.style.background=o===value?"rgba(79,127,255,.1)":"transparent"}>
              {o}
            </div>

            <div onClick={()=>{onAdd(query.trim());onChange(query.trim());setOpen(false);}}
              style={{padding:"7px 12px",cursor:"pointer",fontSize:12,color:T.accent,borderTop:filtered.length?`1px solid ${T.border}`:"none",display:"flex",alignItems:"center",gap:7}}

  );

const SOCIAL_STATUSES = ['Active','Onboarding','Boosting Only','Archive'];

const SOCIAL_BADGE = {active:"#22c55e",onboarding:"#2563eb",boosting:"#0891b2",archive:"#64748b",unset:"#64748b"};
const PIP = {ok:"#22c55e",warn:"#f59e0b",late:"#ef4444",unknown:"#6b7280"};

function normalizeSop(sop) {
  if (sop.body === undefined) {
    if (Array.isArray(sop.bullets)) sop.body = sop.bullets.map(b=>'• '+b).join('\n');
    else if (Array.isArray(sop.steps)) {
      const stepLines = sop.steps.map(s=>`• ${(s.letter||'').toUpperCase()}: ${s.text}`);
      const flagLines = (sop.flags||[]).map(f=>'• '+f.text);
      sop.body = [...stepLines, ...flagLines].join('\n');
    } else sop.body = '';
  }
  delete sop.bullets; delete sop.steps; delete sop.flags; delete sop.type;
  return sop;
}
function normalizeSocialClient(c) {
  if (!Array.isArray(c.platformsList)) c.platformsList = (c.platforms||'').split(',').map(s=>s.trim()).filter(Boolean);
  if (!c.scope) c.scope = {Copywriting:'',Design:'',Scheduling:''};
  if (c.lastpass===undefined) c.lastpass = 'Not yet confirmed';
  if (c.lastpassNotes===undefined) c.lastpassNotes = '';
  if (!c.errorLog) c.errorLog = [];
  if (c.aiAgentLink===undefined) c.aiAgentLink = '';
  if (c.boostedNote===undefined) c.boostedNote = '';
  return c;
}
function freshSocial() {
  return {
    seedVersion: SOCIAL_SEED_VERSION,
    clients: SOCIAL_CLIENTS.map(c=>normalizeSocialClient(JSON.parse(JSON.stringify(c)))),
    sops: DEFAULT_SOPS.map(s=>normalizeSop({...s}))
  };
}
function socialStatusKey(status) {
  const s = (status||'').toLowerCase();
  if (s.includes('active') && !s.includes('boost')) return 'active';
  if (s.includes('onboard')) return 'onboarding';
  if (s.includes('boost')) return 'boosting';
  if (s.includes('archive')) return 'archive';
  return 'unset';
}
function daysUntil(dateStr) {
  if (!dateStr) return null;
  const d = new Date(dateStr + 'T00:00:00');
  if (isNaN(d.getTime())) return null;
  const t = new Date(); t.setHours(0,0,0,0);
  return Math.round((d - t) / 86400000);
}
// Buffer gauge: <0 overdue, <=7 start now (late), <=14 coming up (warn), else ok
function gaugeFor(client) {
  const days = daysUntil(client.nextPost);
  if (days === null) return {cls:'unknown', text:'Unscheduled', days:null};
  if (days < 0) return {cls:'late', text:Math.abs(days)+'d overdue', days};
  if (days <= 7) return {cls:'late', text:days+'d, start now', days};
  if (days <= 14) return {cls:'warn', text:days+'d, coming up', days};
  return {cls:'ok', text:days+'d buffer', days};
}
function computePulse(allClients) {
  const clients = allClients.filter(c=>socialStatusKey(c.status)!=='archive');
  const totalWeek = clients.reduce((s,c)=>s+(parseInt(c.postsWeek)||0),0);
  const totalMonth = clients.reduce((s,c)=>s+(parseInt(c.postsMonth)||0),0);
  const allErrors = [];
  clients.forEach(c=>(c.errorLog||[]).forEach(e=>allErrors.push(e)));
  let lastError = null;
  allErrors.forEach(e=>{
    if (e.date) { const d = new Date(e.date+'T00:00:00'); if (!isNaN(d) && (!lastError || d>lastError)) lastError = d; }
  });
  let daysNoError = '-';
  if (lastError) { const t = new Date(); t.setHours(0,0,0,0); daysNoError = Math.max(0, Math.round((t-lastError)/86400000)); }
  const atRisk = clients.filter(c=>{ const g = gaugeFor(c); return g.cls==='warn'||g.cls==='late'; }).length;
  return {totalWeek,totalMonth,clientCount:clients.length,errorCount:allErrors.length,daysNoError,atRisk};
}

}
function Gauge({client}) {
  const g = gaugeFor(client);
  return <span style={{display:"inline-flex",alignItems:"center",gap:7,fontFamily:"'IBM Plex Mono',ui-monospace,monospace",fontSize:11,color:T.text2,whiteSpace:"nowrap"}}><span style={{width:8,height:8,borderRadius:"50%",background:PIP[g.cls],flexShrink:0}}/>{g.text}</span>;
}

const MONO = "'IBM Plex Mono',ui-monospace,monospace";

// ── Social dash (main view) ────────────────────────────────────────────────
function SocialDash({social, upd, activeId, setActiveId, sync, retrySync}) {
  const clients = social.clients, sops = social.sops;
  const [filter, setFilter] = useState("at-risk");
  const [q, setQ] = useState("");
  const [archiveOpen, setArchiveOpen] = useState(false);
  const [sopsOpen, setSopsOpen] = useState(true);
  const [openSops, setOpenSops] = useState({});
  const updS = fn => upd(d=>fn(d.social));
  const p = computePulse(clients);

  const visible = clients
    .filter(c=>socialStatusKey(c.status)!=="archive")
    .filter(c=>{
      if (filter==="all") return true;
      if (filter==="at-risk") { const g = gaugeFor(c); return g.cls==="warn"||g.cls==="late"; }
      return socialStatusKey(c.status)===filter;
    })
    .filter(c=>c.name.toLowerCase().includes(q.toLowerCase()))
    .sort((a,b)=>{
      if (filter==="at-risk") {
        const da = daysUntil(a.nextPost), db = daysUntil(b.nextPost);
        if (da===null && db===null) return a.name.localeCompare(b.name);
        if (da===null) return 1;
        if (db===null) return -1;
        return da-db;
      }
      return a.name.localeCompare(b.name);
    });
  const archived = clients.filter(c=>socialStatusKey(c.status)==="archive").sort((a,b)=>a.name.localeCompare(b.name));

  const addClient = () => {
    const c = normalizeSocialClient({id:"sm_"+uid(),name:"New Client",platformsList:[],contact:"",calendarLink:"",finalPost:"",nextPost:"",cadence:"",status:"Active",postsWeek:0,postsMonth:0,boosted:"Not specified",boostedNote:"",scope:{Copywriting:"",Design:"",Scheduling:""},aiAgentLink:"",lastpass:"Not yet confirmed",lastpassNotes:"",notes:"",errorLog:[]});
    updS(s=>{s.clients.push(c);});
    setActiveId(c.id);
  };
  const addSop = () => {
    const id = "sop_"+uid();
    updS(s=>{s.sops.push({id,title:"New SOP",body:""});});
    setSopsOpen(true); setOpenSops(o=>({...o,[id]:true}));
  };
  const setSop = (id,f,v) => updS(s=>{const x=s.sops.find(z=>z.id===id); if(x) x[f]=v;});

  const tiles = [
    ["Posts This Week",p.totalWeek,"#22c55e"],
    ["Posts This Month",p.totalMonth,"#0891b2"],
    ["Clients Tracked",p.clientCount,T.accent],
    ["Priority (≤7d)",p.atRisk,"#ef4444"],
    ["Errors Logged",p.errorCount,null],
    ["Days w/o Error",p.daysNoError,null]
  ];
  const chips = [["all","All"],["active","Active"],["onboarding","Onboarding"],["at-risk","Priority (≤7d)"]];
  const anyOpen = sops.some(s=>openSops[s.id]);

  return (
    <div style={{height:"100%",overflowY:"auto",background:T.bg}}>
      <div style={{maxWidth:1180,margin:"0 auto",padding:"22px 24px 60px"}}>
        <div style={{marginBottom:20}}>
          <div style={{fontFamily:MONO,fontSize:11,letterSpacing:"0.14em",color:T.text2,fontWeight:600,marginBottom:4}}>ORGANIC SOCIAL OPERATIONS</div>
          <div style={{fontSize:26,fontWeight:700,color:T.text,letterSpacing:"-0.01em"}}>Social Media</div>
          <div style={{fontSize:12,color:T.text2,marginTop:6,display:"flex",alignItems:"center",gap:8}}>Live <span style={{color:T.border2}}>|</span> Editable <span style={{color:T.border2}}>|</span> Firebase-synced <span style={{color:T.border2}}>|</span> {(()=>{const st=sync&&sync.state||"offline"; const col=st==="synced"?"#22c55e":st==="offline"?"#ef4444":"#f59e0b"; const label=st==="synced"?"Synced to cloud":st==="saving"?"Saving…":st==="connecting"?"Connecting…":"Saved locally, cloud unreachable"; return <span title={sync&&sync.msg||""} style={{display:"inline-flex",alignItems:"center",gap:6,fontFamily:MONO}}><span style={{width:7,height:7,borderRadius:"50%",background:col}}/>{label}{st==="offline" && <button onClick={retrySync} style={{background:"none",border:`1px solid ${T.border}`,color:T.text2,borderRadius:999,padding:"1px 8px",cursor:"pointer",fontFamily:MONO,fontSize:10}}>Retry</button>}</span>;})()}</div>
        </div>

        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(150px,1fr))",gap:1,background:T.border,border:`1px solid ${T.border}`,borderRadius:12,overflow:"hidden",marginBottom:18}}>
          {tiles.map(([label,val,col])=>(
            <div key={label} style={{background:T.surface,padding:"16px 16px",boxShadow:col?`inset 3px 0 0 ${col}`:"none"}}>
              <div style={{fontFamily:MONO,fontSize:10,letterSpacing:"0.08em",color:T.text2,textTransform:"uppercase",marginBottom:8}}>{label}</div>
              <div style={{fontSize:28,fontWeight:700,color:T.text,fontVariantNumeric:"tabular-nums"}}>{val}</div>
            </div>
          ))}
        </div>

        {/* Compact SOPs */}
        <div style={{background:T.surface,border:`1px solid ${T.border}`,borderRadius:12,marginBottom:18,overflow:"hidden"}}>
          <div style={{display:"flex",alignItems:"center",gap:10,padding:"10px 14px"}}>
            <button onClick={()=>setSopsOpen(o=>!o)} style={{display:"flex",alignItems:"center",gap:8,background:"none",border:"none",cursor:"pointer",color:T.text,fontFamily:MONO,fontSize:11,letterSpacing:"0.14em",fontWeight:600,textTransform:"uppercase",padding:0}}>
              <Icon n="chevron" size={12} style={{transform:`rotate(${sopsOpen?90:0}deg)`,transition:"transform .15s"}}/>SOPs <span style={{color:T.text3}}>{sops.length}</span>
            </button>
            {sopsOpen && sops.length>0 && <button onClick={()=>{const next=!anyOpen; const o={}; sops.forEach(s=>{o[s.id]=next;}); setOpenSops(o);}} style={{background:"none",border:"none",cursor:"pointer",color:T.text3,fontSize:11,fontFamily:"inherit"}}>{anyOpen?"Collapse all":"Expand all"}</button>}
            <Btn size="sm" style={{marginLeft:"auto"}} onClick={addSop}><Icon n="plus" size={11}/>Add SOP</Btn>
          </div>
          {sopsOpen && (
            <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(340px,1fr))",gap:8,padding:"0 12px 12px"}}>
              {sops.length===0 && <div style={{fontSize:12,color:T.text3,padding:"4px 6px"}}>No SOPs yet.</div>}
              {sops.map(s=>{
                const open = !!openSops[s.id];
                const firstLine = (s.body||"").split("\n").find(l=>l.trim())||"Empty";
                return (
                  <div key={s.id} style={{gridColumn:open?"1 / -1":"auto",background:T.surface2,border:`1px solid ${T.border}`,borderRadius:10,overflow:"hidden"}}>
                    <div style={{display:"flex",alignItems:"center",gap:8,padding:"8px 10px"}}>
                      <button onClick={()=>setOpenSops(o=>({...o,[s.id]:!open}))} title={open?"Collapse":"Expand"} style={{background:"none",border:"none",cursor:"pointer",color:T.text2,padding:2,display:"flex"}}><Icon n="chevron" size={12} style={{transform:`rotate(${open?90:0}deg)`,transition:"transform .15s"}}/></button>
                      <input className="ghost-in" value={s.title} onChange={e=>setSop(s.id,"title",e.target.value)} style={{flex:"0 1 auto",minWidth:90,width:Math.max(90,s.title.length*8.5),maxWidth:"60%",background:"transparent",border:"none",outline:"none",color:T.text,fontSize:13,fontWeight:700,fontFamily:"inherit",padding:"3px 6px",borderRadius:6}}/>
                      {!open && <span style={{flex:1,minWidth:0,fontSize:11,color:T.text3,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{firstLine}</span>}
                      <ConfirmBtn label="×" confirmLabel="Delete?" onConfirm={()=>updS(x=>{x.sops=x.sops.filter(z=>z.id!==s.id);})} title="Delete this SOP"
                        style={{marginLeft:open?"auto":0,background:"none",border:`1px solid ${T.border}`,color:T.text3,borderRadius:999,minWidth:22,height:22,padding:"0 7px",cursor:"pointer",fontSize:12,lineHeight:1,fontFamily:"inherit"}}/>
                    </div>
                    {open && <div style={{padding:"0 10px 10px"}}><AutoTA className="ghost-in" value={s.body} onChange={v=>setSop(s.id,"body",v)} placeholder="Write the steps for this SOP" maxLines={9} style={{fontSize:13,lineHeight:1.65}}/></div>}
                  </div>
                );
              })}
            </div>
          )}
        </div>

        {/* Toolbar */}
        <div style={{display:"flex",gap:10,alignItems:"center",marginBottom:14,flexWrap:"wrap"}}>
          <input className="ghost-in" value={q} onChange={e=>setQ(e.target.value)} placeholder="Search clients…" style={{flex:1,minWidth:180,padding:"9px 14px",border:`1px solid ${T.border}`,borderRadius:10,fontFamily:"inherit",fontSize:13,background:T.surface,color:T.text,outline:"none"}}/>
          <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
            {chips.map(([k,l])=>(
              <button key={k} onClick={()=>setFilter(k)} style={{fontFamily:MONO,fontSize:11,padding:"7px 12px",borderRadius:999,border:`1px solid ${filter===k?"var(--inv)":T.border}`,background:filter===k?"var(--inv)":T.surface,cursor:"pointer",color:filter===k?"var(--inv-fg)":T.text2,fontWeight:filter===k?700:400,whiteSpace:"nowrap",transition:"all .15s"}}>{l}</button>
            ))}
          </div>
          <Btn variant="primary" onClick={addClient}><Icon n="plus" size={12}/>Add Client</Btn>
        </div>

        {/* Client list */}
        <div>
          {visible.length===0 && <div style={{textAlign:"center",padding:"50px 20px",color:T.text3}}>No clients match this view.</div>}
          {visible.map(c=>{
            const hasOpenError = (c.errorLog||[]).some(e=>e.resolved==='N');
            const lpUnconfirmed = c.lastpass!=='Confirmed in LastPass' && c.lastpass!=='N/A';
            const isActive = activeId===c.id;
            return (
              <div key={c.id} onClick={()=>setActiveId(c.id)} className="sm-row"
                style={{display:"flex",alignItems:"center",gap:14,padding:"13px 18px",cursor:"pointer",background:T.surface,border:`1px solid ${isActive?"var(--inv)":T.border}`,borderRadius:12,marginBottom:8,transition:"background .15s,border-color .15s"}}>
                <Icon n="chevron" size={12} style={{color:T.text3}}/>
                <span style={{fontWeight:600,fontSize:15,color:T.text,flex:1,minWidth:120,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{c.name||"Untitled client"}</span>
                <SocialBadge status={c.status}/>
                <Gauge client={c}/>
                <span style={{display:"inline-flex",alignItems:"center",gap:6,minWidth:36,justifyContent:"flex-end"}}>
                  {hasOpenError && <span title="Unresolved error logged" style={{color:"#ef4444",display:"flex"}}><Icon n="alert" size={14}/></span>}
                  {lpUnconfirmed && <span title="LastPass not confirmed" style={{color:T.text3,display:"flex"}}><Icon n="lock" size={13}/></span>}
                </span>
              </div>
            );
          })}
        </div>

        {/* Archive */}
        <div style={{marginTop:24}}>
          <button onClick={()=>setArchiveOpen(o=>!o)} style={{display:"inline-flex",alignItems:"center",gap:8,fontFamily:MONO,fontSize:12,fontWeight:600,color:T.text,background:T.surface2,border:`1px solid ${T.border}`,borderRadius:999,padding:"9px 16px",cursor:"pointer"}}>
            <Icon n="archive" size={13}/>Archive <span style={{color:T.text3}}>({archived.length})</span><Icon n="chevron" size={10} style={{transform:`rotate(${archiveOpen?90:0}deg)`,transition:"transform .15s"}}/>
          </button>
          {archiveOpen && (
            <div style={{marginTop:10}}>
              {archived.length===0 && <div style={{fontSize:12,color:T.text3,padding:"10px 4px"}}>No archived clients.</div>}
              {archived.map(c=>(
                <div key={c.id} style={{display:"flex",alignItems:"center",gap:12,background:T.surface,border:`1px solid ${T.border}`,borderRadius:10,padding:"10px 16px",marginBottom:8}}>
                  <span style={{fontWeight:600,fontSize:14,color:T.text,flex:1}}>{c.name}</span>
                  <div style={{display:"flex",gap:8}}>
                    <button onClick={()=>updS(s=>{const x=s.clients.find(z=>z.id===c.id); if(x) x.status="Active";})} style={{fontFamily:MONO,fontSize:11,borderRadius:8,padding:"6px 10px",cursor:"pointer",border:`1px solid ${T.border}`,background:"none",color:"#22c55e"}}>Restore</button>
                    <ConfirmBtn label="Delete permanently" confirmLabel="Sure? Cannot undo" onConfirm={()=>{updS(s=>{s.clients=s.clients.filter(z=>z.id!==c.id);}); if(activeId===c.id) setActiveId(null);}} style={{fontFamily:MONO,fontSize:11,borderRadius:8,padding:"6px 10px",cursor:"pointer",border:`1px solid ${T.border}`,background:"none",color:"#ef4444"}}/>
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

// ── Social client slide-over panel ─────────────────────────────────────────
function SPSection({icon, label, action, children}) {
  return (
    <div style={{marginTop:24}}>
      <div style={{display:"flex",alignItems:"center",gap:7,fontFamily:MONO,fontSize:10.5,letterSpacing:"0.09em",textTransform:"uppercase",color:T.text2,fontWeight:600,marginBottom:8}}>
        <Icon n={icon} size={14}/>{label}{action && <span style={{marginLeft:"auto"}}>{action}</span>}
      </div>
      {children}
    </div>
  );
}
function SPRow({label, children}) {
  return (
    <div style={{display:"flex",alignItems:"center",gap:14,padding:"8px 2px",borderBottom:`1px solid ${T.border}`}}>
      <div style={{flex:"0 0 40%",fontSize:11.5,color:T.text2,fontWeight:500}}>{label}</div>
      <div style={{flex:1,minWidth:0}}>{children}</div>
    </div>
  );
}

function SocialPanel({client:c, upd, onClose}) {
  const [editingLink, setEditingLink] = useState(null);
  const [platIn, setPlatIn] = useState("");
  useEffect(()=>{ const h = e => { if(e.key==="Escape") onClose(); }; window.addEventListener("keydown",h); return ()=>window.removeEventListener("keydown",h); },[]);
  const me = d => d.social.clients.find(z=>z.id===c.id);
  const set = (f,v) => upd(d=>{const x=me(d); if(x) x[f]=v;});
  const setScope = (k,v) => upd(d=>{const x=me(d); if(x){x.scope=x.scope||{}; x.scope[k]=v;}});
  const setErr = (i,f,v) => upd(d=>{const x=me(d); if(x&&x.errorLog[i]) x.errorLog[i][f]=v;});
  const addPlat = () => { const v = platIn.replace(/,/g,"").trim(); if(!v) return; upd(d=>{const x=me(d); if(x){x.platformsList.push(v); x.platforms=x.platformsList.join(", ");}}); setPlatIn(""); };
  const g = gaugeFor(c);
  const inp = {width:"100%",border:"none",background:"transparent",fontFamily:"inherit",fontSize:13.5,color:T.text,padding:"6px 8px",borderRadius:6,outline:"none"};
  const statusColor = SOCIAL_BADGE[socialStatusKey(c.status)];

  const linkChip = (field, accessLabel, addLabel) => {
    const val = c[field]||"";
    if (editingLink===field) {
      const save = () => { const el = document.getElementById("lnk-"+field); set(field,(el&&el.value||"").trim()); setEditingLink(null); };
      return (
        <span style={{display:"inline-flex",alignItems:"center",gap:6}}>
          <input id={"lnk-"+field} className="ghost-in" autoFocus defaultValue={val} placeholder="https://…" onKeyDown={e=>{ if(e.key==="Enter"){e.preventDefault();save();} if(e.key==="Escape") setEditingLink(null); }} style={{...inp,minWidth:170,background:T.surface2,width:"auto"}}/>
          <button onClick={save} style={{background:"#22c55e",color:"#fff",border:"none",width:26,height:26,borderRadius:"50%",cursor:"pointer",flexShrink:0,display:"flex",alignItems:"center",justifyContent:"center"}}><Icon n="check" size={13}/></button>
        </span>
      );
    }
    if (val) return (
      <span style={{display:"inline-flex",alignItems:"center",gap:6}}>
        <a href={val} target="_blank" rel="noreferrer" style={{display:"inline-flex",alignItems:"center",gap:6,background:"rgba(123,104,238,.16)",border:"1px solid rgba(123,104,238,.4)",color:"#b9aeff",fontFamily:MONO,fontSize:11,fontWeight:600,padding:"5px 12px",borderRadius:999,textDecoration:"none",whiteSpace:"nowrap"}}>{accessLabel} ↗</a>
        <button onClick={()=>setEditingLink(field)} title="Edit link" style={{background:"none",border:`1px solid ${T.border}`,color:T.text2,width:24,height:24,borderRadius:"50%",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}><Icon n="edit" size={11}/></button>
      </span>
    );
    return <button onClick={()=>setEditingLink(field)} style={{fontFamily:MONO,fontSize:11,color:T.text,background:"none",border:`1px dashed ${T.border2}`,borderRadius:999,padding:"5px 12px",cursor:"pointer",whiteSpace:"nowrap"}}>+ Add {addLabel}</button>;
  };

  return (
    <>
      <div onClick={onClose} style={{position:"fixed",inset:0,background:"rgba(0,0,0,.55)",zIndex:60}}/>
      <div style={{position:"fixed",top:0,right:0,height:"100vh",width:560,maxWidth:"94vw",background:T.surface,borderLeft:`1px solid ${T.border2}`,boxShadow:"-16px 0 40px rgba(0,0,0,.4)",zIndex:61,overflowY:"auto",animation:"slideInRight .25s ease"}}>
        <div style={{position:"sticky",top:0,background:T.surface,padding:"22px 26px 16px",borderBottom:`1px solid ${T.border}`,zIndex:2}}>
          <button onClick={onClose} title="Close" style={{position:"absolute",top:16,right:16,width:30,height:30,borderRadius:"50%",border:`1px solid ${T.border}`,background:T.surface,color:T.text2,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}><Icon n="x" size={14}/></button>
          <input className="ghost-in" value={c.name} onChange={e=>set("name",e.target.value)} style={{fontWeight:700,fontSize:22,color:T.text,border:"none",background:"transparent",width:"88%",padding:"4px 6px",borderRadius:8,outline:"none",fontFamily:"inherit"}}/>
          <div style={{display:"flex",alignItems:"center",gap:12,marginTop:12,flexWrap:"wrap"}}>
            <select value={c.status} onChange={e=>set("status",e.target.value)} style={{appearance:"none",border:"none",borderRadius:999,padding:"6px 14px",fontFamily:MONO,fontSize:10.5,fontWeight:600,letterSpacing:"0.06em",textTransform:"uppercase",color:"#fff",cursor:"pointer",background:statusColor,outline:"none"}}>
              {SOCIAL_STATUSES.map(s=><option key={s} value={s}>{s}</option>)}
            </select>
            <Gauge client={c}/>
          </div>
        </div>
        <div style={{padding:"8px 26px 50px"}}>
          <SPSection icon="grid" label="Client Details" action={linkChip("calendarLink","Access Content Calendar","Calendar Link")}>
            <SPRow label="Platform(s)">
              <div style={{display:"flex",flexWrap:"wrap",gap:6,alignItems:"center"}}>
                {c.platformsList.map((pl,i)=>(
                  <span key={pl+i} style={{display:"inline-flex",alignItems:"center",gap:6,background:T.surface2,border:`1px solid ${T.border}`,color:T.text,fontSize:12,padding:"4px 6px 4px 12px",borderRadius:999,whiteSpace:"nowrap"}}>{pl}
                    <button onClick={()=>upd(d=>{const x=me(d); if(x){x.platformsList.splice(i,1); x.platforms=x.platformsList.join(", ");}})} style={{background:"none",border:"none",color:T.text3,cursor:"pointer",padding:"0 2px",display:"flex"}}><Icon n="x" size={10}/></button>
                  </span>
                ))}
                <input className="ghost-in" value={platIn} onChange={e=>setPlatIn(e.target.value)} onKeyDown={e=>{ if(e.key==="Enter"||e.key===","){e.preventDefault();addPlat();} }} placeholder="+ Add platform" style={{...inp,minWidth:110,flex:1,width:"auto",borderRadius:999,fontSize:13}}/>
              </div>
            </SPRow>
            <SPRow label="Point of Contact"><AutoTA className="ghost-in" value={c.contact||""} onChange={v=>set("contact",v)} maxLines={3} style={{fontSize:13.5}}/></SPRow>
            <SPRow label="Posting Cadence"><AutoTA className="ghost-in" value={c.cadence||""} onChange={v=>set("cadence",v)} maxLines={3} style={{fontSize:13.5}}/></SPRow>
            <SPRow label="Final Post Date (Cutoff)"><input type="date" className="ghost-in" value={c.finalPost||""} onChange={e=>set("finalPost",e.target.value)} style={inp}/></SPRow>
            <SPRow label="Next Scheduled Post"><input type="date" className="ghost-in" value={c.nextPost||""} onChange={e=>set("nextPost",e.target.value)} style={inp}/></SPRow>
          </SPSection>

          <SPSection icon="users" label="Scope & Ownership">
            <SPRow label="Copywriting">
              <div style={{display:"flex",alignItems:"center",gap:6}}>
                <input className="ghost-in" value={(c.scope||{}).Copywriting||""} onChange={e=>setScope("Copywriting",e.target.value)} placeholder="Assigned to…" style={{...inp,flex:1,minWidth:0}}/>
                <span style={{color:T.border2}}>·</span>
                {linkChip("aiAgentLink","Access Agent","Agent Link")}
              </div>
            </SPRow>
            <SPRow label="Content Creation"><input className="ghost-in" value={(c.scope||{}).Design||""} onChange={e=>setScope("Design",e.target.value)} placeholder="Assigned to…" style={inp}/></SPRow>
            <SPRow label="Scheduling"><input className="ghost-in" value={(c.scope||{}).Scheduling||""} onChange={e=>setScope("Scheduling",e.target.value)} placeholder="Assigned to…" style={inp}/></SPRow>
          </SPSection>

          <SPSection icon="lock" label="Account Security">
            <SPRow label="Login details secured in LastPass?">
              <select className="ghost-in" value={c.lastpass} onChange={e=>set("lastpass",e.target.value)} style={{...inp,cursor:"pointer"}}>{LASTPASS_OPTIONS.map(o=><option key={o} value={o}>{o}</option>)}</select>
            </SPRow>
            {c.lastpass!=="N/A" && <SPRow label="Vault / Folder Notes"><input className="ghost-in" value={c.lastpassNotes||""} onChange={e=>set("lastpassNotes",e.target.value)} placeholder="e.g. Shared-Clients folder" style={inp}/></SPRow>}
          </SPSection>

          <SPSection icon="megaphone" label="Monthly Boosted Content">
            <SPRow label="Expected?"><select className="ghost-in" value={c.boosted} onChange={e=>set("boosted",e.target.value)} style={{...inp,cursor:"pointer"}}>{BOOST_OPTIONS.map(o=><option key={o} value={o}>{o}</option>)}</select></SPRow>
            <SPRow label="Detail"><AutoTA className="ghost-in" value={c.boostedNote||""} onChange={v=>set("boostedNote",v)} maxLines={3} style={{fontSize:13.5}}/></SPRow>
          </SPSection>

          <SPSection icon="bars" label="This Client's Volume">
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0 18px"}}>
              <SPRow label="This Week"><input type="number" min="0" className="ghost-in" value={c.postsWeek||0} onChange={e=>set("postsWeek",parseInt(e.target.value)||0)} style={inp}/></SPRow>
              <SPRow label="This Month"><input type="number" min="0" className="ghost-in" value={c.postsMonth||0} onChange={e=>set("postsMonth",parseInt(e.target.value)||0)} style={inp}/></SPRow>
